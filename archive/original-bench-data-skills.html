<script>
/* ============================================================
   MOTION — springs parameterised the way Apple parameterises
   them: damping ratio + response, not mass/stiffness/damping.

   The reason this is a spring and not a CSS transition: a
   transition cannot be grabbed mid-flight. A spring animates
   from its *current* value and carries its *current* velocity
   through a re-target, so reversing a gesture never produces
   the velocity discontinuity that reads as a brick wall.
   ============================================================ */
const REDUCED = (typeof matchMedia === 'function')
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : {matches:false, addEventListener(){}, addListener(){}};

class Spring {
  constructor(value, {damping = 1.0, response = 0.4, onFrame, onRest} = {}){
    this.v = value; this.target = value; this.vel = 0;
    this.damping = damping; this.response = response;
    this.onFrame = onFrame; this.onRest = onRest;
    this.raf = null; this.running = false;
  }
  get omega(){ return (2 * Math.PI) / this.response; }
  /* Re-target WITHOUT resetting velocity — this is what makes a
     reversal continuous instead of a hard cut. */
  to(target, {velocity, damping, response} = {}){
    this.target = target;
    if(velocity !== undefined) this.vel = velocity;
    if(damping !== undefined) this.damping = damping;
    if(response !== undefined) this.response = response;
    if(REDUCED.matches){ this.set(target); return this; }
    this.start(); return this;
  }
  /* Jump with no motion — used for 1:1 drag tracking, where the
     value must be exactly the finger, not a spring chasing it. */
  set(value){
    this.stop(); this.v = value; this.target = value; this.vel = 0;
    this.onFrame && this.onFrame(this.v); return this;
  }
  /* Feed live velocity in while dragging so release can hand off. */
  track(value, vel){
    this.stop(); this.v = value; this.vel = vel || 0;
    this.onFrame && this.onFrame(this.v); return this;
  }
  start(){
    if(this.running) return;
    this.running = true;
    let last = performance.now();
    const step = now => {
      const dt = Math.min((now - last) / 1000, 1/20); last = now;
      this.advance(dt);
      this.onFrame && this.onFrame(this.v);
      if(Math.abs(this.vel) < 0.06 && Math.abs(this.v - this.target) < 0.06){
        this.v = this.target; this.vel = 0; this.running = false; this.raf = null;
        this.onFrame && this.onFrame(this.v);
        this.onRest && this.onRest();
        return;
      }
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  /* Closed-form solution, not numerical integration. Euler at a
     real 60Hz frame silently ate ~92% of the overshoot at damping
     0.8 — the bounce vanished on actual hardware, and a 120Hz
     display behaved differently from a 60Hz one. This is exact
     and frame-rate independent. */
  advance(dt){
    const w = this.omega, z = this.damping;
    const x0 = this.v - this.target, v0 = this.vel;
    let x, v;
    if(z < 1){
      const wd = w * Math.sqrt(1 - z*z);
      const e = Math.exp(-z * w * dt);
      const c = Math.cos(wd * dt), s = Math.sin(wd * dt);
      const A = x0, B = (v0 + z*w*x0) / wd;
      x = e * (A*c + B*s);
      v = e * ((B*wd - z*w*A)*c - (A*wd + z*w*B)*s);
    } else if(z === 1){
      const e = Math.exp(-w * dt), k = v0 + w*x0;
      x = (x0 + k*dt) * e;
      v = (v0 - w*k*dt) * e;
    } else {
      const r = w * Math.sqrt(z*z - 1);
      const r1 = -z*w + r, r2 = -z*w - r;
      const c2 = (v0 - r1*x0) / (r2 - r1), c1 = x0 - c2;
      const e1 = Math.exp(r1*dt), e2 = Math.exp(r2*dt);
      x = c1*e1 + c2*e2;
      v = c1*r1*e1 + c2*r2*e2;
    }
    this.v = this.target + x;
    this.vel = v;
  }
  stop(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf=null; this.running=false; return this; }
}

/* Apple's momentum projection (Designing Fluid Interfaces sample
   code). Not the textbook v²/2a — the exponential-decay form. */
function project(velocity, decel = 0.998){
  return (velocity / 1000) * decel / (1 - decel);
}

/* Progressive resistance past a boundary. A hard stop reads as
   frozen; resistance reads as "responsive, nothing more here". */
function rubberband(overshoot, dimension, c = 0.55){
  return (overshoot * dimension * c) / (dimension + c * Math.abs(overshoot));
}

/* Velocity from a short history, not the last two points — one
   stray sample at release otherwise throws the whole handoff. */
class Tracker {
  constructor(){ this.pts = []; }
  add(x, y){
    const t = performance.now();
    this.pts.push({x, y, t});
    while(this.pts.length > 6 || (this.pts.length > 2 && t - this.pts[0].t > 110)) this.pts.shift();
  }
  velocity(axis = 'x'){
    if(this.pts.length < 2) return 0;
    const a = this.pts[0], b = this.pts[this.pts.length - 1];
    const dt = (b.t - a.t) / 1000;
    if(dt <= 0) return 0;
    return (b[axis] - a[axis]) / dt;
  }
  reset(){ this.pts = []; }
}

/* Press feedback fires on pointerdown. Waiting for click feels
   dead — and dragging away must cancel it, then coming back
   must restore it. */
function wirePress(root){
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest('.pressable');
    if(!el) return;
    el.dataset.press = '1';
    const clear = () => { delete el.dataset.press;
      window.removeEventListener('pointerup', clear);
      window.removeEventListener('pointercancel', clear); };
    window.addEventListener('pointerup', clear);
    window.addEventListener('pointercancel', clear);
  }, {passive:true});
}

/* Height animation for disclosure — springs the measured height,
   never a fixed-duration max-height guess. */
function springHeight(el, open){
  const target = open ? el.scrollHeight : 0;
  if(!el._sp){
    el._sp = new Spring(el.getBoundingClientRect().height, {
      damping:1.0, response:0.34,
      onFrame:v => { el.style.height = Math.max(0, v) + 'px'; }
    });
  }
  el.style.overflow = 'hidden';
  el._sp.to(target);
  el._sp.onRest = () => { if(open) el.style.height = 'auto'; };
}

<script>
/* ============================================================
   SUCCESS — delight as the result of getting the rest right,
   not confetti tacked on.

   Three senses fire on the SAME frame (causality + harmony):
   the seal springs in, the check draws itself, the device taps.
   Reserved for a first correct answer only — celebrating every
   re-check would train you to ignore it (utility).
   ============================================================ */
function celebrate(msg, sub){
  const host = document.getElementById('verdict');
  if(!host) return;
  const done = doneCount();
  host.className = 'verdict pass';
  host.innerHTML = `
    <div class="cel">
      <div class="cel-seal" id="celSeal">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="cel-ring" cx="22" cy="22" r="19"/>
          <path class="cel-tick" d="M13 22.5l6 6 12-13"/>
        </svg>
      </div>
      <div class="cel-txt">
        <b>${msg}</b>
        <span>${sub}</span>
      </div>
    </div>`;

  /* open the container first so nothing below jumps */
  host.style.height='auto'; const h=host.scrollHeight; host.style.height='0px';
  if(!host._sp) host._sp=new Spring(0,{damping:1.0,response:0.36,
    onFrame:x=>{host.style.height=Math.max(0,x)+'px'; host.style.opacity=Math.min(1,x/Math.max(h*.5,1));}});
  host._sp.to(h);

  if(REDUCED.matches){
    const s=document.getElementById('celSeal');
    if(s){ s.style.transform='scale(1)'; s.style.opacity='1';
      const p=s.querySelector('.cel-tick'); if(p) p.style.strokeDashoffset='0'; }
    return;
  }

  const seal=document.getElementById('celSeal');
  const tick=seal && seal.querySelector('.cel-tick');
  const len = tick ? tick.getTotalLength ? tick.getTotalLength() : 30 : 30;
  if(tick){ tick.style.strokeDasharray=len; tick.style.strokeDashoffset=len; }

  /* the seal arrives with a little bounce — earned, because this
     is a moment of achievement, not an idle state change */
  new Spring(0,{damping:0.72,response:0.42,
    onFrame:v=>{ if(!seal) return;
      seal.style.transform='scale('+v.toFixed(3)+')';
      seal.style.opacity=Math.min(1,v*1.6).toFixed(3);
      if(tick) tick.style.strokeDashoffset=(len*Math.max(0,1-(v-0.35)/0.6)).toFixed(2);
    }}).to(1);

  /* same frame as the visual, not after it */
  try{ if(navigator.vibrate) navigator.vibrate(done%3===0?[12,40,18]:12); }catch(e){}
}

/* Ticks in the sidebar and the progress grid spring in rather
   than appearing, so you can see which one just changed. */
function popTick(el){
  if(!el || REDUCED.matches) return;
  new Spring(0.4,{damping:0.68,response:0.36,
    onFrame:v=>el.style.transform='scale('+v.toFixed(3)+')'}).to(1);
}

function syncLesson(t,l){

/* Lesson completion is derived, never authoritative on its own.
   Reconcile once at boot so a stale or hand-edited store cannot

function reconcile(){
  let changed=false;
  Object.keys(state.done).forEach(k=>{
    if(!/^[a-z]+-\d+$/.test(k)) return;
    const [t,l]=[k.split('-')[0], +k.split('-')[1]];

  excel:[['Excel function list','https://support.microsoft.com/en-us/office/excel-functions-alphabetical-b3944572-255d-4efb-bb96-c6d90033e188']],
  r:[['dplyr reference','https://dplyr.tidyverse.org/reference/index.html'],['ggplot2 book','https://ggplot2-book.org/']],
  pbi:[['DAX reference','https://learn.microsoft.com/en-us/dax/dax-function-reference'],['Power Query docs','https://learn.microsoft.com/en-us/power-query/']]}[t]||[];
  return L.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('');}

/* ---------- lesson ---------- */
function exTabs(){
  const list=exList(state.track,state.level), c=curEx();
  return `<div class="exbar">${list.map((_,i)=>
    `<button class="extab pressable ${exDone(state.track,state.level,i)?'solved':''}"
       data-ex="${i}" aria-current="${i===c}" aria-label="Exercise ${i+1}">${i+1}</button>`).join('')}
    <span class="exlabel">${exCount(state.track,state.level)} of ${list.length} solved</span></div>`;
}
function peekHTML(id){
  const P=PREVIEW[id]; if(!P) return '';
  let rows=P.rows.map(r=>'<tr>'+r.map(v=>'<td class="'+(typeof v==='number'?'n':'')+'">'+esc(String(v))+'</td>').join('')+'</tr>').join('');
  return `<div class="peek" data-peek>
    <button class="peek-h pressable soft" data-peektoggle>
      <span class="cv">${CHEV}</span><b>${esc(P.title)}</b><span class="sp"></span><span>the data</span></button>
    <div class="peek-b">
      <div style="overflow:auto"><table class="g"><thead><tr>${
        P.cols.map(c=>'<th>'+esc(c)+'</th>').join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="peek-n">${esc(P.note)}</div>
    </div></div>`;
}
function lessonHTML(){
  const t=T(state.track), L=LESSONS[key(state.track,state.level)], i=posOf(state.track,state.level);
  const E=exList(state.track,state.level)[curEx()] || {task:L.task,data:null};
  return `<div class="eyebrow">${GY(t.id)} ${t.name} · ${LEVELS[state.level]} · ${i+1} of ${LESSON_TOTAL()}</div>
    <h1 class="t-hero">${L.title}</h1>
    <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">
      <span class="pill l${state.level+1}">${LEVELS[state.level]}</span>
      ${isDone(state.track,state.level)?`<span class="pill done">Completed</span>`
        :`<span class="pill" style="background:var(--bg-sunk);color:var(--label-3)">${exCount(state.track,state.level)}/${exList(state.track,state.level).length} solved</span>`}
    </div>
    <div class="scen t-sub">${L.scenario}</div>
    <div class="grp"><h3 class="t-head">How it works</h3><div class="prose t-body">${L.concept}</div></div>
    ${L.example?`<div class="grp"><h3 class="t-head">Worked example</h3>
      <div class="pane"><div class="pane-bar">${paneLabel(state.track)}<span class="sp"></span>
        ${(state.track==='sql'||state.track==='python')?'<button class="btn qui pressable" id="copyex" style="height:24px;padding:0 8px;font-size:12.5px">Copy to editor</button>':''}</div>
        <textarea class="code" readonly rows="${Math.min(15,L.example.split('\n').length+1)}">${esc(L.example)}</textarea>
        ${L.output?`<div class="out"><div class="outmsg">${esc(L.output)}</div></div>`:''}
      </div></div>`:''}
    <div class="grp"><h3 class="t-head">Your turn</h3>
      ${exTabs()}
      ${peekHTML(E.data)}
      <div class="prose t-body" style="margin-bottom:13px">${E.task}</div>
      <div id="workspace"></div>
      <div class="verdict" id="verdict"></div>
      <div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn sec pressable" id="hintbtn">Hint</button>
        <button class="btn sec pressable" id="solbtn">Solution</button>
        <button class="btn ${exDone(state.track,state.level,curEx())?'sec':'pri'} pressable" id="donebtn">
          ${exDone(state.track,state.level,curEx())?'Mark not done':'Mark solved'}</button>
      </div>
    </div>`;
}
function paneLabel(t){return{sql:'query.sql',python:'analysis.py',excel:'formula',r:'script.R',pbi:'notes'}[t];}

function renderLesson(){
  deck.innerHTML=lessonHTML();
  buildWorkspace();
  const c=document.getElementById('copyex');
  if(c) c.onclick=()=>{const ta=document.getElementById('userin');
    if(ta){ta.value=LESSONS[key(state.track,state.level)].example; ta.focus();}};
  const E=exList(state.track,state.level)[curEx()]||{};
  document.getElementById('hintbtn').onclick=()=>verdict('hint','<b>Hint.</b> '+E.hint);
  document.getElementById('solbtn').onclick=()=>verdict('hint','<b>One correct answer.</b><pre>'+esc(E.solution||'')+'</pre>');
  document.getElementById('donebtn').onclick=()=>{
    const i=curEx(), k=exKey(state.track,state.level,i);
    if(state.done[k]) delete state.done[k]; else state.done[k]=Date.now();
    syncLesson(state.track,state.level);
    renderTree(); renderRail(); hdr(); renderLesson();
  };
  deck.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{
    setEx(+b.dataset.ex); renderLesson();
  });
  const pk=deck.querySelector('[data-peektoggle]');
  if(pk) pk.onclick=()=>{
    const box=pk.closest('[data-peek]'), body=box.querySelector('.peek-b');
    const open=!box.classList.contains('open');
    box.classList.toggle('open',open);
    springHeight(body,open);
  };
}
/* Verdict springs its own height open — no layout jump, and it is
   interruptible if the user immediately checks again. */
function verdict(kind,html){
  const v=document.getElementById('verdict');
  if(!v) return;
  v.className='verdict '+kind; v.innerHTML=html;
  v.style.height='auto'; const h=v.scrollHeight; v.style.height='0px';
  if(!v._sp) v._sp=new Spring(0,{damping:1.0,response:0.36,
    onFrame:x=>{v.style.height=Math.max(0,x)+'px'; v.style.opacity=Math.min(1,x/Math.max(h*.5,1));}});
  v._sp.to(h);
}
const exSolvedTotal=()=>{let n=0;TRACKS.forEach(t=>[0,1,2].forEach(l=>n+=exCount(t.id,l)));return n;};
/* Totals are derived from ENABLED, so dropping a track cannot leave
   a stale "45" anywhere in the interface. */
const EX_TOTAL     = () => TRACKS.length*3*3;
const LESSON_TOTAL = () => TRACKS.length*3;
const AUTO_CHECKED = () => TRACKS.filter(t=>['sql','python','excel'].includes(t.id)).length*9;
function hdr(){ const e=document.getElementById('hdone'); if(e) e.textContent=exSolvedTotal();
  const tt=document.getElementById('htot'); if(tt) tt.textContent=EX_TOTAL(); }

/* ---------- swipe deck: 1:1 tracking, rubber-band, momentum ---------- */
const deckX=new Spring(0,{damping:1.0,response:0.36,
  onFrame:v=>{deck.style.transform='translate3d('+v+'px,0,0)';
    deck.style.opacity=(1-Math.min(Math.abs(v)/900,0.32)).toFixed(3);}});
const hintL=document.getElementById('hintL'), hintR=document.getElementById('hintR');

function goto(t,l,dir){
  const from=posOf(state.track,state.level);
  const wasHome = state.view!=='learn';
  state.track=t; state.level=l; state.view='learn'; state.open[t]=true; paintTrack(t);
  /* goto() bypasses render(), so the welcome deck's scroll lock and
     observer must be released here too — otherwise the lesson loads
     inside a body that cannot scroll. */
  teardownWelcome();
  const to=posOf(t,l);
  const d = wasHome ? 0 : (dir!==undefined ? dir : (to>from?1:to<from?-1:0));
  renderTree(); renderRail(); hdr(); syncNav();
  renderLesson();
  if(d!==0){
    /* enter from the side it came from — symmetric paths */
    deckX.track(d*46, 0);
    deckX.to(0,{damping:1.0,response:0.4});
  } else deckX.to(0);
  main.scrollIntoView({block:'start',behavior:REDUCED.matches?'auto':'smooth'});
}

(function wireSwipe(){
  const tr=new Tracker();
  let active=false, startX=0, startY=0, base=0, axis=null, pid=null;
  const W=()=>Math.min(innerWidth,760);

  deck.addEventListener('pointerdown',e=>{
    if(state.view!=='learn') return;
    if(e.target.closest('textarea,input,button,a,.out,select')) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    active=true; axis=null; pid=e.pointerId;
    startX=e.clientX; startY=e.clientY; base=deckX.v;
    deckX.stop(); tr.reset(); tr.add(e.clientX,e.clientY);
  });
  deck.addEventListener('pointermove',e=>{
    if(!active||e.pointerId!==pid) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    /* detect direction once, ~10px hysteresis, then commit */
    if(axis===null){
      if(Math.abs(dx)<10 && Math.abs(dy)<10) return;
      axis = Math.abs(dx)>Math.abs(dy)*1.25 ? 'x' : 'y';
      if(axis==='x') deck.setPointerCapture(pid);
    }
    if(axis!=='x') return;
    e.preventDefault();
    tr.add(e.clientX,e.clientY);
    const i=posOf(state.track,state.level);
    let x=base+dx;
    /* resistance at the two ends of the whole path */
    if((i===0&&x>0)||(i===ORDER.length-1&&x<0)) x=rubberband(x,W());
    deckX.track(x, tr.velocity('x'));
    const p=Math.min(Math.abs(x)/110,1);
    hintL.style.opacity = x>0 && i>0 ? p : 0;
    hintR.style.opacity = x<0 && i<ORDER.length-1 ? p : 0;
  });
  const end=e=>{
    if(!active||(e&&e.pointerId!==pid)) return;
    const wasX=axis==='x'; active=false; axis=null;
    hintL.style.opacity=0; hintR.style.opacity=0;
    if(!wasX) return;
    const v=tr.velocity('x');
    /* project where the flick is GOING, don't snap from where it stopped */
    const projected=deckX.v+project(v);
    const i=posOf(state.track,state.level);
    let step=0;
    if(projected<-W()*0.30 && i<ORDER.length-1) step=1;
    else if(projected>W()*0.30 && i>0) step=-1;
    if(step!==0){
      const [t,l]=ORDER[i+step];
      /* fling out at the finger's velocity, then the new lesson
         enters from the matching side */
      deckX.to(-step*W()*0.55,{velocity:v,damping:1.0,response:0.28});
      setTimeout(()=>goto(t,l,-step), REDUCED.matches?0:150);
    } else {
      /* settle back — bounce only because a gesture carried momentum */
      deckX.to(0,{velocity:v,damping:0.82,response:0.34});
    }
  };
  deck.addEventListener('pointerup',end);
  deck.addEventListener('pointercancel',end);
  addEventListener('keydown',e=>{
    if(state.view!=='learn') return;
    const el=e.target;
    if(el && typeof el.closest==='function' && el.closest('textarea,input')) return;
    const i=posOf(state.track,state.level);
    if(e.key==='ArrowRight'&&i<ORDER.length-1){const[t,l]=ORDER[i+1];goto(t,l,1);}
    if(e.key==='ArrowLeft'&&i>0){const[t,l]=ORDER[i-1];goto(t,l,-1);}
  });
})();

/* ---------- sidebar sheet: drags 1:1, projects on release ---------- */
const sideX=new Spring(-290,{damping:1.0,response:0.34,
  onFrame:v=>{ side.style.transform='translate3d('+v+'px,0,0)';
    const p=1-Math.min(Math.abs(v)/290,1);
    scrim.style.opacity=p*0.42; scrim.classList.toggle('live',p>0.02); }});
let sheetOpen=false;
const isMobile=()=>innerWidth<=860;
function openSheet(o,vel){
  sheetOpen=o;
  sideX.to(o?0:-290,{velocity:vel,damping:1.0,response:0.34});
  document.getElementById('menu').setAttribute('aria-expanded',o);
}
document.getElementById('menu').onclick=()=>openSheet(!sheetOpen);
scrim.onclick=()=>openSheet(false);
(function wireSheet(){
  const tr=new Tracker(); let on=false,sx=0,sy=0,base=0,ax=null,pid=null;
  const grab=e=>{
    if(!isMobile()) return;
    const fromEdge = !sheetOpen && e.clientX<26;
    if(!sheetOpen && !fromEdge) return;
    if(sheetOpen && !side.contains(e.target) && e.target!==scrim) return;
    on=true; ax=null; pid=e.pointerId; sx=e.clientX; sy=e.clientY;
    base=sideX.v; sideX.stop(); tr.reset(); tr.add(e.clientX,e.clientY);
  };
  addEventListener('pointerdown',grab,{passive:true});
  addEventListener('pointermove',e=>{
    if(!on||e.pointerId!==pid) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(ax===null){ if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
      ax=Math.abs(dx)>Math.abs(dy)?'x':'y'; if(ax!=='x'){on=false;return;} }
    tr.add(e.clientX,e.clientY);
    let x=base+dx;
    if(x>0) x=rubberband(x,290);          /* can't drag past open */
    if(x<-290) x=-290+rubberband(x+290,290);
    sideX.track(Math.min(0,x), tr.velocity('x'));
  },{passive:true});
  const done=e=>{
    if(!on||(e&&e.pointerId!==pid)) return;
    on=false; if(ax!=='x') return;
    const v=tr.velocity('x');
    const projected=sideX.v+project(v);
    /* velocity sign decides, not position — a fast flick commits
       even from a small displacement */
    openSheet(projected > -145, v);
  };
  addEventListener('pointerup',done); addEventListener('pointercancel',done);
})();
addEventListener('resize',()=>{ if(!isMobile()){ side.style.transform=''; scrim.style.opacity=0;
  scrim.classList.remove('live'); sheetOpen=false; } else sideX.set(sheetOpen?0:-290); });
</script>
<script>
/* ============================================================
   HOME — a horizontal ticker.
   One long sentence laid out in a single flex row, scrolled
   sideways by GSAP ScrollTrigger. Visual elements sit inline
   between the words, as punctuation, not as separate slides.
   ============================================================ */
var wST=null, wResize=null;

/* inline marks — sized to sit on the text baseline like glyphs */
const M = {
  spark: `<svg class="mk" viewBox="0 0 120 48" aria-hidden="true"><path d="M4 40 L24 26 L40 32 L60 12 L80 20 L116 4"
    fill="none" stroke="#E8913C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="116" cy="4" r="5" fill="#E8913C"/></svg>`,
  bars: `<svg class="mk" viewBox="0 0 96 48" aria-hidden="true">
    <rect x="2" y="26" width="14" height="22" rx="2" fill="#4FB3BE"/>
    <rect x="22" y="14" width="14" height="34" rx="2" fill="#4FB3BE"/>
    <rect x="42" y="4" width="14" height="44" rx="2" fill="#E8913C"/>
    <rect x="62" y="20" width="14" height="28" rx="2" fill="#4FB3BE"/>
    <rect x="82" y="32" width="12" height="16" rx="2" fill="#4FB3BE"/></svg>`,
  db: `<svg class="mk" viewBox="0 0 56 48" aria-hidden="true">
    <ellipse cx="28" cy="9" rx="24" ry="7" fill="none" stroke="#4FB3BE" stroke-width="3.5"/>
    <path d="M4 9 v30 c0 4 48 4 48 0 V9" fill="none" stroke="#4FB3BE" stroke-width="3.5"/>
    <path d="M4 22 c0 4 48 4 48 0" fill="none" stroke="#4FB3BE" stroke-width="3"/>
    <path d="M4 32 c0 4 48 4 48 0" fill="none" stroke="#4FB3BE" stroke-width="3" opacity=".65"/></svg>`,
  curve: `<svg class="mk wide" viewBox="0 0 180 48" aria-hidden="true"><path d="M2 40 C46 40 42 8 90 8 C138 8 134 40 178 40"
    fill="none" stroke="#2E6B72" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  arrow: `<svg class="mk" viewBox="0 0 88 48" aria-hidden="true"><path d="M2 24 H80 M64 10 L80 24 L64 38"
    fill="none" stroke="#E8913C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  seal: `<svg class="mk" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none"
    stroke="#7FD69A" stroke-width="3" opacity=".45"/><path d="M13 25 l7 7 l15 -16" fill="none" stroke="#7FD69A"
    stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  grid: `<svg class="mk" viewBox="0 0 60 48" aria-hidden="true">
    <rect x="2" y="4" width="56" height="40" rx="3" fill="none" stroke="#2E6B72" stroke-width="3"/>
    <path d="M2 18 h56 M2 31 h56 M21 4 v40 M40 4 v40" stroke="#2E6B72" stroke-width="2.4" opacity=".7"/></svg>`
};
/* Typographic voices. The sentence is not one size in one colour —
   scale, weight, hue and treatment shift word to word so it reads
   as a composition rather than a wall of display type. */
const w   = t => `<span class="tw">${t}</span>`;          /* body voice   */
const xl  = t => `<span class="tw x">${t}</span>`;        /* loudest      */
const em  = t => `<span class="tw em">${t}</span>`;       /* amber        */
const tl  = t => `<span class="tw tl">${t}</span>`;       /* teal         */
const out = t => `<span class="tw out">${t}</span>`;      /* outlined     */
const mk  = t => `<span class="tw hl"><i></i><b>${t}</b></span>`; /* marker */
const qt  = t => `<span class="tw qt">${t}</span>`;       /* quiet aside  */
const st  = (a,b2) => `<span class="stak"><span>${a}</span><span>${b2}</span></span>`;
const gap = n => `<span class="gp g${n}"></span>`;

function tickerItems(){
  const solved=exSolvedTotal(), TOT=EX_TOTAL(), LES=LESSON_TOTAL(), AUTO=AUTO_CHECKED();
  const chip=(id,label)=>`<button class="tk" style="--tg:var(--${id})" data-go="${id}:${firstUnsolved(id)}">
      <span class="tk-g">${GY(id)}</span><span class="tk-n">${label}</span>
      <span class="tk-c">${[0,1,2].reduce((a,l)=>a+exCount(id,l),0)}/9</span></button>`;
  const note=t=>`<span class="tn">${t}</span>`;
  const names=TRACKS.map(t=>t.name);
  const list = names.length>1 ? names.slice(0,-1).join(', ')+' and '+names.slice(-1) : names[0];

  return [
    qt('New to data?'), gap(1),
    xl('Almost'), out('everyone'), xl('here was.'), M.spark, gap(2),

    w('You do not need a degree,'), gap(1),
    qt('or any code at all,'), gap(1),
    mk('to begin'), gap(2),

    w('We teach the tools'), tl('employers'), M.grid, tl('actually ask for'), gap(1),
    st('one small,','finishable step'), w('at a time.'), gap(2),

    w('The data sits'), em('in front of you'), M.db, gap(1),
    w('— the task written the way a manager really sends it —'), gap(1),
    w('and your answer is'), mk('checked as you write it'), M.seal, gap(2),

    xl('Get it wrong'), gap(1), qt('and nothing is lost.'), gap(1),
    w('You are told'), out('why,'), w('and you go again.'), M.curve, gap(2),

    st(LES+' lessons,', TOT+' exercises'), M.bars, gap(1),
    tl('beginner to advanced,'), gap(1), em('at your pace.'), gap(2),

    qt('No account.'), gap(1), qt('Nothing to install.'), gap(1),
    xl('And it is'), mk('free'), M.arrow, gap(3),

    `<span class="tw close">Where would you like to start?</span>`, gap(2),
    `<span class="endpick">
       ${TRACKS.map(t=>chip(t.id,t.name)).join('')}
     </span>`,
    gap(2),
    `<span class="tnote">
       ${solved?note(solved+' of '+TOT+' solved so far — pick up anywhere.'):''}
       ${note('Covering '+list+'. '+AUTO+' of the '+TOT+' exercises are checked automatically against a correct answer.')}
       ${note(TRACKS.some(t=>t.id==='r')?'R has no browser runtime here, so those exercises are written answers compared against worked solutions.':'Every exercise here executes for real in your browser.')}
       ${note('Progress is stored in this browser only. Nothing is uploaded.')}
     </span>`,
    gap(3)
  ].join('');
}

function renderWelcome(){
  paintTrack('sql');
  document.documentElement.classList.add('label-mode');
  deck.innerHTML='';
  let host=document.getElementById('sdeck'); if(host) host.remove();
  host=document.createElement('div'); host.className='scrolldeck'; host.id='sdeck';
  document.body.appendChild(host);

  host.innerHTML=`
  <nav class="lnav">
    <span class="lwm">BENCH<i>.</i></span>
    <span class="sp"></span>
    <span class="navhint">scroll</span>
    <button class="lpill" data-go="sql:0">Start</button>
  </nav>
  <div class="twrap" id="twrap">
    <div class="tpin" id="tpin">
      <div class="trow" id="trow">${tickerItems()}</div>
      <div class="tprog"><i id="tbar"></i></div>
      <div class="tcue"><span>scroll</span>
        <svg width="34" height="10" viewBox="0 0 34 10" fill="none" stroke="currentColor" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h30m-6-4 6 4-6 4"/></svg></div>
    </div>
  </div>
`;

  wireTicker(host);
}

function wireTicker(sd){
  const wrap=sd.querySelector('#twrap'), pin=sd.querySelector('#tpin'),
        row=sd.querySelector('#trow'), bar=sd.querySelector('#tbar');
  if(!row) return;

  /* Reduced motion: no sideways hijack — the sentence wraps and
     reads top to bottom. The finished page, not a broken one. */
  if(REDUCED.matches){
    sd.classList.add('t-static');
    if(bar) bar.style.width='100%';
    return;
  }

  /* The bounce came from indirection. ScrollTrigger pinning inside a
     custom fixed scroller needs scrollerProxy, and that extra hop
     lags the real scroll position by a frame or two — which reads as
     lurching however low you set scrub. Native position:sticky plus a
     transform written straight from scrollTop has no hop at all: the
     row is exactly where the wheel says it should be, every frame. */
  let dist=0, ticking=false;
  const measure=()=>{
    const vw=sd.clientWidth||innerWidth, vh=sd.clientHeight||innerHeight;
    dist=Math.max(0,row.scrollWidth - vw + 40);
    wrap.style.height=(vh + dist)+'px';                /* scroll length == travel */
  };
  const draw=()=>{
    const p = dist>0 ? Math.min(1,Math.max(0,sd.scrollTop/dist)) : 1;
    row.style.transform='translate3d('+(-p*dist).toFixed(2)+'px,0,0)';
    if(bar) bar.style.width=(p*100).toFixed(2)+'%';
    ticking=false;
  };
  const onScroll=()=>{ if(!ticking){ ticking=true; requestAnimationFrame(draw); } };

  measure(); draw();
  sd.addEventListener('scroll',onScroll,{passive:true});
  if(wResize) removeEventListener('resize',wResize);
  wResize=()=>{ measure(); draw(); };
  addEventListener('resize',wResize);
  /* fonts land late and change the row width */
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{measure();draw();});
  wST={ kill(){ sd.removeEventListener('scroll',onScroll); } };
}

function teardownTicker(){
  if(window.ScrollTrigger){ try{ ScrollTrigger.getAll().forEach(t=>t.kill()); }catch(e){} }
  if(wST){ try{ wST.kill(); }catch(e){} wST=null; }
  if(wResize){ removeEventListener('resize',wResize); wResize=null; }
}

function wsPy(w,L){

Expected output for this exercise:
${esc(L.expect||'')}</div></div></div>`;
  const st=document.getElementById('pystate'), out=document.getElementById('out'),

/* Fires once per exercise, on the first correct answer only. */
function onSolved(detail){
  const t=state.track, l=state.level, i=curEx();

  const list=exList(t,l), left=list.length-exCount(t,l);

  if(lessonJustDone) sub = 'All '+list.length+' exercises in this lesson solved.';
  else if(left===1)  sub = detail+' One exercise left in this lesson.';
  else if(left>1)    sub = detail+' '+left+' left in this lesson.';

  const strip=deck.querySelector('.exbar');

  deck.innerHTML=`

    <div class="cta">
      ${resuming

           <span class="cta-note">${solved}/${EX_TOTAL()} solved${nxt?' · next: '+T(nxt.t).name.toLowerCase():''}</span>`

function firstUnsolved(tid){
  for(let l=0;l<3;l++) if(exCount(tid,l)<exList(tid,l).length) return l;
  return 0;
}


/* ============================================================
   HERO DEMO — types a query, then returns rows. The most
   characteristic thing in this product's world is a result set,
   so the hero shows one rather than describing one.
   Runs once per home visit; skipped entirely under reduced motion.
   ============================================================ */
var DEMO_SQL=[['SELECT','kw'],[' name, salary\n','tx'],['FROM','kw'],[' employees\n','tx'],
  ['WHERE','kw'],[' department = ','tx'],["'Data'",'st'],['\n','tx'],
  ['ORDER BY','kw'],[' salary ','tx'],['DESC','kw'],[';','tx']];
var DEMO_ROWS=[['Mei Chen','118,000'],['Luca Ferrari','96,000'],['Amira Haddad','82,000'],['Sara Novak','61,000']];
var demoTimer=null;
function runHeroDemo(){
  const q=document.getElementById('demoQ'), r=document.getElementById('demoR'), f=document.getElementById('demoF');
  if(!q) return;
  if(demoTimer){clearTimeout(demoTimer);demoTimer=null;}
  const paintRows=()=>{
    r.innerHTML='<table><thead><tr><th>name</th><th class="n">salary</th></tr></thead><tbody>'+
      DEMO_ROWS.map(([a,b])=>'<tr><td>'+a+'</td><td class="n">'+b+'</td></tr>').join('')+'</tbody></table>';
    f.textContent='4 rows · 0.6 ms';
  };
  if(REDUCED.matches){
    q.innerHTML=DEMO_SQL.map(([t,c])=>'<span class="'+c+'">'+t.replace(/\n/g,'<br>')+'</span>').join('');
    paintRows(); r.querySelectorAll('tr').forEach(tr=>tr.classList.add('in')); return;
  }
  q.innerHTML='<span class="caret"></span>'; r.innerHTML=''; f.textContent='';
  let seg=0, ch=0, html='';
  const tick=()=>{
    if(seg>=DEMO_SQL.length){
      q.innerHTML=html;
      f.textContent='running…';
      demoTimer=setTimeout(()=>{
        paintRows(); f.textContent='4 rows · 0.6 ms';
        [...r.querySelectorAll('tbody tr')].forEach((tr,i)=>
          setTimeout(()=>tr.classList.add('in'), i*70));   /* stagger, 70ms */
      },340);
      return;
    }
    const [txt,cls]=DEMO_SQL[seg];
    ch++;
    if(ch>txt.length){seg++;ch=0;demoTimer=setTimeout(tick,0);return;}
    const done=DEMO_SQL.slice(0,seg).map(([t,c])=>'<span class="'+c+'">'+t.replace(/\n/g,'<br>')+'</span>').join('');
    html=done+'<span class="'+cls+'">'+txt.slice(0,ch).replace(/\n/g,'<br>')+'</span>';
    q.innerHTML=html+'<span class="caret"></span>';
    demoTimer=setTimeout(tick, txt[ch-1]==='\n'?90:18);
  };
  demoTimer=setTimeout(tick,340);
}
</script>
