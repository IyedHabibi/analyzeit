<!DOCTYPE html>
<html lang="en" data-theme="light" data-track="sql">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench — data skills, built for the job</title>
<script>(function(){try{var t=localStorage.getItem('bench.theme');
if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';
if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Syne:wght@600;700;800&family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CONCEPT — "the result set".
   Dark frame, bright work surface: the way tools people sit in
   for hours are built. Identity comes from the subject's own
   vernacular — columns, hairline rules, tabular figures, and the
   moment a query returns rows.
   ============================================================ */
:root{
  /* the frame is dark in BOTH themes — it is chrome, not content */
  --frame:#0D1015; --frame-2:#151A21; --frame-line:rgba(255,255,255,.09);
  --frame-tx:#E8EAEE; --frame-tx2:rgba(232,234,238,.56); --frame-tx3:rgba(232,234,238,.32);

  --paper:#F5F5F2; --sheet:#FFFFFF; --sunk:#EDEDE8;
  --ink:#0E1116; --ink-2:#4A5058; --ink-3:#7C838C; --ink-4:#AEB4BB;
  --rule:#E2E2DC; --rule-2:#CFCFC7;

  --sql:#2B5CE6; --python:#B8710A; --excel:#0B7F45; --r:#0A7A8C; --pbi:#A82670;
  --sql-w:#EAF0FE; --python-w:#FCF3E2; --excel-w:#E6F5EC; --r-w:#E3F4F7; --pbi-w:#FBEAF3;

  --ok:#0B7F45; --ok-w:#E6F5EC;
  --warn:#8A5B00; --warn-w:#FCF3E2;
  --bad:#B3261E; --bad-w:#FBEAE8;

  --shade-1:0 1px 2px rgba(14,17,22,.05);
  --shade-2:0 1px 2px rgba(14,17,22,.05), 0 8px 24px -6px rgba(14,17,22,.10);
  --shade-3:0 2px 4px rgba(14,17,22,.06), 0 20px 50px -12px rgba(14,17,22,.20);
  --rx:6px; --rm:10px; --rl:14px;
  --hdr:56px;
  --eo:cubic-bezier(.23,1,.32,1); --eio:cubic-bezier(.77,0,.175,1); --edr:cubic-bezier(.32,.72,0,1);
  --tk:var(--sql); --tk-w:var(--sql-w);
  /* aliases — JS-authored inline styles reference these names */
  --label:var(--ink); --label-2:var(--ink-2); --label-3:var(--ink-3); --label-4:var(--ink-4);
  --bg-sunk:var(--sunk); --bg-elev:var(--sheet); --sep:var(--rule);
  --tint:var(--tk); --tint-bg:var(--tk-w);
}
html[data-track="python"]{--tk:var(--python);--tk-w:var(--python-w)}
html[data-track="excel"] {--tk:var(--excel); --tk-w:var(--excel-w)}
html[data-track="r"]     {--tk:var(--r);     --tk-w:var(--r-w)}
html[data-track="pbi"]   {--tk:var(--pbi);   --tk-w:var(--pbi-w)}
html[data-theme="dark"]{
  --paper:#0F1216; --sheet:#161A20; --sunk:#1D222A;
  --ink:#EDEFF2; --ink-2:#A2AAB4; --ink-3:#79818C; --ink-4:#565E68;
  --rule:#252B33; --rule-2:#333B45;
  --sql:#7C9CFF; --python:#E5A33C; --excel:#4ECB84; --r:#48C4D8; --pbi:#EC7FBB;
  --sql-w:#171E33; --python-w:#2A2013; --excel-w:#12261B; --r-w:#0F2429; --pbi-w:#2A1522;
  --ok:#4ECB84; --ok-w:#12261B; --warn:#E5A33C; --warn-w:#2A2013; --bad:#FF6F61; --bad-w:#2C1615;
  --shade-1:0 1px 2px rgba(0,0,0,.5);
  --shade-2:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -8px rgba(0,0,0,.6);
  --shade-3:0 4px 10px rgba(0,0,0,.5), 0 26px 60px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body.locked{overflow:hidden}
body{background:var(--paper);color:var(--ink);
  font:400 16px/1.5 Archivo,"Helvetica Neue",system-ui,sans-serif;letter-spacing:-.008em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
code,pre,textarea,.mono,input.mono,.num{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.num,table.g td.n,table.g th.n{font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--tk);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2.5px solid var(--tk);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* type scale — tracking is size-specific */
.t-hero{font-size:clamp(30px,4.6vw,44px);line-height:1.02;letter-spacing:-.038em;font-weight:800}
.t-title{font-size:26px;line-height:1.14;letter-spacing:-.028em;font-weight:800}
.t-head{font-size:17px;line-height:1.3;letter-spacing:-.016em;font-weight:700}
.t-body{font-size:16px;line-height:1.55;letter-spacing:-.008em}
.t-sub{font-size:14.5px;line-height:1.5;letter-spacing:-.004em}
.t-foot{font-size:12.5px;line-height:1.42;letter-spacing:0}
.t-cap{font-size:11px;line-height:1.3;letter-spacing:.07em;text-transform:uppercase;font-weight:700}

.pressable{transition:transform 110ms var(--eo),background-color 110ms linear,border-color 110ms linear}
.pressable[data-press="1"]{transform:scale(.97)}
.pressable.soft[data-press="1"]{transform:scale(.987)}

/* ---------- frame: header ---------- */
header{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:60;display:flex;align-items:center;
  gap:16px;padding:0 16px;background:var(--frame);color:var(--frame-tx);
  box-shadow:inset 0 -1px 0 var(--frame-line)}
.brandmark{display:flex;align-items:center;gap:10px}
.brandmark svg{display:block}
.brandmark .wm{font-size:19px;font-weight:800;letter-spacing:-.04em;color:var(--frame-tx)}
.brandmark .wm i{font-style:normal;color:var(--tk)}
nav{display:flex;gap:2px;margin-left:6px}
nav .seg{padding:7px 12px;border-radius:var(--rx);font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  color:var(--frame-tx2);position:relative}
nav .seg:hover{color:var(--frame-tx)}
nav .seg[aria-current="page"]{color:var(--frame-tx);background:var(--frame-2)}
nav .thumb{display:none}
.hspace{flex:1}
.count{font-size:12.5px;color:var(--frame-tx2);font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.count b{color:var(--frame-tx);font-weight:700}
.iconbtn{width:32px;height:32px;border-radius:var(--rx);display:grid;place-items:center;
  color:var(--frame-tx2);background:var(--frame-2)}
.iconbtn:hover{color:var(--frame-tx)}

/* ---------- frame: sidebar ---------- */
.shell{display:grid;grid-template-columns:246px minmax(0,1fr) 268px;padding-top:var(--hdr);min-height:100vh}
.side{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto;
  background:var(--frame);color:var(--frame-tx);padding:16px 10px 30px;
  box-shadow:inset -1px 0 0 var(--frame-line);scrollbar-width:thin}
body.locked .side-r,body.locked main{visibility:hidden}
/* #sdeck is mounted on <body>, never inside <main>, so the rule above cannot hide it */
.side-r{background:var(--paper);color:var(--ink);box-shadow:inset 1px 0 0 var(--rule);padding:20px 16px 30px}
main{padding:28px 34px 90px;max-width:800px;position:relative}
.railcap{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--frame-tx3);padding:0 10px 10px}

.trk{margin-bottom:1px}
.trk-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--rx);text-align:left}
.trk-btn:hover{background:var(--frame-2)}
.trk .glyph{width:20px;height:20px;flex:none;color:var(--tg)}
.trk-name{flex:1;font-size:14px;font-weight:600;letter-spacing:-.012em;color:var(--frame-tx)}
.trk-frac{font-size:11px;color:var(--frame-tx3);font-family:"JetBrains Mono",monospace}
.chev{width:10px;height:10px;color:var(--frame-tx3);flex:none}
.chev svg{display:block;transition:transform .28s var(--edr)}
.trk.open .chev svg{transform:rotate(90deg)}
.lvls{overflow:hidden;height:0}
.lvl{width:100%;display:flex;align-items:center;gap:9px;padding:7px 10px 7px 32px;border-radius:var(--rx);
  text-align:left;font-size:13px;color:var(--frame-tx2);letter-spacing:-.006em;font-weight:500}
.lvl:hover{background:var(--frame-2);color:var(--frame-tx)}
.lvl[aria-current="true"]{background:var(--frame-2);color:var(--frame-tx);font-weight:700;
  box-shadow:inset 2px 0 0 var(--tg,var(--tk))}
.tick{width:14px;height:14px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1.5px solid var(--frame-tx3);color:transparent}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--frame)}
.tick svg{width:8px;height:8px}
.side .btn.sec{background:var(--frame-2);color:var(--frame-tx2)}
.side .btn.sec:hover{color:var(--frame-tx)}

/* ---------- content ---------- */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tk);margin-bottom:11px}
.eyebrow .swatch,.plbl .swatch{display:none}
.eyebrow .gy{width:15px;height:15px;color:var(--tk)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--rx);
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  font-family:"JetBrains Mono",monospace}
.pill.l1{background:var(--ok-w);color:var(--ok)}
.pill.l2{background:var(--warn-w);color:var(--warn)}
.pill.l3{background:var(--bad-w);color:var(--bad)}
.pill.done{background:var(--ok-w);color:var(--ok)}

/* scenario: a quoted message, not another card */
.scen{margin:22px 0 28px;padding:0 0 0 20px;border-left:3px solid var(--tk);color:var(--ink-2)}
.scen b{color:var(--ink);font-weight:700}
.grp{margin:34px 0 0}
.grp > h3{margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:10px}
.grp > h3::after{content:'';flex:1}
.prose{max-width:66ch;color:var(--ink)}
.prose ul{margin:0 0 .85em;padding-left:20px}
.prose li{margin-bottom:.36em}
.prose code{background:var(--sunk);padding:1.5px 6px;border-radius:4px;font-size:13.5px}
.prose em{color:var(--ink-2);font-style:normal;font-weight:600}

/* ---------- panes: sharp, ruled, tool-like ---------- */
.pane{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--rm);overflow:hidden}
.pane-bar{display:flex;align-items:center;gap:9px;padding:0 13px;height:36px;background:var(--sunk);
  border-bottom:1px solid var(--rule);font-size:11.5px;color:var(--ink-3);
  font-family:"JetBrains Mono",monospace;letter-spacing:0}
.pane-bar .sp{flex:1}
.pane-bar::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--tk);flex:none;opacity:.8}
textarea.code{width:100%;border:0;background:transparent;resize:vertical;padding:14px;font-size:13.5px;
  line-height:1.7;min-height:112px;display:block;tab-size:2;outline:0;letter-spacing:0}
textarea.code::placeholder{color:var(--ink-4)}
.acts{display:flex;gap:8px;align-items:center;padding:11px 13px;border-top:1px solid var(--rule);flex-wrap:wrap}
.btn{height:34px;padding:0 15px;border-radius:var(--rx);font-size:14px;font-weight:700;letter-spacing:-.01em;
  display:inline-flex;align-items:center;gap:7px;transition:transform 110ms var(--eo),filter 110ms linear}
.btn.pri{background:var(--tk);color:#fff}
html[data-theme="dark"] .btn.pri{color:#0B0E12}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.sec:hover{background:var(--rule)}
.btn.qui{color:var(--tk);padding:0 8px}
.btn[disabled]{opacity:.4;cursor:default}
.out{max-height:340px;overflow:auto;border-top:1px solid var(--rule)}
.outmsg{padding:13px;font-size:13px;line-height:1.65;font-family:"JetBrains Mono",monospace;
  color:var(--ink-2);white-space:pre-wrap}
.outmsg.err{color:var(--bad)}
table.g{border-collapse:collapse;width:100%;font-size:12.5px;font-family:"JetBrains Mono",monospace}
table.g th,table.g td{padding:7px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--rule)}
table.g th{background:var(--sunk);color:var(--ink-3);font-weight:700;position:sticky;top:0;z-index:1;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase}
table.g td.n,table.g th.n{text-align:right}
table.g tbody tr:hover td{background:var(--tk-w)}

.verdict{margin-top:13px;padding:13px 15px;border-radius:var(--rm);font-size:14.5px;overflow:hidden;height:0;opacity:0}
.verdict.pass{background:var(--ok-w);color:var(--ok)}
.verdict.fail{background:var(--bad-w);color:var(--bad)}
.verdict.hint{background:var(--warn-w);color:var(--warn)}
.verdict pre{margin:8px 0 0;white-space:pre-wrap;font-size:12.5px;line-height:1.6}

/* ---------- right rail ---------- */
.card{background:transparent;border:0;border-top:1px solid var(--rule);border-radius:0;
  padding:16px 0 4px;margin-bottom:8px;box-shadow:none}
.card:first-child{border-top:0;padding-top:0}
.card h4{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:10px}
.card p{font-size:13.5px;color:var(--ink-2);margin:0 0 .5em;line-height:1.45}
.card a{font-size:13.5px;display:block;padding:3px 0;color:var(--ink)}
.card a:hover{color:var(--tk)}
.meter{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--tk);width:0}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);padding:3px 0;
  font-family:"JetBrains Mono",monospace}
.kv b{color:var(--ink);font-weight:700}

/* ---------- progress ---------- */
.pgrid{display:grid;grid-template-columns:auto repeat(3,52px);gap:5px;align-items:center;margin:18px 0 4px}
.pgh{font-size:10px;color:var(--ink-3);text-align:center;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.plbl{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;padding-right:12px;letter-spacing:-.012em}
.plbl .gy{width:17px;height:17px;color:var(--tg)}
.pc{width:52px;height:52px;border-radius:var(--rm);background:var(--sunk);display:grid;place-items:center;
  color:var(--ink-4);border:1px solid var(--rule);transition:transform 150ms var(--eo)}
.pc.on{color:#fff;border-color:transparent}
html[data-theme="dark"] .pc.on{color:#0B0E12}
.pc:hover{transform:scale(1.06)}
.pc svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:0;margin:28px 0 6px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat{padding:16px 18px 16px 0;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1;
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;color:var(--tk)}
.stat span{display:block;font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.35}

/* ---------- practice rows ---------- */
.plist{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--rm);overflow:hidden;margin-top:18px}
.prow{display:flex;align-items:center;gap:13px;padding:12px 15px;width:100%;text-align:left;
  border-bottom:1px solid var(--rule)}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--sunk)}
.prow .gy{width:17px;height:17px;color:var(--tg);flex:none}
.prow .swatch{display:none}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;font-weight:600;font-size:15px;letter-spacing:-.014em}
.prow .pt span{font-size:12px;color:var(--ink-3)}

/* ---------- excel / pbi ---------- */
.fbar{display:flex;align-items:stretch;border-bottom:1px solid var(--rule)}
.fbar label{padding:0 13px;display:flex;align-items:center;font-size:12px;color:var(--ink-3);
  font-family:"JetBrains Mono",monospace;font-style:italic;border-right:1px solid var(--rule);background:var(--sunk)}
.fbar input{flex:1;border:0;padding:12px 14px;font-size:14px;background:transparent;min-width:0;outline:0;
  font-family:"JetBrains Mono",monospace}
.fbar input:focus{background:var(--tk-w)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.chip{padding:4px 9px;border-radius:var(--rx);font-size:11.5px;background:var(--sunk);color:var(--ink-3);
  font-family:"JetBrains Mono",monospace;border:1px solid transparent}
.chip[aria-pressed="true"]{background:var(--tk);color:#fff;border-color:transparent}
html[data-theme="dark"] .chip[aria-pressed="true"]{color:#0B0E12}
.pbi{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.tile{background:var(--sunk);border-radius:var(--rx);padding:13px;border:1px solid var(--rule)}
.tile h4{font-size:10.5px;color:var(--ink-3);margin-bottom:7px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.tile .big{font-size:30px;font-weight:800;letter-spacing:-.035em;font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;color:var(--tk)}
.cbox{position:relative;height:170px}

/* ---------- data preview ---------- */
.peek{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--rm);overflow:hidden;margin-bottom:13px}
.peek-h{display:flex;align-items:center;gap:9px;padding:0 13px;height:36px;width:100%;text-align:left;
  font-size:11.5px;color:var(--ink-3);font-family:"JetBrains Mono",monospace;background:var(--sunk)}
.peek-h b{font-weight:700;color:var(--ink)}
.peek-h .sp{flex:1}
.peek-h .cv{width:10px;height:10px;color:var(--ink-4)}
.peek-h .cv svg{display:block;transition:transform .28s var(--edr)}
.peek.open .peek-h .cv svg{transform:rotate(90deg)}
.peek-b{overflow:hidden;height:0}
.peek-n{padding:10px 13px 12px;font-size:12.5px;color:var(--ink-3);line-height:1.45;border-top:1px solid var(--rule)}

/* ---------- exercise switcher ---------- */
.exbar{display:flex;align-items:center;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.extab{width:32px;height:32px;border-radius:var(--rx);background:var(--sunk);color:var(--ink-2);
  font-size:13px;font-weight:700;display:grid;place-items:center;position:relative;
  font-family:"JetBrains Mono",monospace;border:1px solid var(--rule)}
.extab[aria-current="true"]{background:var(--tk);color:#fff;border-color:transparent}
html[data-theme="dark"] .extab[aria-current="true"]{color:#0B0E12}
.extab.solved::after{content:'';position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--ok);border:2px solid var(--paper)}
.exlabel{font-size:12px;color:var(--ink-3);margin-left:5px;font-family:"JetBrains Mono",monospace}

/* ---------- celebration ---------- */
.cel{display:flex;align-items:center;gap:14px}
.cel-seal{width:42px;height:42px;flex:none;transform:scale(0);opacity:0;will-change:transform}
.cel-seal svg{width:42px;height:42px;display:block}
.cel-ring{fill:none;stroke:currentColor;stroke-width:2;opacity:.25}
.cel-tick{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.cel-txt b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.cel-txt span{display:block;font-size:13.5px;opacity:.85;margin-top:1px}


/* ============================================================
   LABEL SKIN — applied to the intro overlay only.
   Palette and type per spec. The two accents are pulled from the
   hero field because the field is authored in them: there is no
   photograph here, so page and image agree by construction.
   ============================================================ */
html.label-mode header{display:none}
.scrolldeck{
  position:fixed;inset:0;left:0;right:0;top:0;bottom:0;z-index:90;overflow-y:auto;overflow-x:hidden;
  background:var(--gr);color:var(--ink-l);
  --gr:#0A0C0E; --gr2:#101317; --ink-l:#EDE7DC; --ink2:#9EA5A8; --mut:#6C7378;
  --amb:#E8913C; --teal:#2E6B72; --hair:rgba(237,231,220,.13);
  font-family:Sora,system-ui,sans-serif;letter-spacing:0;
  scrollbar-width:thin}

.scrolldeck *{box-sizing:border-box}
.dsp{font-family:Syne,Sora,system-ui,sans-serif;font-weight:700;letter-spacing:-.025em}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500}
.lbl.a{color:var(--amb)}
.scrolldeck p{margin:0}

/* ---- nav ---- */
.lnav{position:fixed;top:0;left:0;right:0;height:58px;z-index:20;display:flex;align-items:center;
  gap:26px;padding:0 26px;background:rgba(10,12,14,.72);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.lnav .lwm{font-family:Syne,sans-serif;font-weight:800;font-size:15px;letter-spacing:-.02em;color:var(--ink-l)}
.lnav .lwm i{font-style:normal;color:var(--amb)}
.lnav .lks{display:flex;gap:20px;margin-left:8px}
.lnav a{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);
  text-decoration:none;font-weight:500;transition:color .2s}
.lnav a:hover{color:var(--amb)}
.lnav .sp{flex:1}
.lpill{height:32px;padding:0 16px;border-radius:16px;border:1px solid var(--hair);background:transparent;
  color:var(--ink-l);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:500;
  font-family:Sora,sans-serif;cursor:pointer;transition:border-color .2s,color .2s}
.lpill:hover{border-color:var(--amb);color:var(--amb)}
@media (max-width:720px){.lnav .lks{display:none}}

/* ---- portal hero ---- */
.portal{height:250vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;isolation:isolate;
  display:grid;place-items:center}
.field{position:absolute;inset:0;z-index:0;will-change:transform}
.field svg{width:100%;height:100%;display:block}
.heroimg{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 38%;
  filter:saturate(.82) contrast(1.06) brightness(.86) hue-rotate(-8deg);user-select:none}
.duo{position:absolute;inset:0;z-index:1;mix-blend-mode:overlay;opacity:0;pointer-events:none;
  background:linear-gradient(118deg,var(--amb) 0%,var(--teal) 100%)}
.grade{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:color;opacity:.38;
  background:linear-gradient(112deg,#E8913C 0%,#2E6B72 46%,#2E6B72 72%,#E8913C 100%)}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(66% 62% at 50% 46%,transparent 0%,rgba(10,12,14,.55) 72%,rgba(10,12,14,.94) 100%)}
.panel{position:absolute;top:0;bottom:0;width:52%;z-index:4;background:var(--gr);will-change:transform}
.panel.l{left:0;border-right:1px solid var(--hair)}
.panel.r{right:0;border-left:1px solid var(--hair)}
.pdot{position:absolute;top:50%;left:50%;width:5px;height:5px;border-radius:50%;z-index:5;
  margin:-2.5px 0 0 -2.5px;will-change:transform}
.pdot.a{background:var(--amb);box-shadow:0 0 14px 3px rgba(232,145,60,.6)}
.pdot.t{background:var(--teal);box-shadow:0 0 14px 3px rgba(46,107,114,.6)}
.ptitle{position:relative;z-index:6;display:flex;justify-content:center;align-items:center;
  white-space:nowrap;font-family:Syne,sans-serif;font-weight:800;
  font-size:clamp(46px,11vw,140px);line-height:1;letter-spacing:-.02em;color:var(--ink-l);
  will-change:transform,letter-spacing}
.ptitle span{display:inline-block;will-change:transform}
.corner{position:absolute;z-index:7;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut)}
.corner.tl{top:76px;left:26px} .corner.tr{top:76px;right:26px;text-align:right}
.corner.bl{bottom:26px;left:26px} .corner.br{bottom:26px;right:26px;text-align:right}
.corner b{color:var(--amb);font-weight:500}

/* ---- shared section ---- */
.sec{position:relative;padding:110px 26px;max-width:1180px;margin:0 auto}
.sec.full{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.rv{opacity:0;transform:translateY(22px)}
.rv-on .rv{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.23,1,.32,1),
  transform .8s cubic-bezier(.23,1,.32,1);transition-delay:var(--d,0ms)}
/* No-JS and reduced-motion get the finished page, never a blank one */
.no-rv .rv{opacity:1;transform:none}

/* ---- statement ---- */
.stmt{font-family:Syne,sans-serif;font-weight:600;font-size:clamp(24px,3.6vw,52px);line-height:1.14;
  letter-spacing:-.03em;max-width:22ch;color:var(--ink-l);margin:22px 0 0}
.stmt em{font-style:normal;color:var(--amb)}
.idx{position:absolute;right:26px;top:88px;font-family:Syne,sans-serif;font-weight:800;
  font-size:clamp(90px,17vw,230px);line-height:.8;color:transparent;
  -webkit-text-stroke:1px var(--hair);pointer-events:none;z-index:0}
.orb{position:absolute;right:-90px;top:50%;width:340px;height:340px;border-radius:50%;
  overflow:hidden;opacity:.34;margin-top:-170px;z-index:0;will-change:transform;border:1px solid var(--hair)}
.orb svg{width:100%;height:100%;display:block}
@media (max-width:900px){.orb{display:none}}

/* ---- catalogue / deck ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
@media (max-width:900px){.two{grid-template-columns:1fr;gap:38px}}
.h2{font-family:Syne,sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,54px);line-height:1.04;
  letter-spacing:-.03em;color:var(--ink-l);max-width:14ch}
.lede{font-size:15px;line-height:1.62;color:var(--ink2);max-width:44ch;margin:20px 0 0}
.btns{display:flex;gap:11px;margin-top:30px;flex-wrap:wrap}
.lbtn{height:42px;padding:0 22px;border-radius:21px;font-family:Sora,sans-serif;font-size:11px;
  letter-spacing:.13em;text-transform:uppercase;font-weight:600;cursor:pointer;
  border:1px solid var(--hair);background:transparent;color:var(--ink-l);
  transition:border-color .2s,color .2s,background .2s}
.lbtn:hover{border-color:var(--amb);color:var(--amb)}
.lbtn.solid{background:var(--ink-l);color:var(--gr);border-color:var(--ink-l)}
.lbtn.solid:hover{background:var(--amb);border-color:var(--amb);color:var(--gr)}

.deckwrap{position:relative}
.deck{position:relative;width:100%;aspect-ratio:1;max-width:430px;margin:0 auto;
  touch-action:pan-y;outline:0}
.deck:focus-visible{box-shadow:0 0 0 2px var(--amb);border-radius:14px}
.dcard{position:absolute;inset:0;border-radius:14px;background:var(--gr2);border:1px solid var(--hair);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.85);padding:26px;display:flex;flex-direction:column;
  cursor:grab;will-change:transform;overflow:hidden}
.dcard:active{cursor:grabbing}
.dcard .dc-n{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--amb)}
.dcard .dc-g{margin:auto 0 0;width:52px;height:52px;color:var(--ink2)}
.dcard .dc-g .gy{width:52px;height:52px}
.dcard h3{font-family:Syne,sans-serif;font-weight:700;font-size:30px;letter-spacing:-.03em;
  margin:18px 0 0;color:var(--ink-l)}
.dcard p{font-size:13px;line-height:1.55;color:var(--ink2);margin:9px 0 0;max-width:30ch}
.dcard .dc-f{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;
  padding-top:14px;border-top:1px solid var(--hair);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mut)}
.dcard .dc-f b{color:var(--ink-l);font-weight:500}
.dhint{text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
  margin-top:22px}
.ddots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.ddots i{width:5px;height:5px;border-radius:50%;background:var(--hair);transition:background .3s}
.ddots i.on{background:var(--amb)}

/* ---- roster ---- */
.rost{border-top:1px solid var(--hair)}
.rrow{display:grid;grid-template-columns:76px 1fr auto;gap:22px;align-items:baseline;
  padding:24px 4px;border-bottom:1px solid var(--hair);width:100%;text-align:left;
  background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;
  transition:padding-left .3s cubic-bezier(.23,1,.32,1)}
.rrow:hover{padding-left:16px}
.rrow:hover .rr-n{color:var(--amb)}
.rr-l{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--amb)}
.rr-n{font-family:Syne,sans-serif;font-weight:700;font-size:clamp(22px,3.2vw,38px);
  letter-spacing:-.03em;color:var(--ink-l);transition:color .25s}
.rr-c{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);text-align:right}

/* ---- table ---- */
.tbl{width:100%;border-collapse:collapse;margin-top:26px}
.tbl th{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);font-weight:500;
  text-align:left;padding:0 14px 13px 0;border-bottom:1px solid var(--hair)}
.tbl td{padding:16px 14px 16px 0;border-bottom:1px solid var(--hair);font-size:12.5px;color:var(--ink2);
  letter-spacing:.02em}
.tbl td:first-child{font-family:Syne,sans-serif;font-weight:600;font-size:16px;letter-spacing:-.02em;
  color:var(--ink-l)}
.tbl tr{cursor:pointer;transition:background .2s}
.tbl tbody tr:hover td{background:rgba(237,231,220,.03)}
.tbl tbody tr:hover td:first-child{color:var(--amb)}
.tbl .dn{color:var(--teal)}
@media (max-width:760px){
  .tbl thead{display:none}
  .tbl tr{display:grid;grid-template-columns:1fr 1fr;padding:12px 0;border-bottom:1px solid var(--hair)}
  .tbl td{border:0;padding:3px 0}
  .tbl td:first-child{grid-column:1/-1}
}

/* ---- close ---- */
.close-h{font-family:Syne,sans-serif;font-weight:700;font-size:clamp(26px,4vw,46px);
  letter-spacing:-.03em;line-height:1.06;max-width:16ch;color:var(--ink-l)}
.fineprint{font-size:11.5px;line-height:1.6;color:var(--mut);max-width:52ch;margin:18px 0 0}
.footstrip{border-top:1px solid var(--hair);margin-top:66px;padding-top:20px;
  display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mut);flex-wrap:wrap;gap:12px}
.bigmark{font-family:Syne,sans-serif;font-weight:800;font-size:clamp(74px,20vw,260px);line-height:.8;
  letter-spacing:-.05em;color:var(--ink-l);width:100%;text-align:center;
  transform:translateY(.16em);white-space:nowrap;overflow:hidden;margin-top:44px}
.bigmark i{font-style:normal;color:var(--amb)}

/* ---------- ticker ---------- */
.navhint{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-right:4px}
.twrap{position:relative;min-height:100vh}   /* floor: never collapses if the row measures short */
.tpin{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center}
.trow{display:flex;align-items:center;flex-wrap:nowrap;white-space:nowrap;padding:0 8vw;will-change:transform}
.tw{font-family:Syne,sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1;
  font-size:clamp(34px,6.4vw,88px);color:var(--ink-l);flex:none;margin-right:.26em}

/* ── voices ─────────────────────────────────────────────── */
.tw.x{font-weight:800;font-size:clamp(46px,9.4vw,140px);letter-spacing:-.045em}
.tw.em{color:var(--amb)}
.tw.tl{color:#4FB3BE}
.tw.qt{font-family:Sora,sans-serif;font-weight:400;letter-spacing:-.005em;color:var(--ink2);
  font-size:clamp(19px,3vw,42px);align-self:flex-end;margin-bottom:.34em}
.tw.out{font-weight:800;font-size:clamp(46px,9.4vw,140px);letter-spacing:-.045em;
  color:transparent;-webkit-text-stroke:2px var(--ink-l);paint-order:stroke}
.tw.close{font-family:Sora,sans-serif;font-weight:500;color:var(--ink2);
  font-size:clamp(17px,2.4vw,34px);letter-spacing:-.008em}
.tw.hl{position:relative;display:inline-flex;align-items:center;padding:0 .2em}
.tw.hl i{position:absolute;left:0;right:0;top:.16em;bottom:.14em;background:var(--amb);
  border-radius:.06em;transform:rotate(-.7deg)}
.tw.hl b{position:relative;font-weight:800;color:var(--gr)}
.stak{flex:none;display:flex;flex-direction:column;justify-content:center;margin-right:.3em;
  font-family:Syne,sans-serif;font-weight:700;letter-spacing:-.032em;line-height:.94}
.stak span{font-size:clamp(24px,4.4vw,62px);color:var(--ink-l)}
.stak span:last-child{color:var(--amb)}
.tw.sm{font-family:Sora,sans-serif;font-weight:400;font-size:clamp(13px,1.5vw,17px);
  letter-spacing:.02em;color:var(--mut)}
.gp{flex:none} .g1{width:clamp(14px,1.6vw,30px)} .g2{width:clamp(40px,5vw,96px)} .g3{width:clamp(80px,12vw,220px)}
.mk{flex:none;height:clamp(34px,5.4vw,76px);width:auto;margin:0 clamp(10px,1.4vw,26px);display:block}
.mk.wide{height:clamp(28px,4.2vw,60px)}
.tk{flex:none;display:inline-flex;align-items:center;gap:.42em;margin:0 clamp(8px,1vw,18px);
  padding:.12em .5em .18em;border-radius:.22em;border:2px solid var(--tg);background:transparent;
  cursor:pointer;transition:background .22s cubic-bezier(.23,1,.32,1),transform .22s cubic-bezier(.23,1,.32,1)}
.tk-n{font-family:Syne,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1;
  font-size:clamp(38px,7.4vw,104px);color:var(--tg)}
.tk-g{display:flex;color:var(--tg)}
.tk-g .gy{width:clamp(24px,3.4vw,52px);height:clamp(24px,3.4vw,52px)}
.tk-c{font-family:Sora,sans-serif;font-size:clamp(9px,1vw,13px);letter-spacing:.12em;color:var(--mut);
  align-self:flex-start;margin-top:.5em}
@media (hover:hover) and (pointer:fine){
  .tk:hover{background:var(--tg);transform:translateY(-3px)}
  .tk:hover .tk-n,.tk:hover .tk-g{color:var(--gr)}
  .tk:hover .tk-c{color:var(--gr);opacity:.75}}
.tk:active{transform:translateY(0) scale(.98)}
.tk:focus-visible{outline:3px solid var(--amb);outline-offset:4px}
.endpick{flex:none;display:flex;align-items:center;gap:clamp(6px,.8vw,14px);
  padding-left:clamp(16px,2vw,40px);border-left:1px solid var(--hair)}
.endpick .tk-n{font-size:clamp(20px,2.6vw,40px)}
.endpick .tk-g .gy{width:clamp(16px,2vw,28px);height:clamp(16px,2vw,28px)}
.endpick .tk-c{display:none}
.tprog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--hair)}
.tprog i{display:block;height:100%;width:0;background:var(--amb)}
.tcue{position:absolute;left:8vw;bottom:34px;display:flex;align-items:center;gap:10px;color:var(--mut);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.tw.close{color:var(--ink2)}
.tnote{flex:none;display:flex;flex-direction:column;gap:10px;max-width:min(46vw,520px);
  padding-left:clamp(20px,3vw,56px);border-left:1px solid var(--hair);white-space:normal}
.tn{font-family:Sora,sans-serif;font-size:clamp(11px,1.15vw,13.5px);line-height:1.7;color:var(--mut);
  letter-spacing:.01em}
.t-static .tnote{border-left:0;padding-left:0;max-width:64ch;margin-top:28px}
.t-static .twrap,.t-static .tpin{height:auto;overflow:visible;display:block}
.t-static .trow{flex-wrap:wrap;white-space:normal;transform:none!important;
  padding:100px 8vw 60px;gap:.14em .1em;align-items:center}
.t-static .gp{display:none}
.t-static .tw,.t-static .tk-n{font-size:clamp(26px,4.4vw,54px)}
.t-static .tw.x,.t-static .tw.out{font-size:clamp(30px,5vw,64px)}
.t-static .tw.qt{font-size:clamp(16px,2.4vw,24px);align-self:auto;margin-bottom:0}
.t-static .stak{display:inline-flex}
.t-static .stak span{font-size:clamp(22px,3.6vw,44px)}
.t-static .mk{height:clamp(26px,3.4vw,44px)}
.t-static .endpick{border-left:0;padding-left:0;flex-wrap:wrap;margin-top:20px}
.t-static .tcue{display:none}
.t-native .trow{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;width:100%;transform:none!important}
.t-native .twrap{height:auto!important}
.t-native .tpin{position:relative}
.t-native .tk{scroll-snap-align:center}
.t-native .trow::-webkit-scrollbar{height:3px}
.t-native .trow::-webkit-scrollbar-thumb{background:var(--amb)}
@media (max-width:720px){ .tcue{left:6vw;bottom:26px} .trow{padding:0 6vw} }

/* ---------- home ---------- */
.hero{padding:6px 0 0}
.hero-k{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:var(--rx);
  background:var(--tk-w);color:var(--tk);font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:20px}
.hero-k i{width:5px;height:5px;border-radius:50%;background:currentColor;font-style:normal;
  animation:blip 2.4s var(--eio) infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.hero h1{max-width:15ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--tk)}
.lede{font-size:17.5px;line-height:1.5;color:var(--ink-2);margin:20px 0 0;max-width:52ch}
.cta{display:flex;gap:11px;margin:28px 0 0;flex-wrap:wrap;align-items:center}
.btn.lg{height:46px;padding:0 22px;font-size:16px;border-radius:var(--rm)}
.btn.pri.lg{box-shadow:var(--shade-2)}
.cta-note{font-size:12.5px;color:var(--ink-3);font-family:"JetBrains Mono",monospace}

/* the hero demo — a query returning rows, the most characteristic
   thing in this product's world */
.demo{margin:34px 0 0;background:var(--frame);border-radius:var(--rl);overflow:hidden;
  box-shadow:var(--shade-3);color:var(--frame-tx)}
.demo-bar{display:flex;align-items:center;gap:7px;height:34px;padding:0 13px;
  box-shadow:inset 0 -1px 0 var(--frame-line);font-size:11px;color:var(--frame-tx3);
  font-family:"JetBrains Mono",monospace}
.demo-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--frame-tx3);opacity:.4}
.demo-bar .sp{flex:1}
.demo-q{padding:14px 16px;font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.75;
  color:var(--frame-tx);min-height:76px}
.demo-q .kw{color:#7C9CFF} .demo-q .st{color:#4ECB84} .demo-q .nu{color:#E5A33C}
.caret{display:inline-block;width:7px;height:15px;background:var(--frame-tx);vertical-align:-2px;
  animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.demo-res{border-top:1px solid var(--frame-line);font-family:"JetBrains Mono",monospace;font-size:12px}
.demo-res table{border-collapse:collapse;width:100%}
.demo-res th{text-align:left;padding:7px 16px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--frame-tx3);font-weight:700;border-bottom:1px solid var(--frame-line)}
.demo-res td{padding:7px 16px;color:var(--frame-tx);border-bottom:1px solid var(--frame-line)}
.demo-res td.n{text-align:right;font-variant-numeric:tabular-nums}
.demo-res tr{opacity:0;transform:translateY(-5px)}
.demo-res tr.in{animation:rowin 280ms var(--eo) forwards}
@keyframes rowin{to{opacity:1;transform:translateY(0)}}
.demo-foot{padding:8px 16px;font-size:11px;color:var(--frame-tx3);font-family:"JetBrains Mono",monospace}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:0;margin:34px 0 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.fact{padding:16px 18px 16px 0;border-right:1px solid var(--rule)}
.fact:last-child{border-right:0}
.fact b{display:block;font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1;
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.fact span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.35}

.secttl{display:flex;align-items:baseline;gap:11px;margin:52px 0 0}
.secttl h2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.secttl span{font-size:13px;color:var(--ink-4)}
.secttl::after{content:'';flex:1;height:1px;background:var(--rule)}

.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:10px;margin-top:18px}
.tcard{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--rm);
  padding:16px;text-align:left;overflow:hidden;

<script>

/* ============================================================
   CURRICULUM — 15 lessons. Each has a job scenario, a concept,
   a worked example, and an exercise that is machine-checked
   where the runtime allows it.
   ============================================================ */
const LESSONS = {
'sql-0':{
  title:'Reading rows with SELECT and WHERE',
  scenario:'Your manager forwards a Slack message: <b>"Can you send me everyone in the Data team earning over 80k? Need it before the 2pm call."</b> This is the single most common request a junior analyst gets.',
  concept:`<p>Every SQL query answers two questions: <em>which columns</em> and <em>which rows</em>. <code>SELECT</code> picks columns, <code>WHERE</code> filters rows.</p>
<ul><li><code>SELECT *</code> means every column. Fine while exploring, bad in a report — nobody wants 40 columns.</li>
<li><code>WHERE</code> runs once per row and keeps the rows where the condition is true.</li>
<li>Text goes in single quotes: <code>'Data'</code>. Numbers don't: <code>80000</code>.</li>
<li><code>ORDER BY ... DESC</code> sorts highest first. <code>LIMIT</code> caps the rows returned.</li></ul>
<p>A trap worth learning now: <code>WHERE salary > 80000</code> excludes exactly 80,000. If the ask was "80k and above", you need <code>&gt;=</code>. Reports get sent back over this.</p>`,
  example:"SELECT name, department, salary\nFROM employees\nWHERE department = 'Data'\nORDER BY salary DESC;",
  task:'Return <code>name</code> and <code>salary</code> for everyone in the Data department earning more than 80000, highest salary first.',
  solution:"SELECT name, salary FROM employees WHERE department='Data' AND salary > 80000 ORDER BY salary DESC;",
  hint:'You need three pieces: a WHERE with two conditions joined by AND, and an ORDER BY ... DESC.'
},
'sql-1':{
  title:'Joins and group-level aggregation',
  scenario:'Finance is planning next year\'s headcount. They want one row per department: how many people are in it, what the average salary is, and whether it is under its budgeted headcount. <b>Departments with nobody in them must still appear</b> — that is the whole point of the exercise.',
  concept:`<p>Two ideas stack here, and the order matters.</p>
<p><b>Joins</b> match rows across tables. <code>INNER JOIN</code> keeps only rows that match on both sides. <code>LEFT JOIN</code> keeps every row from the left table and fills in <code>NULL</code> where the right side has no match. Finance asked for empty departments, so <code>LEFT JOIN</code> is not a stylistic choice — it is the requirement.</p>
<p><b>Aggregation</b> collapses many rows into one. <code>GROUP BY d.name</code> makes one output row per department; <code>COUNT()</code>, <code>AVG()</code>, <code>SUM()</code> then summarise each group.</p>
<p>The classic bug: <code>COUNT(*)</code> counts rows, and a department with no employees still produces one row full of NULLs — so it returns 1, not 0. <code>COUNT(e.id)</code> counts non-null values and correctly returns 0. Interviewers ask this.</p>`,
  example:"SELECT d.name AS department,\n       COUNT(e.id) AS headcount,\n       ROUND(AVG(e.salary), 0) AS avg_salary\nFROM departments d\nLEFT JOIN employees e ON e.department = d.name\nGROUP BY d.name\nORDER BY headcount DESC;",
  task:'One row per department with <code>name</code>, a <code>headcount</code> that is 0 for empty departments, and the <code>head_count_budget</code>. Sort by headcount, highest first.',
  solution:"SELECT d.name, COUNT(e.id) AS headcount, d.head_count_budget FROM departments d LEFT JOIN employees e ON e.department=d.name GROUP BY d.name, d.head_count_budget ORDER BY headcount DESC;",
  hint:'Finance is the empty department — if it is missing you used INNER JOIN; if it shows 1 you used COUNT(*).'
},
'sql-2':{
  title:'Window functions and CTEs',
  scenario:'The compensation review needs each employee ranked <b>within their own department</b>, plus how far each sits from their department average. One query, no manual per-department passes.',
  concept:`<p><code>GROUP BY</code> destroys detail — you get one row per group. Window functions keep every row and add a column computed over a group.</p>
<ul><li><code>OVER (PARTITION BY department ORDER BY salary DESC)</code> restarts the calculation for each department.</li>
<li><code>ROW_NUMBER()</code> always gives 1,2,3 with no ties. <code>RANK()</code> gives 1,2,2,4. <code>DENSE_RANK()</code> gives 1,2,2,3. Pick deliberately — for "top 3 per group" the choice changes your row count.</li>
<li><code>AVG(salary) OVER (PARTITION BY department)</code> puts the department average on every row of that department.</li></ul>
<p><b>CTEs</b> (<code>WITH name AS (...)</code>) name an intermediate result. They exist because you cannot filter on a window function in <code>WHERE</code> — the window runs after <code>WHERE</code>. So you compute in a CTE and filter in the outer query.</p>`,
  example:"WITH ranked AS (\n  SELECT name, department, salary,\n         RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS r\n  FROM employees\n)\nSELECT * FROM ranked WHERE r <= 2 ORDER BY department, r;",
  task:'Return the <b>single highest paid person per department</b> — columns <code>name</code>, <code>department</code>, <code>salary</code> — sorted by department name.',
  solution:"WITH r AS (SELECT name, department, salary, ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS rn FROM employees) SELECT name, department, salary FROM r WHERE rn=1 ORDER BY department;",
  hint:'Rank inside a CTE, then filter to rank 1 in the outer SELECT. Four departments have staff, so expect 4 rows.'
},

'python-0':{
  title:'Loading a file and looking before you leap',
  scenario:'A CSV lands in your inbox with no documentation. <b>Before you compute anything, you have to know what you are holding</b> — how many rows, what types, what is missing. Skipping this is how wrong numbers reach a slide deck.',
  concept:`<p>pandas gives you a <code>DataFrame</code>: a table with labelled columns and typed values.</p>
<ul><li><code>df.shape</code> → (rows, columns). Your first sanity check: does the row count match what you were told?</li>
<li><code>df.dtypes</code> → types. A price column typed <code>object</code> means text got in — a currency symbol, a stray comma — and every sum you write will be wrong or will crash.</li>
<li><code>df.head()</code> → first rows. <code>df.describe()</code> → count, mean, min, max per numeric column.</li>
<li><code>df.isna().sum()</code> → missing values per column. Do this before any average.</li></ul>
<p>The habit to build: never aggregate a column you have not inspected.</p>`,
  example:"import pandas as pd\n\ndf = pd.DataFrame({\n    'rep': ['Amira','Luca','Sara','Tom'],\n    'region': ['North','North','South','South'],\n    'revenue': [747, 594, 1899, 1600]\n})\n\nprint(df.shape)\nprint(df.dtypes)\nprint(df['revenue'].describe())",
  task:'Using the same <code>df</code>, print the total revenue and the number of unique regions — in that order, one per line.',
  solution:"import pandas as pd\ndf = pd.DataFrame({'rep':['Amira','Luca','Sara','Tom'],'region':['North','North','South','South'],'revenue':[747,594,1899,1600]})\nprint(df['revenue'].sum())\nprint(df['region'].nunique())",
  expect:"4840\n2",
  hint:'.sum() on the column, then .nunique() on the region column.'
},
'python-1':{
  title:'Cleaning what arrives broken',
  scenario:'The export you were sent has missing prices, duplicated order rows, and a revenue column that does not exist yet. <b>This is what most of the job actually is.</b> Analysts routinely spend more time here than on the analysis.',
  concept:`<p>Three moves cover most cleaning work.</p>
<ul><li><b>Missing values.</b> <code>df.dropna()</code> deletes rows. <code>df['x'].fillna(value)</code> replaces them. Deleting is not neutral — if prices are missing more often for one region, dropping them biases your regional totals. Say out loud which you chose and why.</li>
<li><b>Duplicates.</b> <code>df.drop_duplicates(subset=['order_id'])</code> beats a bare <code>drop_duplicates()</code>, which only removes rows identical in every column.</li>
<li><b>Derived columns.</b> <code>df['revenue'] = df['units'] * df['price']</code> works element-wise across the whole column at once. Writing a Python loop here is slower and marks you as new.</li></ul>`,
  example:"import pandas as pd\nimport numpy as np\n\ndf = pd.DataFrame({\n    'order_id':[1,2,2,3,4],\n    'units':[3,12,12,1,5],\n    'price':[249.0, 49.5, 49.5, np.nan, 320.0]\n})\n\ndf = df.drop_duplicates(subset=['order_id'])\ndf['price'] = df['price'].fillna(df['price'].median())\ndf['revenue'] = df['units'] * df['price']\nprint(df)",
  task:'From that cleaned frame, print the total revenue rounded to 2 decimals.',
  solution:"import pandas as pd, numpy as np\ndf = pd.DataFrame({'order_id':[1,2,2,3,4],'units':[3,12,12,1,5],'price':[249.0,49.5,49.5,np.nan,320.0]})\ndf = df.drop_duplicates(subset=['order_id'])\ndf['price'] = df['price'].fillna(df['price'].median())\ndf['revenue'] = df['units'] * df['price']\nprint(round(df['revenue'].sum(), 2))",
  expect:"3190.0",
  hint:'Deduplicate first, then fill, then multiply. Filling before deduplicating changes the median from 249.0 to 149.25, and the total with it.'
},
'python-2':{
  title:'groupby, and the shape your stakeholder wants',
  scenario:'"Revenue by region and category, and flag anything below 500." You have the rows. <b>The work is choosing the shape</b> — long for charting, wide for a table someone will read.',
  concept:`<p><code>groupby</code> splits rows into groups, applies a function, and combines the results.</p>
<ul><li><code>df.groupby('region')['revenue'].sum()</code> → one number per region.</li>
<li><code>.agg({'revenue':'sum','units':'mean'})</code> → different functions per column in one pass.</li>
<li>Grouping by two keys gives a MultiIndex. <code>.reset_index()</code> flattens it back to plain columns — do this before writing to CSV or charting, or the index will surprise you.</li>
<li><code>.pivot_table(index=..., columns=..., values=..., aggfunc='sum')</code> gives the wide cross-tab that non-technical readers expect.</li></ul>
<p>Long format for tools. Wide format for humans. Know which you are producing and for whom.</p>`,
  example:"import pandas as pd\n\ndf = pd.DataFrame({\n    'region':['North','North','South','South','East','East'],\n    'category':['HW','SW','HW','SW','HW','SW'],\n    'revenue':[747, 594, 1899, 1600, 1498, 1485]\n})\n\nwide = df.pivot_table(index='region', columns='category',\n                      values='revenue', aggfunc='sum')\nprint(wide)",

'excel-0':{
  title:'References, and why one dollar sign matters',
  scenario:'You build a commission column, drag it down twenty rows, and every value below the first is wrong. <b>This exact bug appears in real company spreadsheets constantly</b> and it comes down to one character.',
  concept:`<p>A reference like <code>B2</code> is <em>relative</em>: copy the formula down one row and it becomes <code>B3</code>. Usually that is what you want.</p>
<p>A reference like <code>$B$2</code> is <em>absolute</em>: it stays on B2 no matter where you copy it. Use it for a single fixed input — a tax rate, a commission percentage, an exchange rate sitting in one cell.</p>
<p>Mixed forms exist too: <code>$B2</code> locks the column, <code>B$2</code> locks the row. That is how one formula fills an entire grid correctly.</p>
<p>Start with the arithmetic that does not need locking. The grid below is live — type a formula in the bar and it evaluates against the visible data.</p>`,
  example:"=SUM(F2:F11)",
  task:'Write a formula that returns the <b>average</b> of the Revenue column (F2:F11).',
  solution:"=AVERAGE(F2:F11)",
  expect:1306.3,
  hint:'AVERAGE works exactly like SUM. The revenue column is F, rows 2 through 11.'
},
'excel-1':{
  title:'Conditional logic and lookups',
  scenario:'Sales wants a spreadsheet that labels each deal Large or Small, counts how many landed in each region, and pulls the target for that region from a second sheet. <b>Three formulas do all of it.</b>',
  concept:`<p><code>IF(test, value_if_true, value_if_false)</code> is the branch. Nesting more than two or three deep becomes unreadable — that is when you reach for <code>IFS</code> or a lookup table.</p>
<p>The conditional aggregates are the workhorses: <code>COUNTIF(range, criteria)</code>, <code>SUMIF(range, criteria, sum_range)</code>, and <code>AVERAGEIF</code>. Criteria can be text (<code>"North"</code>) or an expression in quotes (<code>"&gt;1000"</code>).</p>
<p><code>VLOOKUP(value, table, col_index, FALSE)</code> finds a row by its first column and returns another column from it. Always pass <code>FALSE</code> for exact match — the default is approximate and returns confidently wrong answers on unsorted data. Modern Excel has <code>XLOOKUP</code>, which fixes VLOOKUP's worst habits, but VLOOKUP still appears in interviews and legacy files.</p>`,
  example:'=COUNTIF(A2:A11, "North")',
  task:'Sum the Revenue column (F2:F11) for rows where the Region column (A2:A11) is <code>South</code>.',
  solution:'=SUMIF(A2:A11, "South", F2:F11)',
  expect:5242,
  hint:'SUMIF takes three arguments: the range to test, the criteria, and the range to add up.'
},
'excel-2':{
  title:'Building a summary the reader can trust',
  scenario:'A director asks for "one tab, the numbers that matter, no scrolling." <b>The skill is subtraction</b> — deciding what not to show, and making every number auditable back to the source rows.',
  concept:`<p>A summary block is a small set of named formulas, each pointing at raw data that lives elsewhere and is never edited by hand. Three rules keep it trustworthy:</p>
<ul><li><b>No hardcoded numbers.</b> A typed <code>1306.3</code> silently goes stale the moment the data updates. Every cell should be a formula.</li>
<li><b>One source of truth.</b> The raw rows live on one sheet; the summary references it. Copy-pasting values creates two versions that drift apart.</li>
<li><b>Label the ambiguous.</b> "Revenue" is not a unit. "Revenue, EUR, excl. VAT" is.</li></ul>
<p>Useful here: <code>MAX</code> and <code>MIN</code> for range, <code>COUNTA</code> for non-empty counts, <code>ROUND(x, 2)</code> to stop currency rendering to eight decimals.</p>`,
  example:"=ROUND(AVERAGE(F2:F11), 2)",
  task:'Return the <b>largest</b> value in the Revenue column (F2:F11), rounded to zero decimals.',
  solution:"=ROUND(MAX(F2:F11), 0)",
  expect:2560,
  hint:'Nest MAX inside ROUND, with 0 as the second argument to ROUND.'
},

'r-0':{
  title:'Data frames and the dplyr verbs',
  scenario:'You have joined a team that runs on R. <b>Everything they write is five verbs chained with a pipe</b>, and once you see the pattern the rest of their codebase opens up.',
  concept:`<p>dplyr names each operation after what it does, and <code>%>%</code> (or the newer <code>|></code>) passes the result of one into the next.</p>
<ul><li><code>filter()</code> keeps rows — pandas' boolean mask, SQL's WHERE.</li>
<li><code>select()</code> keeps columns.</li>
<li><code>mutate()</code> adds or overwrites a column.</li>
<li><code>arrange()</code> sorts; wrap a column in <code>desc()</code> for descending.</li>
<li><code>summarise()</code> collapses to one row, and paired with <code>group_by()</code> it becomes one row per group.</li></ul>
<p>Read a pipeline top to bottom as a sentence: take the data, then filter, then mutate, then arrange. It maps almost one-to-one onto SQL, which is why analysts move between the two easily.</p>`,
  example:"library(dplyr)\n\nstaff <- data.frame(\n  name = c(\"Amira\",\"Luca\",\"Sara\",\"Mei\"),\n  dept = c(\"Data\",\"Data\",\"Data\",\"Data\"),\n  salary = c(82000, 96000, 61000, 118000)\n)\n\nstaff %>%\n  filter(salary > 70000) %>%\n  mutate(monthly = round(salary / 12)) %>%\n  arrange(desc(salary))",
  output:"   name dept salary monthly\n1   Mei Data 118000    9833\n2  Luca Data  96000    8000\n3 Amira Data  82000    6833",
  task:'Write a pipeline that keeps only rows with <code>salary &gt;= 82000</code>, then returns the mean salary as a column named <code>avg_salary</code>.',
  solution:"staff %>%\n  filter(salary >= 82000) %>%\n  summarise(avg_salary = mean(salary))",
  hint:'filter first, then summarise with a named argument.'
},
'r-1':{
  title:'ggplot2 and the grammar of graphics',
  scenario:'Your chart has to go in a report that leaves the company. <b>Default styling reads as unfinished</b>, and ggplot gives you control over every layer without fighting a chart wizard.',
  concept:`<p>ggplot builds a plot in layers, each added with <code>+</code>.</p>
<ul><li><code>ggplot(data, aes(x =, y =, colour =))</code> maps columns to visual properties. This is the "aesthetic mapping" — nothing is drawn yet.</li>
<li><code>geom_point()</code>, <code>geom_col()</code>, <code>geom_line()</code> choose the marks.</li>
<li><code>geom_smooth(method = "lm")</code> overlays a fitted line. Set <code>se = FALSE</code> to drop the confidence band when it clutters.</li>
<li><code>labs()</code> sets titles and axis labels. An unlabelled axis is an unfinished chart.</li>
<li><code>theme_minimal()</code> strips the grey default panel.</li></ul>
<p>The discipline: one message per chart. If you cannot say in a sentence what the reader should take away, the chart is not ready.</p>`,
  example:"library(ggplot2)\n\nggplot(staff, aes(x = years_exp, y = salary)) +\n  geom_point(size = 3) +\n  geom_smooth(method = \"lm\", se = FALSE) +\n  labs(title = \"Salary rises with experience\",\n       x = \"Years of experience\",\n       y = \"Salary (EUR)\") +\n  theme_minimal()",
  output:"# Renders a scatter plot with a fitted straight line.\n# `geom_smooth(method = \"lm\")` prints a message naming\n# the formula it used: 'y ~ x'",
  task:'Adapt the example into a bar chart of salary by name, sorted, with a title. Use <code>geom_col()</code>.',
  solution:"ggplot(staff, aes(x = reorder(name, salary), y = salary)) +\n  geom_col() +\n  coord_flip() +\n  labs(title = \"Salary by employee\", x = NULL, y = \"Salary (EUR)\") +\n  theme_minimal()",
  hint:'reorder(name, salary) sorts the bars; coord_flip() makes long labels readable.'
},
'r-2':{
  title:'Fitting a model and reading the output',
  scenario:'"Does experience actually explain salary here, or are we imagining it?" <b>The answer is a model and an honest reading of its output</b> — including saying when the evidence is thin.',
  concept:`<p><code>lm(y ~ x1 + x2, data = df)</code> fits a linear model. <code>summary(model)</code> prints what matters:</p>
<ul><li><b>Estimate</b> — the change in y for a one-unit change in x, holding the others fixed. This is the number people quote.</li>
<li><b>Std. Error</b> — how uncertain that estimate is. A large estimate with a larger standard error is not a finding.</li>
<li><b>p-value</b> — the probability of seeing an effect this large if the true effect were zero. It is not the probability the effect is real, and it says nothing about whether the effect is big enough to matter.</li>
<li><b>R-squared</b> — the share of variance explained. High R-squared on training data can simply mean you overfit.</li></ul>
<p>The professional move is to state the estimate, its uncertainty, and the limits of the data — small n, observational, confounders. Overclaiming from a model is the fastest way to lose a stakeholder's trust.</p>`,
  example:"model <- lm(salary ~ years_exp, data = staff)\nsummary(model)\n\n# Predict and score on held-out rows\npreds <- predict(model, newdata = test_staff)\nrmse  <- sqrt(mean((preds - test_staff$salary)^2))",
  output:"Coefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)  45231.7     6104.2   7.410 4.21e-06\nyears_exp     6412.9      982.5   6.527 1.83e-05\n\nMultiple R-squared:  0.7623,  Adjusted R-squared:  0.7444\n\n# Read: each extra year is associated with about\n# EUR 6,400 more salary. R-squared 0.76 on 15 rows —\n# suggestive, not conclusive.",
  task:'Extend the model to include <code>dept</code> as a second predictor, then print the summary.',
  solution:"model2 <- lm(salary ~ years_exp + dept, data = staff)\nsummary(model2)",
  hint:'Add predictors with +. R converts the text column into indicator variables for you.'
},

'pbi-0':{
  title:'Getting data in, and fixing it before it lands',
  scenario:'Someone hands you a messy export and asks for a dashboard by Friday. <b>Every minute spent cleaning in Power Query is a minute you never spend again</b> — the steps replay automatically on next month\'s file.',
  concept:`<p>Power BI has two stages, and beginners conflate them.</p>
<p><b>Power Query</b> is where data is loaded and reshaped. Each action you take is recorded as a step in a list. When new data arrives with the same structure, all the steps rerun. Cleaning here is permanent; cleaning by hand in Excel first is not.</p>
<p>The steps that matter most: promote the first row to headers, set each column's data type explicitly, remove blank and error rows, and unpivot columns when months are spread across columns instead of down rows.</p>
<p><b>The model</b> is where tables relate to each other. A star schema — one central fact table of events, small dimension tables of attributes around it — is what Power BI is built for. One flat wide table works for a demo and then becomes unmaintainable.</p>
<p>Type your columns properly. A date stored as text will not sort chronologically, and no amount of DAX fixes it downstream.</p>`,
  example:"Query steps recorded by Power Query:\n\n1. Source            → Csv.Document(File.Contents(\"sales.csv\"))\n2. Promoted Headers  → first row becomes column names\n3. Changed Type      → order_date: Date, revenue: Decimal\n4. Removed Errors    → drops rows that failed conversion\n5. Filtered Rows     → revenue <> null",
  task:'Name the four cleaning steps you would apply to a monthly sales export where months sit across columns, then say why unpivoting matters.',
  solution:"Promote headers, set explicit types, remove error and blank rows,\nand unpivot the month columns into two columns: Month and Value.\n\nUnpivoting matters because visuals and time intelligence need one\nrow per observation. Twelve month columns cannot be plotted as a\nsingle time series or filtered by a date slicer.",
  hint:'The reshaping step is the one with a specific name — think about what turns wide into long.'
},
'pbi-1':{
  title:'Choosing visuals that answer the question',
  scenario:'Your first dashboard draft has nine charts and the director asks "so what?" <b>The fix is almost always fewer visuals</b>, arranged so the answer is the first thing seen.',
  concept:`<p>The visual follows the question, not the other way round.</p>
<ul><li><b>One current number</b> → a card. Not a one-bar bar chart.</li>
<li><b>Comparing categories</b> → a bar chart, horizontal when labels are long. Ranked, not alphabetical.</li>
<li><b>Change over time</b> → a line chart. Time runs left to right, always.</li>
<li><b>Part of a whole</b> → a stacked bar. Pie charts fail past three slices because people cannot compare angles.</li>
<li><b>Many values across two categories</b> → a matrix or heatmap, not fifteen small charts.</li></ul>
<p>Layout carries meaning too: readers scan top-left first, so the headline number goes there and the detail goes below. Slicers belong together on one edge, not scattered.</p>
<p>Build a layout below — the tiles render live.</p>`,
  task:'Configure the builder so it answers "which category earns the most, and how has total revenue moved through the year?" Then mark this done.',
  solution:"A card for total revenue, a bar chart of revenue by category sorted\ndescending, and a line chart of revenue by month.\n\nThree visuals, one question each. The card answers 'how much',\nthe bar answers 'where from', the line answers 'which direction'.",
  hint:'Two questions were asked, plus a headline number. That is three visuals, not nine.'
},
'pbi-2':{
  title:'DAX: measures, columns, and context',
  scenario:'Your total revenue card reads correctly until someone clicks a slicer, and then it shows the same number for every region. <b>You wrote a calculated column where you needed a measure.</b>',
  concept:`<p>The distinction that trips up everyone learning DAX:</p>
<ul><li>A <b>calculated column</b> is computed once per row when data loads and stored in the model. It does not react to slicers.</li>
<li>A <b>measure</b> is computed on demand, in whatever filter context the visual is in. Slice by region and it recalculates for that region.</li></ul>
<p>Rule of thumb: if it aggregates, make it a measure. Columns are for row-level attributes you will group or filter by.</p>
<p><code>CALCULATE</code> is the one function to really learn — it evaluates an expression with the filter context modified:</p>
<ul><li><code>CALCULATE([Revenue], ALL(Sales))</code> ignores filters, giving a grand total for share-of-total ratios.</li>
<li><code>CALCULATE([Revenue], DATESYTD(Calendar[Date]))</code> gives year-to-date, provided you have a proper marked date table.</li></ul>
<p>Time intelligence silently misbehaves without a dedicated date table with continuous dates. Build one before you need it.</p>`,
  example:"Revenue = SUMX(Sales, Sales[quantity] * Sales[unit_price])\n\nRevenue YTD =\nCALCULATE([Revenue], DATESYTD('Calendar'[Date]))\n\nRevenue PY =\nCALCULATE([Revenue], SAMEPERIODLASTYEAR('Calendar'[Date]))\n\nYoY % =\nDIVIDE([Revenue] - [Revenue PY], [Revenue PY])",
  task:'Write a measure giving each category\'s share of total revenue, and explain why <code>ALL</code> is required.',
  solution:"Category Share % =\nDIVIDE(\n    [Revenue],\n    CALCULATE([Revenue], ALL(Sales[category]))\n)\n\nALL removes the category filter from the denominator only, so it\nstays the grand total while the numerator stays filtered to the\ncurrent row's category. Without ALL, both sides are filtered\nidentically and every row returns 100%.\n\nUse DIVIDE, not '/', because DIVIDE returns blank instead of an\nerror when the denominator is zero.",
  hint:'The numerator is filtered, the denominator must not be. One function removes a filter.'
}
};

 {task:'Name the four cleaning steps you would apply to a monthly sales export where months sit across columns, and say why unpivoting matters.',
  solution:"Promote headers, set explicit column types, remove error and blank\nrows, and unpivot the month columns into two columns: Month and\nValue.\n\nUnpivoting matters because visuals and time intelligence need one\nrow per observation. Twelve month columns cannot be plotted as a\nsingle time series or filtered by a date slicer.",
  hint:'The reshaping step is the one with a specific name — what turns wide into long?', data:'pbi-wide'},
 {task:'A date column arrives as text like <code>14/01/2024</code> and sorts wrongly. Say where you fix it and why not downstream.',
  solution:"Fix it in Power Query, at the Changed Type step, setting the column\nto Date with the correct locale — the export is day-first, so a\ndefault US parse silently turns 14/01 into an error and 03/04 into\nthe wrong day.\n\nNot downstream, because sort order, date slicers and every time\nintelligence function depend on a real date type. A DAX workaround\nre-parses the same text on every query and has to be repeated in\nevery measure. Fixing it once at load means the whole model is\ncorrect by construction.",
  hint:'Think about which fix runs once and which one you have to repeat forever.', data:'pbi-wide'},
 {task:'Explain the difference between a star schema and one flat wide table, and name one concrete thing that breaks with the flat table.',

<script>

/* ============================================================
   STATE — localStorage where available, memory otherwise.
   ============================================================ */
const KEY='bench.progress.v2';   /* v1 stored lesson-level keys only; not migratable */
let state = {done:{}, view:'home', track:'sql', level:0, open:{sql:true}};
try{ const s=localStorage.getItem(KEY); if(s) state.done=JSON.parse(s).done||{}; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({done:state.done})); }catch(e){} }
const key=(t,l)=>t+'-'+l;
const isDone=(t,l)=>!!state.done[key(t,l)];
function markDone(t,l){ state.done[key(t,l)]=Date.now(); save(); renderTree(); renderRail(); hdr(); }
/* Lesson keys look like "sql-0"; exercise keys like "sql-0-2".
   Counting every key conflated the two and inflated the lesson total. */
const isLessonKey = k => /^[a-z]+-\d+$/.test(k);
function doneCount(){ return Object.keys(state.done).filter(isLessonKey).length; }
function trackDone(t){ return [0,1,2].filter(l=>isDone(t,l)).length; }
function hdr(){ document.getElementById('hdone').textContent = doneCount(); }

/* ============================================================
   SQL ENGINE — real SQLite via WebAssembly
   ============================================================ */
let DB=null, dbReady=null;
function initDB(){
  if(dbReady) return dbReady;
  if(typeof initSqlJs!=='function'){
    dbReady=Promise.reject(new Error('The SQLite engine did not load. Check your connection, then reload — the rest of the lesson still works.'));
    dbReady.catch(()=>{});
    return dbReady;
  }
  try{
    dbReady = initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f})
      .then(SQL=>{ DB=new SQL.Database(); DB.run(DB_SQL); return DB; });
  }catch(e){ dbReady=Promise.reject(e); dbReady.catch(()=>{}); }
  return dbReady;
}
function runSQL(q){
  const res = DB.exec(q);
  if(!res.length) return {cols:[],rows:[],empty:true};
  return {cols:res[0].columns, rows:res[0].values};
}
function sameResult(a,b){
  if(a.rows.length!==b.rows.length) return false;
  if(a.cols.length!==b.cols.length) return false;
  const norm=r=>r.map(v=>{
    if(v===null) return 'NULL';
    if(typeof v==='number') return String(Math.round(v*1e6)/1e6);
    return String(v).trim();
  }).join('\u0001');
  const A=a.rows.map(norm), B=b.rows.map(norm);
  return A.every((v,i)=>v===B[i]);
}
function tableHTML(r){
  if(r.empty) return '<div class="out-msg">Query ran. No rows returned.</div>';
  let h='<table class="grid"><thead><tr>';
  r.cols.forEach((c,i)=>{
    const n = r.rows.length && typeof r.rows[0][i]==='number';
    h+='<th class="'+(n?'num':'')+'">'+esc(c)+'</th>';
  });
  h+='</tr></thead><tbody>';
  r.rows.slice(0,60).forEach(row=>{
    h+='<tr>'+row.map(v=>'<td class="'+(typeof v==='number'?'num':'')+'">'+(v===null?'<span style="color:var(--ink-3)">NULL</span>':esc(String(v)))+'</td>').join('')+'</tr>';
  });
  h+='</tbody></table>';
  if(r.rows.length>60) h+='<div class="out-msg">'+(r.rows.length-60)+' more rows not shown.</div>';
  return h;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============================================================
   EXCEL FORMULA EVALUATOR
   Supports: + - * / ^ %, parentheses, ranges, and the functions
   below. Written for teaching, not for spec completeness.
   ============================================================ */
function colIdx(letter){ let n=0; for(const c of letter.toUpperCase()) n=n*26+(c.charCodeAt(0)-64); return n-1; }
function cellVal(ref){
  const m=/^\$?([A-Za-z]+)\$?(\d+)$/.exec(ref);
  if(!m) throw new Error('Bad reference: '+ref);
  const c=colIdx(m[1]), r=parseInt(m[2],10);
  if(r===1) return SHEET.headers[c] ?? '';
  const row=SHEET.rows[r-2];
  if(!row) return '';
  return row[c] ?? '';
}
function rangeVals(a,b){
  const ma=/^\$?([A-Za-z]+)\$?(\d+)$/.exec(a), mb=/^\$?([A-Za-z]+)\$?(\d+)$/.exec(b);
  if(!ma||!mb) throw new Error('Bad range');
  const c1=colIdx(ma[1]),r1=+ma[2],c2=colIdx(mb[1]),r2=+mb[2];
  const out=[];
  for(let r=Math.min(r1,r2); r<=Math.max(r1,r2); r++)
    for(let c=Math.min(c1,c2); c<=Math.max(c1,c2); c++){
      if(r===1) out.push(SHEET.headers[c] ?? '');
      else { const row=SHEET.rows[r-2]; out.push(row ? (row[c] ?? '') : ''); }
    }
  return out;
}
const nums = a => a.filter(v=>typeof v==='number'&&!isNaN(v));
function matches(v, crit){
  crit=String(crit).trim();
  const m=/^(>=|<=|<>|>|<|=)(.+)$/.exec(crit);
  if(m){
    const op=m[1]; let t=m[2].trim().replace(/^"|"$/g,'');
    const tn=parseFloat(t), vn=typeof v==='number'?v:parseFloat(v);
    if(!isNaN(tn)&&!isNaN(vn)){
      if(op==='>')return vn>tn; if(op==='<')return vn<tn;
      if(op==='>=')return vn>=tn; if(op==='<=')return vn<=tn;
      if(op==='=')return vn===tn; if(op==='<>')return vn!==tn;
    }
    const vs=String(v).toLowerCase(), ts=t.toLowerCase();
    return op==='<>' ? vs!==ts : vs===ts;
  }
  crit=crit.replace(/^"|"$/g,'');
  if(typeof v==='number'&&!isNaN(parseFloat(crit))) return v===parseFloat(crit);
  return String(v).toLowerCase()===crit.toLowerCase();
}
const XLFN={
  SUM:a=>nums(flat(a)).reduce((s,v)=>s+v,0),
  AVERAGE:a=>{const n=nums(flat(a)); if(!n.length) throw new Error('#DIV/0!'); return n.reduce((s,v)=>s+v,0)/n.length;},
  COUNT:a=>nums(flat(a)).length,
  COUNTA:a=>flat(a).filter(v=>v!=='' && v!==null && v!==undefined).length,
  MAX:a=>{const n=nums(flat(a)); if(!n.length) throw new Error('#VALUE!'); return Math.max(...n);},
  MIN:a=>{const n=nums(flat(a)); if(!n.length) throw new Error('#VALUE!'); return Math.min(...n);},
  MEDIAN:a=>{const n=nums(flat(a)).sort((x,y)=>x-y); if(!n.length) throw new Error('#VALUE!');
    const m=Math.floor(n.length/2); return n.length%2?n[m]:(n[m-1]+n[m])/2;},
  ROUND:(a)=>{const v=one(a[0]), d=one(a[1])??0; const f=Math.pow(10,d); return Math.round(v*f)/f;},
  ABS:a=>Math.abs(one(a[0])),
  IF:a=>{const t=one(a[0]); return t?(a[1]!==undefined?one(a[1]):true):(a[2]!==undefined?one(a[2]):false);},
  COUNTIF:a=>{const r=arr(a[0]); const c=one(a[1]); return r.filter(v=>matches(v,c)).length;},
  SUMIF:a=>{const r=arr(a[0]), c=one(a[1]), s=a[2]!==undefined?arr(a[2]):r;
    let t=0; r.forEach((v,i)=>{ if(matches(v,c)&&typeof s[i]==='number') t+=s[i]; }); return t;},
  AVERAGEIF:a=>{const r=arr(a[0]), c=one(a[1]), s=a[2]!==undefined?arr(a[2]):r;
    let t=0,n=0; r.forEach((v,i)=>{ if(matches(v,c)&&typeof s[i]==='number'){t+=s[i];n++;} });
    if(!n) throw new Error('#DIV/0!'); return t/n;},
  VLOOKUP:a=>{const key=one(a[0]), tbl=a[1], col=one(a[2]);
    if(!tbl||!tbl.__range) throw new Error('VLOOKUP needs a range');
    const {c1,c2,r1,r2}=tbl.__range; const width=c2-c1+1;
    for(let r=r1;r<=r2;r++){
      const first = r===1 ? SHEET.headers[c1] : (SHEET.rows[r-2]||[])[c1];
      if(String(first).toLowerCase()===String(key).toLowerCase()){
        if(col<1||col>width) throw new Error('#REF!');
        return r===1 ? SHEET.headers[c1+col-1] : (SHEET.rows[r-2]||[])[c1+col-1];
      }
    }
    throw new Error('#N/A');},
  CONCAT:a=>flat(a).map(v=>String(v)).join(''),
  LEN:a=>String(one(a[0])).length,
  UPPER:a=>String(one(a[0])).toUpperCase(),
  LOWER:a=>String(one(a[0])).toLowerCase()
};
function flat(a){ const o=[]; a.forEach(v=>{ if(Array.isArray(v)) o.push(...v); else o.push(v); }); return o; }
function arr(v){ return Array.isArray(v)?v:[v]; }
function one(v){ return Array.isArray(v)?v[0]:v; }

function evalFormula(src){
  let s=String(src).trim();
  if(s.startsWith('=')) s=s.slice(1);
  if(!s) throw new Error('Enter a formula');
  let i=0;
  const ws=()=>{ while(i<s.length && /\s/.test(s[i])) i++; };
  function expr(){
    let v=term();
    ws();
    while(i<s.length && (s[i]==='+'||s[i]==='-'||s[i]==='&')){
      const op=s[i++]; const r=term();
      v = op==='&' ? String(one(v))+String(one(r)) : (op==='+'?one(v)+one(r):one(v)-one(r));
      ws();
    }
    ws();
    while(i<s.length && ['>','<','='].includes(s[i])){
      let op=s[i++]; if(s[i]==='='){op+='='; i++;} else if(op==='<'&&s[i]==='>'){op='<>'; i++;}
      const r=one(term()); const l=one(v);
      v = op==='>'?l>r: op==='<'?l<r: op==='>='?l>=r: op==='<='?l<=r: op==='<>'?l!==r: l===r;
      ws();
    }
    return v;
  }
  function term(){
    let v=factor(); ws();
    while(i<s.length && (s[i]==='*'||s[i]==='/')){
      const op=s[i++]; const r=one(factor()); const l=one(v);
      if(op==='/'&&r===0) throw new Error('#DIV/0!');
      v = op==='*'? l*r : l/r; ws();
    }
    return v;
  }
  function factor(){
    ws();
    if(s[i]==='-'){ i++; return -one(factor()); }
    if(s[i]==='+'){ i++; return one(factor()); }
    let v=atom(); ws();
    while(s[i]==='^'){ i++; v=Math.pow(one(v), one(factor())); ws(); }
    return v;
  }
  function atom(){
    ws();
    if(s[i]==='('){ i++; const v=expr(); ws(); if(s[i]!==')') throw new Error('Missing )'); i++; return v; }
    if(s[i]==='"'){ i++; let out=''; while(i<s.length&&s[i]!=='"') out+=s[i++]; i++; return out; }

    const REF=/^\$?[A-Za-z]{1,3}\$?\d+(?![A-Za-z0-9_])/;
    const rm=REF.exec(s.slice(i));
    if(rm){
      const a=rm[0]; i+=a.length;
      if(s[i]===':'){
        i++; const bm=REF.exec(s.slice(i));
        if(!bm) throw new Error('Bad range');
        const b=bm[0]; i+=b.length;
        const vals=rangeVals(a,b);
        const ma=/^\$?([A-Za-z]+)\$?(\d+)$/.exec(a), mb=/^\$?([A-Za-z]+)\$?(\d+)$/.exec(b);
        vals.__range={c1:Math.min(colIdx(ma[1]),colIdx(mb[1])),c2:Math.max(colIdx(ma[1]),colIdx(mb[1])),
                      r1:Math.min(+ma[2],+mb[2]),r2:Math.max(+ma[2],+mb[2])};
        return vals;
      }
      return cellVal(a);
    }

    const num=/^\d+(\.\d+)?/.exec(s.slice(i));
    const idm=/^[A-Za-z_][A-Za-z0-9_.]*/.exec(s.slice(i));
    if(idm && !/^\d/.test(idm[0])){
      const name=idm[0]; const after=i+name.length;
      let j=after; while(j<s.length&&/\s/.test(s[j])) j++;
      if(s[j]==='('){
        i=j+1; const args=[]; ws();
        if(s[i]===')'){ i++; } else {
          while(true){ args.push(expr()); ws();
            if(s[i]===','||s[i]===';'){ i++; continue; }
            if(s[i]===')'){ i++; break; }
            throw new Error('Bad argument list in '+name.toUpperCase());
          }
        }
        const fn=XLFN[name.toUpperCase()];
        if(!fn) throw new Error('#NAME? — '+name.toUpperCase()+' is not supported here');
        return fn(args);
      }
      if(name.toUpperCase()==='TRUE'){i+=4;return true;}
      if(name.toUpperCase()==='FALSE'){i+=5;return false;}
      throw new Error('#NAME? — '+name);
    }
    if(num){ i+=num[0].length; let v=parseFloat(num[0]); if(s[i]==='%'){i++;v/=100;} return v; }
    throw new Error('Cannot parse from: '+s.slice(i,i+14));
  }
  const out=expr(); ws();
  if(i<s.length) throw new Error('Unexpected: '+s.slice(i,i+14));
  return one(out);
}

/* ============================================================
   PYTHON — Pyodide, loaded only when asked (~15 MB)
   ============================================================ */
let pyReady=null, pyLoading=false;
function loadPy(onProgress){
  if(pyReady) return pyReady;
  pyLoading=true;
  pyReady=(async()=>{
    onProgress('Downloading Python runtime…');
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
      s.onload=res; s.onerror=()=>rej(new Error('Could not load Pyodide.'));
      document.head.appendChild(s);
    });
    onProgress('Starting interpreter…');
    const py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'});
    onProgress('Loading pandas and numpy…');
    await py.loadPackage(['pandas','numpy']);
    pyLoading=false;
    return py;
  })();
  return pyReady;
}
async function runPy(code){
  const py=await pyReady;
  py.runPython(`
import sys, io
_b = io.StringIO()
sys.stdout = _b
sys.stderr = _b
`);
  let err=null;
  try{ await py.runPythonAsync(code); }catch(e){ err=String(e.message||e); }
  const out=py.runPython('sys.stdout = sys.__stdout__; sys.stderr = sys.__stderr__; _b.getvalue()');
  return {out, err};
}
