'git-0':{
  title:'Commits, branches and where HEAD points',
  scenario:'You join a team and are told: <b>"branch off main, do the work, don\'t commit to main directly."</b> Nobody explains what a branch actually is, and the diagram on the wiki is three years out of date.',
  concept:`<p>A commit is a snapshot plus a pointer to the commit that came before it. String those together and you get a chain — that chain is your history.</p>
<ul><li>A <b>branch is not a copy</b>. It is a movable label pointing at one commit. Creating one is instant and costs nothing, which is why teams make so many.</li>
<li><code>HEAD</code> is the label that says <em>where you are</em>. Usually it points at a branch, and that branch points at a commit.</li>
<li><code>git commit</code> makes a new commit whose parent is wherever HEAD is, then drags the current branch forward with it. <b>Other branches do not move.</b></li>
<li><code>git checkout -b feature</code> is two steps at once: create the label <code>feature</code> here, then move HEAD onto it.</li></ul>
<p>The thing that confuses everyone at the start: after <code>git checkout -b feature</code>, <code>main</code> and <code>feature</code> point at the <em>same commit</em>. They only separate once you commit. A branch you have not committed on is indistinguishable from the one you made it from.</p>`,
  example:'git checkout -b feature\ngit commit -m "add report query"\ngit commit -m "fix column name"\ngit log --oneline',
  task:'Create a branch called <code>analysis</code>, switch to it, and make one commit with the message <code>first pass</code>.',
  solution:'git checkout -b analysis\ngit commit -m "first pass"',
  hint:'One command creates and switches; the second commits. Check the graph — main should stay where it was.'
},

'git-1':{
  title:'Merging, and what a merge commit really is',
  scenario:'Your branch is finished and needs to go back into <code>main</code>. A colleague warns you that <b>"the last person who did this lost a day of work."</b> Understanding the two kinds of merge is what stops that happening to you.',
  concept:`<p>There are two outcomes when you merge, and git picks between them based on the shape of the history.</p>
<p><b>Fast-forward.</b> If <code>main</code> has not moved since you branched, there is nothing to reconcile — git just slides the <code>main</code> label forward to your commit. <b>No merge commit is created.</b> The history stays a straight line, and looking at it later you cannot tell a branch ever existed.</p>
<p><b>Three-way merge.</b> If both branches have new commits, git finds the commit they last shared — the <em>merge base</em> — and combines both sets of changes into a new commit with <b>two parents</b>. That two-parent commit is the merge.</p>
<ul><li><code>git merge feature</code> merges <em>into</em> the branch you are currently on. Being on the wrong branch is the single most common mistake here — check with <code>git status</code> first.</li>
<li>The first parent is the branch you were on; the second is the one you merged in. That order is why <code>HEAD^1</code> and <code>HEAD^2</code> give different commits.</li>
<li><code>--no-ff</code> forces a merge commit even when a fast-forward was possible. Teams use it so the history records that a branch existed.</li></ul>`,
  example:'git checkout -b feature\ngit commit -m "new metric"\ngit checkout main\ngit commit -m "hotfix"\ngit merge feature',
  task:'Starting from the initial commit: branch to <code>feature</code> and commit <code>feature work</code>; then go back to <code>main</code>, commit <code>main work</code>, and merge <code>feature</code> in.',
  solution:'git checkout -b feature\ngit commit -m "feature work"\ngit checkout main\ngit commit -m "main work"\ngit merge feature',
  hint:'Because both branches moved, this cannot fast-forward — you should end with a commit that has two parents.'
},

'git-2':{
  title:'Rewriting history: rebase, reset and revert',
  scenario:'You committed an API key. It is in the history of a branch you have already pushed. <b>The fix you choose depends entirely on who else has that history</b> — and picking wrong is how teams lose work.',
  concept:`<p>Three commands undo things, and they are not interchangeable.</p>
<ul><li><b><code>git revert X</code></b> makes a <em>new</em> commit that undoes X. Nothing is rewritten, so it is always safe on shared branches. The history keeps the mistake and the correction — which is honest, and sometimes exactly what an auditor wants.</li>
<li><b><code>git reset --hard X</code></b> moves the branch label back to X. The commits after it are not deleted, but nothing points to them any more, so they effectively vanish. Safe on your own local work; <b>destructive on anything anyone else has pulled.</b></li>
<li><b><code>git rebase main</code></b> replays your commits on top of main, one at a time. The result is a straight line with no merge commit.</li></ul>
<p>The part people miss: <b>a rebase does not move your commits, it copies them.</b> A replayed commit has a different parent, so it is a different commit with a different hash — even though the message is identical. The originals are still in the repository, just unreferenced. This is the whole reason for the rule <em>"never rebase a branch someone else is working on"</em>: their copy and your copy are now different objects, and git cannot tell they were meant to be the same.</p>
<p><code>git cherry-pick X</code> is the same copying mechanic aimed at a single commit — useful for lifting one fix out of a branch you are not ready to merge.</p>`,
  example:'git checkout -b feature\ngit commit -m "step one"\ngit checkout main\ngit commit -m "unrelated"\ngit checkout feature\ngit rebase main',

  hint:'You have to be on the branch being rebased when you run rebase. Afterwards no commit should have two parents.'
}

let DB=null, dbReady=null;
function initDB(){
  if(dbReady) return dbReady;
  if(typeof initSqlJs!=='function'){
    dbReady=Promise.reject(new Error('The SQLite engine did not load. Check your connection, then reload — the rest of the lesson still works.'));
    dbReady.catch(()=>{});
    return dbReady;
  }
  try{
    dbReady = initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f})
      .then(SQL=>{ DB=new SQL.Database(); DB.run(DB_SQL); return DB; });
  }catch(e){ dbReady=Promise.reject(e); dbReady.catch(()=>{}); }
  return dbReady;
}
function runSQL(q){

<script>
/* ============================================================
   GIT ENGINE — an in-memory commit DAG plus enough porcelain to
   teach branching, merging, rebasing and undo.

   Why this exists: the other tracks auto-check because something
   really executes (SQLite in WASM, pandas in Pyodide, the formula
   evaluator). R and Power BI do not, and every ungraded exercise
   weakens the product. A git repository is just a DAG, and a DAG
   is simulable, so this track grades properly rather than asking
   the learner to mark their own homework.

   Identity is content-derived, the way real git does it: a
   commit's hash comes from its message and its parents' hashes.
   Two histories built by different routes -- different typing
   order, different branch names along the way -- compare equal
   when the shape of the history is equal. That is what lets an
   exercise accept any correct path to the same result.
   ============================================================ */

/* djb2, hex. Not cryptographic and does not need to be: it is a
   structural fingerprint for comparing two in-memory histories,
   never a security boundary and never persisted. */
function gitHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++) h = ((h*33) ^ str.charCodeAt(i)) >>> 0;
  return h.toString(16).padStart(8,'0');
}

function newRepo(){
  return {
    commits:{},        /* id -> {id, parents:[id], msg, seq} */
    refs:{},           /* branch name -> commit id */
    tags:{},           /* tag name -> commit id */
    head:{type:'branch', name:'main'},   /* or {type:'detached', id} */
    seq:0,
    log:[]             /* transcript lines, for the output pane */

}

/* A repo with an initial commit, so lessons start somewhere real. */
function seedRepo(messages){
  const r = newRepo();
  r.refs.main = null;
  (messages || ['initial commit']).forEach(m => commitTo(r, m));

}

}
function setHead(r, id){

}

     which real git achieves via timestamp. */

    if(id === null && rev !== 'HEAD') throw new GitError(`ambiguous argument '${rev}'`);
    setHead(r, id);
    const mode = args.find(a => a.startsWith('--')) || '--mixed';
    return `HEAD is now at ${shortId(id)} ${id ? r.commits[id].msg : ''}`.trim() + (mode==='--hard' ? '' : '');
  },

  tag(r, args){
    if(!args.length) return Object.keys(r.tags).sort().join('\n') || '(no tags)';
    r.tags[args[0]] = resolveRev(r, args[1] || 'HEAD');
    return '';
  },

  log(r, args){
    const n = args.includes('--oneline') ? 20 : 8;
    const out = [];
    const seen = new Set();
    const walk = [headCommit(r)];
    while(walk.length && out.length < n){
      const id = walk.shift();
      if(!id || seen.has(id)) continue;
      seen.add(id);
      const c = r.commits[id];
      out.push(args.includes('--oneline')
        ? `${shortId(id)} ${c.msg}`
        : `commit ${id}\n\n    ${c.msg}\n`);
      c.parents.forEach(p => walk.push(p));
    }
    return out.join('\n') || '(no commits yet)';
  },

  status(r){
    const where = r.head.type === 'branch' ? `On branch ${r.head.name}` : `HEAD detached at ${shortId(r.head.id)}`;
    return `${where}\nnothing to commit, working tree clean`;
  }
};

/* commitTo without moving HEAD -- used by rebase/cherry-pick, which
   place commits deliberately and move HEAD themselves. */
function commitTo2(r, msg, parents){
  const id = gitHash(msg + '␀' + parents.join(',') + '␀' + (r.seq++));
  r.commits[id] = {id, parents, msg, seq:Object.keys(r.commits).length};
  return id;
}

/* Split a command line, respecting quotes around commit messages. */
function tokenize(line){
  const out = [];
  const re = /"([^"]*)"|'([^']*)'|(\S+)/g;
  let m;
  while((m = re.exec(line))) out.push(m[1] ?? m[2] ?? m[3]);
  return out;
}

function runGit(r, line){
  const parts = tokenize(line.trim());
  if(!parts.length) return '';
  if(parts[0] !== 'git') throw new GitError(`'${parts[0]}' is not a git command`);
  const cmd = parts[1];
  if(!cmd) throw new GitError('usage: git <command> [<args>]');
  const fn = GIT_CMDS[cmd];
  if(!fn) throw new GitError(`'${cmd}' is not a git command. See 'git --help'.`);
  return fn(r, parts.slice(2)) ?? '';
}

/* Run a whole script, stopping at the first failure so the learner
   sees which line broke rather than a cascade. */
function runGitScript(repo, text){
  const lines = text.split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
  const out = [];
  for(const line of lines){
    try{
      const res = runGit(repo, line);
      out.push({cmd:line, out:res, ok:true});
    }catch(e){
      out.push({cmd:line, out:e.message, ok:false});
      return {log:out, failed:true};
    }
  }
  return {log:out, failed:false};
}

/* ---------- structural comparison ----------
   Canonical hash of a commit: its message plus its parents' canonical
   hashes, so identity follows shape rather than the ids this session
   happened to generate. Two repos match when their branches point at
   the same shapes and HEAD is in the same place. */
function canonical(r, id, memo){
  memo = memo || new Map();
  if(!id) return '0';
  if(memo.has(id)) return memo.get(id);
  const c = r.commits[id];
  if(!c) return '0';
  /* Parent order is preserved -- for a merge, first parent vs second
     parent is a real difference, not an incidental one. */
  const h = gitHash(c.msg + '(' + c.parents.map(p => canonical(r, p, memo)).join(',') + ')');
  memo.set(id, h);
  return h;
}

function repoSignature(r){
  const memo = new Map();
  const branches = {};
  Object.keys(r.refs).sort().forEach(n => { branches[n] = canonical(r, r.refs[n], memo); });
  return JSON.stringify({
    branches,
    head: r.head.type === 'branch' ? 'branch:' + r.head.name : 'detached:' + canonical(r, r.head.id, memo),
    tip: canonical(r, headCommit(r), memo)
  });
}

/* What differs, in words a learner can act on. */
function diffRepos(got, want){
  const gm = new Map(), wm = new Map();
  const gb = Object.keys(got.refs).sort(), wb = Object.keys(want.refs).sort();

  const missing = wb.filter(b => !gb.includes(b));
  if(missing.length) return `The solution has a branch called <code>${missing[0]}</code> and yours does not.`;
  const extra = gb.filter(b => !wb.includes(b));
  if(extra.length) return `You have an extra branch <code>${extra[0]}</code> that the solution does not.`;

  for(const b of wb){
    if(canonical(got, got.refs[b], gm) !== canonical(want, want.refs[b], wm)){
      const gn = ancestors(got, got.refs[b]).size, wn = ancestors(want, want.refs[b]).size;
      if(gn !== wn) return `Branch <code>${b}</code> has ${gn} commit${gn===1?'':'s'} in its history; the solution has ${wn}.`;
      return `Branch <code>${b}</code> has the right number of commits but a different shape or different messages.`;
    }
  }
  const gh = got.head.type==='branch' ? got.head.name : '(detached)';
  const wh = want.head.type==='branch' ? want.head.name : '(detached)';
  if(gh !== wh) return `The history matches, but HEAD is on <code>${gh}</code> and should be on <code>${wh}</code>. Check out the right branch.`;
  return 'The history does not match the solution yet.';
}

/* ---------- graph layout ----------
   Assigns each commit a row (topological depth) and a lane (column),
   so the renderer can draw edges without a layout library. */
function layoutGraph(r){
  const ids = Object.keys(r.commits);
  if(!ids.length) return {nodes:[], edges:[], lanes:0, rows:0};

  /* Depth = longest path from a root, so a child is always below
     every one of its parents and edges only ever point upward. */
  const depth = new Map();
  const depthOf = id => {
    if(depth.has(id)) return depth.get(id);
    const c = r.commits[id];
    const d = c.parents.length ? Math.max(...c.parents.map(depthOf)) + 1 : 0;
    depth.set(id, d);
    return d;
  };
  ids.forEach(depthOf);

  /* Lane assignment: walk each branch tip down its first-parent line
     and keep it in one column where possible, which is what makes a
     graph readable rather than a tangle. */
  const lane = new Map();
  let nextLane = 0;
  const tips = Object.keys(r.refs).sort().map(n => r.refs[n]).filter(Boolean);
  const heads = [...new Set([...tips, headCommit(r)].filter(Boolean))];
  heads.forEach(tip => {
    let id = tip, ln = null;
    while(id && !lane.has(id)){
      if(ln === null) ln = nextLane++;
      lane.set(id, ln);
      id = r.commits[id].parents[0];
    }
  });
  ids.forEach(id => { if(!lane.has(id)) lane.set(id, nextLane++); });

  const refsAt = {};
  Object.keys(r.refs).forEach(n => { const id = r.refs[n]; if(id) (refsAt[id] = refsAt[id] || []).push(n); });
  Object.keys(r.tags).forEach(n => { const id = r.tags[n]; if(id) (refsAt[id] = refsAt[id] || []).push('tag:'+n); });

  const head = headCommit(r);
  const nodes = ids.map(id => ({
    id, msg:r.commits[id].msg,
    row:depth.get(id), lane:lane.get(id),
    refs:refsAt[id] || [],
    isHead:id === head,
    merge:r.commits[id].parents.length > 1
  })).sort((a,b) => a.row - b.row);

  const edges = [];
  ids.forEach(id => r.commits[id].parents.forEach(p => {
    if(r.commits[p]) edges.push({from:id, to:p});
  }));

  return {nodes, edges, lanes:nextLane, rows:Math.max(...[...depth.values()]) + 1};
}
</script>
<script>
/* ============================================================
   MOTION — springs parameterised the way Apple parameterises
   them: damping ratio + response, not mass/stiffness/damping.

   The reason this is a spring and not a CSS transition: a
   transition cannot be grabbed mid-flight. A spring animates
   from its *current* value and carries its *current* velocity
   through a re-target, so reversing a gesture never produces
   the velocity discontinuity that reads as a brick wall.
   ============================================================ */
const REDUCED = (typeof matchMedia === 'function')
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : {matches:false, addEventListener(){}, addListener(){}};

class Spring {
  constructor(value, {damping = 1.0, response = 0.4, onFrame, onRest} = {}){
    this.v = value; this.target = value; this.vel = 0;
    this.damping = damping; this.response = response;
    this.onFrame = onFrame; this.onRest = onRest;
    this.raf = null; this.running = false;
  }
  get omega(){ return (2 * Math.PI) / this.response; }
  /* Re-target WITHOUT resetting velocity — this is what makes a
     reversal continuous instead of a hard cut. */
  to(target, {velocity, damping, response} = {}){
    this.target = target;
    if(velocity !== undefined) this.vel = velocity;
    if(damping !== undefined) this.damping = damping;
    if(response !== undefined) this.response = response;
    if(REDUCED.matches){ this.set(target); return this; }
    this.start(); return this;
  }
  /* Jump with no motion — used for 1:1 drag tracking, where the
     value must be exactly the finger, not a spring chasing it. */
  set(value){
    this.stop(); this.v = value; this.target = value; this.vel = 0;
    this.onFrame && this.onFrame(this.v); return this;
  }
  /* Feed live velocity in while dragging so release can hand off. */
  track(value, vel){
    this.stop(); this.v = value; this.vel = vel || 0;
    this.onFrame && this.onFrame(this.v); return this;
  }
  start(){
    if(this.running) return;
    this.running = true;
    let last = performance.now();
    const step = now => {
      const dt = Math.min((now - last) / 1000, 1/20); last = now;
      this.advance(dt);
      this.onFrame && this.onFrame(this.v);
      if(Math.abs(this.vel) < 0.06 && Math.abs(this.v - this.target) < 0.06){
        this.v = this.target; this.vel = 0; this.running = false; this.raf = null;
        this.onFrame && this.onFrame(this.v);
        this.onRest && this.onRest();
        return;
      }
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  /* Closed-form solution, not numerical integration. Euler at a
     real 60Hz frame silently ate ~92% of the overshoot at damping
     0.8 — the bounce vanished on actual hardware, and a 120Hz
     display behaved differently from a 60Hz one. This is exact
     and frame-rate independent. */
  advance(dt){
    const w = this.omega, z = this.damping;
    const x0 = this.v - this.target, v0 = this.vel;
    let x, v;
    if(z < 1){
      const wd = w * Math.sqrt(1 - z*z);
      const e = Math.exp(-z * w * dt);
      const c = Math.cos(wd * dt), s = Math.sin(wd * dt);
      const A = x0, B = (v0 + z*w*x0) / wd;
      x = e * (A*c + B*s);
      v = e * ((B*wd - z*w*A)*c - (A*wd + z*w*B)*s);
    } else if(z === 1){
      const e = Math.exp(-w * dt), k = v0 + w*x0;
      x = (x0 + k*dt) * e;
      v = (v0 - w*k*dt) * e;
    } else {
      const r = w * Math.sqrt(z*z - 1);
      const r1 = -z*w + r, r2 = -z*w - r;
      const c2 = (v0 - r1*x0) / (r2 - r1), c1 = x0 - c2;
      const e1 = Math.exp(r1*dt), e2 = Math.exp(r2*dt);
      x = c1*e1 + c2*e2;
      v = c1*r1*e1 + c2*r2*e2;
    }
    this.v = this.target + x;
    this.vel = v;
  }
  stop(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf=null; this.running=false; return this; }
}

/* Apple's momentum projection (Designing Fluid Interfaces sample
   code). Not the textbook v²/2a — the exponential-decay form. */
function project(velocity, decel = 0.998){
  return (velocity / 1000) * decel / (1 - decel);
}

/* Progressive resistance past a boundary. A hard stop reads as
   frozen; resistance reads as "responsive, nothing more here". */
function rubberband(overshoot, dimension, c = 0.55){
  return (overshoot * dimension * c) / (dimension + c * Math.abs(overshoot));
}

/* Velocity from a short history, not the last two points — one
   stray sample at release otherwise throws the whole handoff. */
class Tracker {
  constructor(){ this.pts = []; }
  add(x, y){
    const t = performance.now();
    this.pts.push({x, y, t});
    while(this.pts.length > 6 || (this.pts.length > 2 && t - this.pts[0].t > 110)) this.pts.shift();
  }
  velocity(axis = 'x'){
    if(this.pts.length < 2) return 0;
    const a = this.pts[0], b = this.pts[this.pts.length - 1];
    const dt = (b.t - a.t) / 1000;
    if(dt <= 0) return 0;
    return (b[axis] - a[axis]) / dt;
  }
  reset(){ this.pts = []; }
}

/* Press feedback fires on pointerdown. Waiting for click feels
   dead — and dragging away must cancel it, then coming back
   must restore it. */
function wirePress(root){
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest('.pressable');
    if(!el) return;
    el.dataset.press = '1';
    const clear = () => { delete el.dataset.press;
      window.removeEventListener('pointerup', clear);
      window.removeEventListener('pointercancel', clear); };
    window.addEventListener('pointerup', clear);
    window.addEventListener('pointercancel', clear);
  }, {passive:true});
}

/* Height animation for disclosure — springs the measured height,
   never a fixed-duration max-height guess. */
function springHeight(el, open){
  const target = open ? el.scrollHeight : 0;
  if(!el._sp){
    el._sp = new Spring(el.getBoundingClientRect().height, {
      damping:1.0, response:0.34,
      onFrame:v => { el.style.height = Math.max(0, v) + 'px'; }
    });
  }
  el.style.overflow = 'hidden';
  el._sp.to(target);
  el._sp.onRest = () => { if(open) el.style.height = 'auto'; };
}
</script>
<script>
/* ============================================================
   SUCCESS — delight as the result of getting the rest right,
   not confetti tacked on.

   Three senses fire on the SAME frame (causality + harmony):
   the seal springs in, the check draws itself, the device taps.
   Reserved for a first correct answer only — celebrating every
   re-check would train you to ignore it (utility).
   ============================================================ */
function celebrate(msg, sub){
  const host = document.getElementById('verdict');
  if(!host) return;
  const done = doneCount();
  host.className = 'verdict pass';
  host.innerHTML = `
    <div class="cel">
      <div class="cel-seal" id="celSeal">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="cel-ring" cx="22" cy="22" r="19"/>
          <path class="cel-tick" d="M13 22.5l6 6 12-13"/>
        </svg>
      </div>
      <div class="cel-txt">
        <b>${msg}</b>
        <span>${sub}</span>
      </div>
    </div>`;

  /* open the container first so nothing below jumps */
  host.style.height='auto'; const h=host.scrollHeight; host.style.height='0px';
  if(!host._sp) host._sp=new Spring(0,{damping:1.0,response:0.36,
    onFrame:x=>{host.style.height=Math.max(0,x)+'px'; host.style.opacity=Math.min(1,x/Math.max(h*.5,1));}});
  host._sp.to(h);

  if(REDUCED.matches){
    const s=document.getElementById('celSeal');
    if(s){ s.style.transform='scale(1)'; s.style.opacity='1';
      const p=s.querySelector('.cel-tick'); if(p) p.style.strokeDashoffset='0'; }
    return;
  }

  const seal=document.getElementById('celSeal');
  const tick=seal && seal.querySelector('.cel-tick');
  const len = tick ? tick.getTotalLength ? tick.getTotalLength() : 30 : 30;
  if(tick){ tick.style.strokeDasharray=len; tick.style.strokeDashoffset=len; }

  /* the seal arrives with a little bounce — earned, because this
     is a moment of achievement, not an idle state change */
  /* Starts at 0.62, not 0: nothing in the real world appears from
     nothing, and a seal that pops out of a zero-width point reads as
     a glitch rather than an arrival. The bounce stays -- it is earned. */
  new Spring(0.62,{damping:0.72,response:0.42,
    onFrame:v=>{ if(!seal) return;
      seal.style.transform='scale('+v.toFixed(3)+')';
      seal.style.opacity=Math.min(1,v*1.6).toFixed(3);
      if(tick) tick.style.strokeDashoffset=(len*Math.max(0,1-(v-0.35)/0.6)).toFixed(2);
    }}).to(1);

  /* same frame as the visual, not after it */
  try{ if(navigator.vibrate) navigator.vibrate(done%3===0?[12,40,18]:12); }catch(e){}
}

/* Ticks in the sidebar and the progress grid spring in rather
   than appearing, so you can see which one just changed. */
function popTick(el){
  if(!el || REDUCED.matches) return;
  new Spring(0.4,{damping:0.68,response:0.36,
    onFrame:v=>el.style.transform='scale('+v.toFixed(3)+')'}).to(1);
}
</script>
<script>
/* ============================================================
   UI — the same verified engines underneath, rebuilt so that
   every surface responds on press, every transition is a
   spring, and every gesture tracks 1:1.
   ============================================================ */
const main=document.getElementById('main'), deck=document.getElementById('deck'),
      tree=document.getElementById('tree'), rrail=document.getElementById('rrail'),
      side=document.getElementById('side'), scrim=document.getElementById('scrim');
const T=id=>TRACKS.find(t=>t.id===id);
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const CHEV='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>';
wirePress(document.body);
const GY=id=>'<svg class="gy" viewBox="0 0 24 24" aria-hidden="true"><use href="#gy-'+id+'"/></svg>';
function paintTrack(id){ document.documentElement.dataset.track=id; }
/* One place that tears the intro down, used by every exit route:
   the nav, the sidebar, and the track pickers all go through this. */
function teardownWelcome(){
  document.body.classList.remove('locked');
  document.documentElement.classList.remove('label-mode');
  if(typeof teardownTicker==='function') teardownTicker();
  if(typeof wObs!=='undefined' && wObs){ wObs.disconnect(); wObs=null; }
  const sd=document.getElementById('sdeck');
  if(sd){
    if(typeof wScrollFn!=='undefined' && wScrollFn) sd.removeEventListener('scroll',wScrollFn);
    sd.remove();
  }
}

/* ---------- per-exercise progress ---------- */
state.ex = state.ex || {};                      /* current exercise index per lesson */
const exList = (t,l)=> (EX[key(t,l)]||[]);
const exKey  = (t,l,i)=> t+'-'+l+'-'+i;
const exDone = (t,l,i)=> !!state.done[exKey(t,l,i)];
const exCount= (t,l)=> exList(t,l).filter((_,i)=>exDone(t,l,i)).length;
const curEx  = ()=> state.ex[key(state.track,state.level)] || 0;
function setEx(i){ state.ex[key(state.track,state.level)] = i; }
/* A lesson counts as complete only when all of its exercises are. */
function syncLesson(t,l){
  const list=exList(t,l), k=key(t,l);
  const all = list.length>0 && list.every((_,i)=>exDone(t,l,i));
  if(all) state.done[k]=Date.now(); else delete state.done[k];
  save();
}
/* Lesson completion is derived, never authoritative on its own.
   Reconcile once at boot so a stale or hand-edited store cannot
   show a lesson complete with no exercises solved. */
function reconcile(){
  let changed=false;
  Object.keys(state.done).forEach(k=>{
    if(!/^[a-z]+-\d+$/.test(k)) return;
    const [t,l]=[k.split('-')[0], +k.split('-')[1]];
    const list=exList(t,l);
    const all = list.length>0 && list.every((_,i)=>exDone(t,l,i));
    if(!all){ delete state.done[k]; changed=true; }
  });
  TRACKS.forEach(t=>[0,1,2].forEach(l=>{
    const list=exList(t.id,l);
    if(list.length && list.every((_,i)=>exDone(t.id,l,i)) && !state.done[key(t.id,l)]){
      state.done[key(t.id,l)]=Date.now(); changed=true; }
  }));
  if(changed) save();
}

function solveEx(t,l,i){
  const first = !exDone(t,l,i);
  state.done[exKey(t,l,i)] = Date.now();
  syncLesson(t,l);
  return first;
}

/* flat ordering so swipe can move across track boundaries */
const ORDER=[]; TRACKS.forEach(t=>[0,1,2].forEach(l=>ORDER.push([t.id,l])));
const posOf=(t,l)=>ORDER.findIndex(o=>o[0]===t&&o[1]===l);

/* ---------- segmented control thumb ---------- */
const thumb=document.getElementById('thumb');
const thumbX=new Spring(0,{damping:1.0,response:0.34,onFrame:v=>{thumb.style.transform='translate3d('+v+'px,0,0)';}});
function moveThumb(instant){
  const cur=document.querySelector('#nav .seg[aria-current="page"]');
  if(!cur) return;
  const nav=cur.parentElement.getBoundingClientRect(), r=cur.getBoundingClientRect();
  thumb.style.width=r.width+'px';
  instant ? thumbX.set(r.left-nav.left) : thumbX.to(r.left-nav.left);
}
addEventListener('resize',()=>moveThumb(true));

/* ---------- sidebar tree ---------- */
function renderTree(){
  tree.innerHTML=TRACKS.map(t=>`
    <div class="trk ${state.open[t.id]?'open':''}" data-t="${t.id}" style="--tg:var(--${t.id})">
      <button class="trk-btn pressable soft" data-toggle="${t.id}">
        <span class="swatch"></span>
        <span class="trk-name">${t.name}</span>
        <span class="trk-frac">${trackDone(t.id)}/3</span>
        <span class="chev">${CHEV}</span>
      </button>
      <div class="lvls" data-lv="${t.id}">
        ${LEVELS.map((L,i)=>`<button class="lvl pressable soft" data-go="${t.id}:${i}"
          aria-current="${state.view==='learn'&&state.track===t.id&&state.level===i}">
          <span class="tick ${isDone(t.id,i)?'on':''}">${CHECK}</span>${L}</button>`).join('')}
      </div>
    </div>`).join('');
  tree.querySelectorAll('.lvls').forEach(el=>{
    el.style.height = state.open[el.dataset.lv] ? 'auto' : '0';
  });
}

/* ---------- right rail ---------- */
function renderRail(){
  if(state.view==='home'){
    let solved=0; TRACKS.forEach(t=>[0,1,2].forEach(l=>solved+=exCount(t.id,l)));
    const n=nextUp();
    rrail.innerHTML=`
      <div class="card"><h4>Your progress</h4>
        <div class="meter"><i data-w="${Math.round(solved/Math.max(1,EX_TOTAL())*100)}"></i></div>
        <div class="kv"><span>Exercises</span><b>${solved} / ${EX_TOTAL()}</b></div>
        <div class="kv"><span>Lessons</span><b>${doneCount()} / ${LESSON_TOTAL()}</b></div>
      </div>
      <div class="card"><h4>${solved?'Pick up here':'Suggested start'}</h4>
        ${n?`<p style="color:var(--label);font-weight:500">${LESSONS[key(n.t,n.l)].title}</p>
           <p>${T(n.t).name} · ${LEVELS[n.l]}</p>
           <button class="btn pri pressable" data-go="${n.t}:${n.l}" style="width:100%;justify-content:center;margin-top:5px">Open lesson</button>`

const exSolvedTotal=()=>{let n=0;TRACKS.forEach(t=>[0,1,2].forEach(l=>n+=exCount(t.id,l)));return n;};

/* ---------- swipe deck: 1:1 tracking, rubber-band, momentum ---------- */
const deckX=new Spring(0,{damping:1.0,response:0.36,
  onFrame:v=>{deck.style.transform='translate3d('+v+'px,0,0)';
    deck.style.opacity=(1-Math.min(Math.abs(v)/900,0.32)).toFixed(3);}});
const hintL=document.getElementById('hintL'), hintR=document.getElementById('hintR');

function goto(t,l,dir){
  const from=posOf(state.track,state.level);
  const wasHome = state.view!=='learn';
  state.track=t; state.level=l; state.view='learn'; state.open[t]=true; paintTrack(t);
  /* goto() bypasses render(), so the welcome deck's scroll lock and
     observer must be released here too — otherwise the lesson loads
     inside a body that cannot scroll. */
  teardownWelcome();
  const to=posOf(t,l);
  const d = wasHome ? 0 : (dir!==undefined ? dir : (to>from?1:to<from?-1:0));
  renderTree(); renderRail(); hdr(); syncNav();
  renderLesson();
  if(d!==0){
    /* enter from the side it came from — symmetric paths */
    deckX.track(d*46, 0);
    deckX.to(0,{damping:1.0,response:0.4});
  } else deckX.to(0);
  main.scrollIntoView({block:'start',behavior:REDUCED.matches?'auto':'smooth'});
}

(function wireSwipe(){
  const tr=new Tracker();
  let active=false, startX=0, startY=0, base=0, axis=null, pid=null;
  const W=()=>Math.min(innerWidth,760);

  deck.addEventListener('pointerdown',e=>{
    if(state.view!=='learn') return;
    if(e.target.closest('textarea,input,button,a,.out,select')) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    active=true; axis=null; pid=e.pointerId;
    startX=e.clientX; startY=e.clientY; base=deckX.v;
    deckX.stop(); tr.reset(); tr.add(e.clientX,e.clientY);
  });
  deck.addEventListener('pointermove',e=>{
    if(!active||e.pointerId!==pid) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    /* detect direction once, ~10px hysteresis, then commit */
    if(axis===null){
      if(Math.abs(dx)<10 && Math.abs(dy)<10) return;
      axis = Math.abs(dx)>Math.abs(dy)*1.25 ? 'x' : 'y';
      if(axis==='x') deck.setPointerCapture(pid);
    }
    if(axis!=='x') return;
    e.preventDefault();
    tr.add(e.clientX,e.clientY);
    const i=posOf(state.track,state.level);
    let x=base+dx;
    /* resistance at the two ends of the whole path */
    if((i===0&&x>0)||(i===ORDER.length-1&&x<0)) x=rubberband(x,W());
    deckX.track(x, tr.velocity('x'));
    const p=Math.min(Math.abs(x)/110,1);
    hintL.style.opacity = x>0 && i>0 ? p : 0;
    hintR.style.opacity = x<0 && i<ORDER.length-1 ? p : 0;
  });
  const end=e=>{
    if(!active||(e&&e.pointerId!==pid)) return;
    const wasX=axis==='x'; active=false; axis=null;
    hintL.style.opacity=0; hintR.style.opacity=0;
    if(!wasX) return;
    const v=tr.velocity('x');
    /* project where the flick is GOING, don't snap from where it stopped */
    const projected=deckX.v+project(v);
    const i=posOf(state.track,state.level);
    let step=0;
    if(projected<-W()*0.30 && i<ORDER.length-1) step=1;
    else if(projected>W()*0.30 && i>0) step=-1;
    if(step!==0){
      const [t,l]=ORDER[i+step];
      /* fling out at the finger's velocity, then the new lesson
         enters from the matching side */
      deckX.to(-step*W()*0.55,{velocity:v,damping:1.0,response:0.28});
      setTimeout(()=>goto(t,l,-step), REDUCED.matches?0:150);
    } else {
      /* settle back — bounce only because a gesture carried momentum */
      deckX.to(0,{velocity:v,damping:0.82,response:0.34});
    }
  };
  deck.addEventListener('pointerup',end);
  deck.addEventListener('pointercancel',end);
  addEventListener('keydown',e=>{
    if(state.view!=='learn') return;
    const el=e.target;
    if(el && typeof el.closest==='function' && el.closest('textarea,input')) return;
    const i=posOf(state.track,state.level);
    if(e.key==='ArrowRight'&&i<ORDER.length-1){const[t,l]=ORDER[i+1];goto(t,l,1);}
    if(e.key==='ArrowLeft'&&i>0){const[t,l]=ORDER[i-1];goto(t,l,-1);}
  });
})();

/* ---------- sidebar sheet: drags 1:1, projects on release ---------- */
const sideX=new Spring(-290,{damping:1.0,response:0.34,
  onFrame:v=>{ side.style.transform='translate3d('+v+'px,0,0)';
    const p=1-Math.min(Math.abs(v)/290,1);
    scrim.style.opacity=p*0.42; scrim.classList.toggle('live',p>0.02); }});
let sheetOpen=false;
const isMobile=()=>innerWidth<=860;
function openSheet(o,vel){
  sheetOpen=o;
  sideX.to(o?0:-290,{velocity:vel,damping:1.0,response:0.34});
  document.getElementById('menu').setAttribute('aria-expanded',o);
}
document.getElementById('menu').onclick=()=>openSheet(!sheetOpen);
scrim.onclick=()=>openSheet(false);
(function wireSheet(){
  const tr=new Tracker(); let on=false,sx=0,sy=0,base=0,ax=null,pid=null;
  const grab=e=>{
    if(!isMobile()) return;
    const fromEdge = !sheetOpen && e.clientX<26;
    if(!sheetOpen && !fromEdge) return;
    if(sheetOpen && !side.contains(e.target) && e.target!==scrim) return;
    on=true; ax=null; pid=e.pointerId; sx=e.clientX; sy=e.clientY;
    base=sideX.v; sideX.stop(); tr.reset(); tr.add(e.clientX,e.clientY);
  };
  addEventListener('pointerdown',grab,{passive:true});
  addEventListener('pointermove',e=>{
    if(!on||e.pointerId!==pid) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(ax===null){ if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
      ax=Math.abs(dx)>Math.abs(dy)?'x':'y'; if(ax!=='x'){on=false;return;} }
    tr.add(e.clientX,e.clientY);
    let x=base+dx;
    if(x>0) x=rubberband(x,290);          /* can't drag past open */
    if(x<-290) x=-290+rubberband(x+290,290);
    sideX.track(Math.min(0,x), tr.velocity('x'));
  },{passive:true});
  const done=e=>{
    if(!on||(e&&e.pointerId!==pid)) return;
    on=false; if(ax!=='x') return;
    const v=tr.velocity('x');
    const projected=sideX.v+project(v);
    /* velocity sign decides, not position — a fast flick commits
       even from a small displacement */
    openSheet(projected > -145, v);
  };
  addEventListener('pointerup',done); addEventListener('pointercancel',done);
})();
addEventListener('resize',()=>{ if(!isMobile()){ side.style.transform=''; scrim.style.opacity=0;
  scrim.classList.remove('live'); sheetOpen=false; } else sideX.set(sheetOpen?0:-290); });
</script>
<script>
/* ============================================================
   GIT WORKSPACE — editor, transcript, and the live commit graph.

   The graph is the point of this track. Branching and rebasing are
   spatial ideas taught almost everywhere as prose, and prose is why
   they take people months. Here the DAG redraws on every command,
   so "rebase copies commits" stops being a claim and becomes a
   thing you watch happen.

   Drawn as inline SVG from layoutGraph(). No charting library:
   the shape is a handful of circles and paths, and Chart.js has no
   opinion about DAGs.
   ============================================================ */

const GIT_LANE = 30;    /* px between branch columns */
const GIT_ROW  = 44;    /* px between commits */
const GIT_PADX = 26;
const GIT_PADY = 24;

function gitGraphSVG(repo){
  const g = layoutGraph(repo);
  if(!g.nodes.length){
    return '<div class="outmsg">No commits yet. Run <code>git commit -m "message"</code>.</div>';
  }

  const W = GIT_PADX * 2 + Math.max(1, g.lanes) * GIT_LANE + 210;
  const H = GIT_PADY * 2 + Math.max(1, g.rows) * GIT_ROW;
  const x = n => GIT_PADX + n.lane * GIT_LANE;
  const y = n => GIT_PADY + n.row * GIT_ROW;
  const pos = Object.fromEntries(g.nodes.map(n => [n.id, n]));

  let s = `<svg class="gitgraph" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
      role="img" aria-label="Commit graph: ${g.nodes.length} commits across ${g.lanes} branch lane${g.lanes===1?'':'s'}">
    <defs>
      <linearGradient id="gg-node" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="var(--tk)"/><stop offset="100%" stop-color="var(--tk-2)"/>
      </linearGradient>
    </defs>`;

  /* Edges first so nodes sit on top of them. */
  g.edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    if(!a || !b) return;
    const x1 = x(a), y1 = y(a), x2 = x(b), y2 = y(b);
    const d = x1 === x2
      ? `M${x1} ${y1} L${x2} ${y2}`
      /* Cubic with vertical control points: the line leaves the child
         going straight up before bending, which is how git GUIs draw
         lane changes and why they stay readable when lanes are close. */
      : `M${x1} ${y1} C ${x1} ${y1 - GIT_ROW * 0.55}, ${x2} ${y2 + GIT_ROW * 0.55}, ${x2} ${y2}`;
    s += `<path class="gg-edge" d="${d}"/>`;
  });

  g.nodes.forEach((n, i) => {
    const cx = x(n), cy = y(n);
    s += `<g class="gg-node${n.isHead ? ' is-head' : ''}${n.merge ? ' is-merge' : ''}" style="--i:${i}">`;
    if(n.isHead) s += `<circle class="gg-halo" cx="${cx}" cy="${cy}" r="12"/>`;
    s += `<circle class="gg-dot" cx="${cx}" cy="${cy}" r="${n.merge ? 7 : 5.5}"/>`;
    if(n.merge) s += `<circle class="gg-inner" cx="${cx}" cy="${cy}" r="2.4"/>`;

    const labelX = GIT_PADX + Math.max(1, g.lanes) * GIT_LANE + 4;
    s += `<text class="gg-msg" x="${labelX}" y="${cy + 4}">${esc(n.msg)}</text>`;

    /* Ref pills sit to the right of the message, in source order so
       the branch you are on reads first. */
    let rx = labelX + Math.min(n.msg.length * 6.4 + 12, 150);
    n.refs.forEach(ref => {
      const isTag = ref.startsWith('tag:');
      const text = isTag ? ref.slice(4) : ref;
      const w = text.length * 6.1 + 14;
      s += `<g class="gg-ref${isTag ? ' is-tag' : ''}${n.isHead && !isTag ? ' is-current' : ''}">
        <rect x="${rx}" y="${cy - 9}" width="${w}" height="18" rx="9"/>
        <text x="${rx + w/2}" y="${cy + 4}">${esc(text)}</text></g>`;
      rx += w + 5;
    });
    s += `</g>`;
  });

  return s + '</svg>';
}

/* Render the transcript of a run: each command with its output, and
   the failing line marked so the eye lands on it. */
function gitTranscript(res){
  if(!res.log.length) return '<div class="outmsg">Nothing ran.</div>';
  return '<div class="gitlog">' + res.log.map(l =>
    `<div class="gl${l.ok ? '' : ' bad'}"><div class="gl-cmd">$ ${esc(l.cmd)}</div>` +
    (l.out ? `<div class="gl-out">${esc(l.out)}</div>` : '') + '</div>').join('') + '</div>';
}

function wsGit(w, L){
  w.innerHTML = `<div class="pane">
    <div class="pane-bar">terminal<span class="sp"></span><span id="gitstate">one command per line</span></div>
    <textarea class="code" id="userin" rows="6" spellcheck="false"
      placeholder='git checkout -b feature&#10;git commit -m "message"'></textarea>
    <div class="acts">
      <button class="btn pri pressable" id="runbtn">Run</button>
      <button class="btn sec pressable" id="checkbtn">Check answer</button>
      <span style="flex:1"></span>
      <button class="btn qui pressable" id="cheatbtn">Commands</button>
    </div>
    <div class="out" id="out"><div class="outmsg">Run some commands to build a history.</div></div>
  </div>
  <div class="pane gitviz">
    <div class="pane-bar">commit graph<span class="sp"></span><span id="gitcount"></span></div>
    <div class="gg-wrap" id="graph"></div>
  </div>`;

  const out   = document.getElementById('out');
  const graph = document.getElementById('graph');
  const count = document.getElementById('gitcount');

  const draw = repo => {
    graph.innerHTML = gitGraphSVG(repo);
    const n = Object.keys(repo.commits).length;
    const b = Object.keys(repo.refs).length;
    count.textContent = `${n} commit${n===1?'':'s'}, ${b} branch${b===1?'':'es'}`;
  };

  /* Always start from the same one-commit repo, so a learner can run
     the same script twice and get the same answer. Statefulness here
     would make every exercise depend on invisible history. */
  const fresh = () => seedRepo(['initial commit']);
  draw(fresh());

  const go = check => {
    const text = document.getElementById('userin').value.trim();
    if(!text){ verdict('fail','Write at least one command first.'); return; }

    const repo = fresh();
    const res  = runGitScript(repo, text);
    out.innerHTML = gitTranscript(res);
    draw(repo);

    if(!check) return;
    if(res.failed){
      verdict('fail','<b>A command failed.</b> ' + esc(res.log.at(-1).out) + ' Nothing after that line ran.');
      return;
    }

    const want = fresh();
    const sol  = runGitScript(want, L.solution);
    if(sol.failed){ verdict('fail','The stored solution failed to run — please report this.'); return; }

    if(repoSignature(repo) === repoSignature(want)){
      const n = Object.keys(repo.commits).length;
      const merges = Object.values(repo.commits).filter(c => c.parents.length > 1).length;
      onSolved(`${n} commits, ${Object.keys(repo.refs).length} branches` +
               (merges ? `, ${merges} merge commit${merges===1?'':'s'}` : ', linear history') + '.');
    }else{
      verdict('fail','<b>Not matching yet.</b> ' + diffRepos(repo, want));
    }
  };

  document.getElementById('runbtn').onclick   = () => go(false);
  document.getElementById('checkbtn').onclick = () => go(true);
  document.getElementById('cheatbtn').onclick = () => {
    out.innerHTML = '<div class="outmsg">' + [
      'git commit -m "message"      make a commit here',
      'git branch <name>            create a label, stay where you are',
      'git checkout -b <name>       create a label and move onto it',
      'git checkout <name>          move onto an existing branch',
      'git merge <name>             merge that branch into this one',
      'git merge --no-ff <name>     merge, forcing a merge commit',
      'git rebase <name>            replay this branch on top of that one',
      'git reset --hard <rev>       move this branch back to <rev>',
      'git revert <rev>             add a commit undoing <rev>',
      'git cherry-pick <rev>        copy one commit onto this branch',
      'git log --oneline            list the history',
      'git status                   where am I?',
      '',
      'Revisions: HEAD, HEAD~1, HEAD^2, a branch name, or a short hash.'
    ].join('\n') + '</div>';
  };
  document.getElementById('userin').addEventListener('keydown', e => {
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); go(false); }
  });
}

<script>
/* ============================================================
   BENTO — a vanilla port of the MagicBento React component.

   Why a port and not the component: MagicBento needs react,
   react-dom, gsap, lucide-react, clsx and tailwind-merge. This app
   ships as one HTML file with no build step, no server and no npm
   install -- that is the property the whole project is designed
   around. Adding a React runtime to render six cards would trade
   it away for nothing the user can see.

   So every effect is reimplemented against what is already here:
   the Web Animations API instead of GSAP, CSS custom properties
   instead of Tailwind classes. Same spotlight, border glow,
   particles, tilt, magnetism and ripple; same option names.

   initBento(root, options) -> teardown()
   ============================================================ */

const BENTO_DEFAULTS = {
  enableStars:      true,
  enableSpotlight:  true,
  enableBorderGlow: true,
  enableTilt:       true,
  enableMagnetism:  true,
  clickEffect:      true,
  spotlightRadius:  300,
  particleCount:    12,
  glowColor:        '132, 0, 255',   /* RGB triplet, as in the original */
  disableAnimations:false,
  mobileBreakpoint: 768
};

/* One particle = wrapper + dot.

   The original runs two GSAP tweens on the same element: a scale/opacity
   entrance and an infinite drift. Both write `transform`, and GSAP
   reconciles that internally. The Web Animations API does not -- the
   second animation would simply replace the first. Splitting the two
   across a wrapper (drift) and a child (scale) sidesteps it entirely,
   with no compositing mode to depend on. */
function bentoParticle(x, y, color){
  const wrap = document.createElement('div');
  wrap.className = 'bento-particle';
  wrap.style.left = x + 'px';
  wrap.style.top  = y + 'px';

  const dot = document.createElement('i');
  dot.style.background = 'rgba(' + color + ', 1)';
  dot.style.boxShadow  = '0 0 6px rgba(' + color + ', .6)';
  wrap.appendChild(dot);
  return wrap;
}

function initBento(root, options){
  const o = Object.assign({}, BENTO_DEFAULTS, options || {});
  const cards = [...root.querySelectorAll('[data-bento-card]')];
  if(!cards.length) return () => {};

  const reduced = typeof REDUCED !== 'undefined' ? REDUCED.matches
                : matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* Matches the original: below the breakpoint every effect is off.
     These are pointer affordances, and a touch screen has no hover. */
  const off = o.disableAnimations || reduced || innerWidth <= o.mobileBreakpoint;

  const cleanups = [];

  cards.forEach(card => {
    /* Per-card glow colour, so each track keeps its own hue. */
    const glow = card.dataset.glow || o.glowColor;
    card.style.setProperty('--bento-glow', glow);
    card.style.setProperty('--bento-radius', o.spotlightRadius + 'px');
    if(o.enableBorderGlow) card.classList.add('has-glow');

    if(off) return;

    let particles = [];
    let timers = [];
    let hovered = false;

    const clearParticles = () => {
      timers.forEach(clearTimeout);
      timers = [];
      particles.forEach(p => {
        const a = p.animate([{opacity:1, transform:'scale(1)'}, {opacity:0, transform:'scale(0)'}],
          {duration:260, easing:'cubic-bezier(.36,0,.66,-.56)', fill:'forwards'});
        a.onfinish = () => p.remove();
      });
      particles = [];
    };

    const spawnParticles = () => {
      const {width, height} = card.getBoundingClientRect();
      for(let i = 0; i < o.particleCount; i++){
        timers.push(setTimeout(() => {
          if(!hovered) return;
          const p = bentoParticle(Math.random() * width, Math.random() * height, glow);
          card.appendChild(p);
          particles.push(p);

          p.firstChild.animate([{transform:'scale(0)', opacity:0}, {transform:'scale(1)', opacity:1}],
            {duration:300, easing:'cubic-bezier(.34,1.56,.64,1)', fill:'forwards'});

          p.animate([
            {transform:'translate(0,0) rotate(0deg)'},
            {transform:`translate(${(Math.random()-.5)*100}px, ${(Math.random()-.5)*100}px) rotate(${Math.random()*360}deg)`}
          ], {duration:2000 + Math.random()*2000, easing:'linear', iterations:Infinity, direction:'alternate'});
        }, i * 100));
      }
    };

    /* Tilt and magnetism both write `transform`, so they are composed
       into one string rather than fighting over the property. */
    let rx = 0, ry = 0, tx = 0, ty = 0;
    const paint = () => {
      card.style.transform =
        `perspective(1000px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translate3d(${tx.toFixed(2)}px, ${ty.toFixed(2)}px, 0)`;
    };

    const onEnter = () => {
      hovered = true;
      card.classList.add('is-hot');
      if(o.enableStars) spawnParticles();
    };

    const onLeave = () => {
      hovered = false;
      card.classList.remove('is-hot');
      clearParticles();
      rx = ry = tx = ty = 0;
      card.style.transform = '';
    };

    const onMove = e => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const cx = r.width / 2, cy = r.height / 2;

      if(o.enableSpotlight || o.enableBorderGlow){
        card.style.setProperty('--bento-x', x + 'px');
        card.style.setProperty('--bento-y', y + 'px');
      }
      if(o.enableTilt){
        rx = ((y - cy) / cy) * -8;
        ry = ((x - cx) / cx) *  8;
      }
      if(o.enableMagnetism){
        tx = (x - cx) * 0.05;
        ty = (y - cy) * 0.05;
      }
      if(o.enableTilt || o.enableMagnetism) paint();
    };

    const onClick = e => {
      if(!o.clickEffect) return;
      const r = card.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'bento-ripple';
      ripple.style.left = (e.clientX - r.left) + 'px';
      ripple.style.top  = (e.clientY - r.top)  + 'px';
      ripple.style.background = 'rgba(' + glow + ', .5)';
      card.appendChild(ripple);
      const a = ripple.animate([{transform:'scale(0)', opacity:1}, {transform:'scale(50)', opacity:0}],
        {duration:800, easing:'cubic-bezier(.22,1,.36,1)', fill:'forwards'});
      a.onfinish = () => ripple.remove();
    };

    card.addEventListener('mouseenter', onEnter);
    card.addEventListener('mouseleave', onLeave);
    card.addEventListener('mousemove',  onMove);
    card.addEventListener('click',      onClick);

    cleanups.push(() => {
      card.removeEventListener('mouseenter', onEnter);
      card.removeEventListener('mouseleave', onLeave);
      card.removeEventListener('mousemove',  onMove);
      card.removeEventListener('click',      onClick);
      clearParticles();
      card.style.transform = '';
    });
  });

  return () => cleanups.forEach(fn => fn());
}
</script>
<script>
/* ============================================================
   HOME — vertical, scroll-revealed, ending in a choice.

   Replaces the horizontal ticker. That version laid the whole
   pitch out as one long sentence in a single flex row and drove
   it sideways from scrollTop, which made two problems that were
   structural rather than tunable:

     - Scroll length was `viewport + row.scrollWidth`. The row was
       one very long sentence, so finishing it took a great many
       wheel turns. Shortening the copy was the only lever.
     - Words moved sideways under a vertical gesture. The wheel
       says "down", the text goes "left", and every line is in
       motion while you are trying to read it.

   This version scrolls the way the gesture means. Sections are
   viewport-height, type is large and still, and each section
   fades and rises once as it arrives -- an entrance, not a
   scrub, so nothing moves while you read it. It ends on the
   question the whole page exists to ask: which skill first.

   Reveals use IntersectionObserver against the .scrolldeck
   scroller. Deliberately NOT ScrollTrigger: pinning inside this
   custom fixed scroller needs scrollerProxy, and that indirection
   lags the true scroll position -- the bug this file already
   carries a warning about.
   ============================================================ */

var wObs = null, wBentoOff = null;

function renderWelcome(){

  /* The hero CTA goes to the first unsolved exercise of the first enabled
     track, so it lands somewhere real rather than on a marketing anchor --
     and it keeps working if the track lineup changes. */
  const ctaTrack = TRACKS[0];

  const trackCards = TRACKS.map((t, i) => {
    const done = [0,1,2].reduce((a, l) => a + exCount(t.id, l), 0);
    /* Derived, not 9. The bank is no longer three per lesson, and a
       hardcoded denominator here would quietly under-report every

    const tot  = [0,1,2].reduce((a, l) => a + exList(t.id, l).length, 0);

  host.innerHTML = `

    <span class="lwm">${BRAND}<i>.</i></span>

      <!-- Per-letter mask reveal: each outer span is a clipping window, the

        ${(BRAND + '.').split('').map((c, i) =>

function wireReveals(sd){
  const items = [...sd.querySelectorAll('[data-rv]')];
  const showAll = () => items.forEach(el => el.classList.add('in'));

  /* Reduced motion gets the finished page, never a blank one waiting
     for an animation to run. */
  if(REDUCED.matches){
    showAll();
    wireBento(sd, true);
    return;
  }

  /* IntersectionObserver drives this, per the design protocol, which is
     right about the general case: nothing should hang work off a scroll
     event.

     But IO alone is not safe here, and that is not theoretical. IO is
     driven by the rendering lifecycle, so an occluded or backgrounded
     window starves it -- verified on this machine, where a freshly
     built observer reported zero intersections for an element sitting
     at top 201 in a 720px viewport, and the page rendered blank below
     the hero with every element present. Scroll events and rAF are
     starved in the same conditions, so neither is a fallback for the
     other.

     Timers are not. So: IO does the work, and a slow poll guarantees
     that anything actually on screen gets revealed regardless of what
     the compositor is doing. The poll stops as soon as everything is
     in, which on a normal read is a second or two.

     Content must never depend on an animation to become visible. */
  sd.classList.add('rv-on');

  let pending = items.slice();
  const reveal = () => {
    if(!pending.length) return;
    const h = sd.clientHeight || innerHeight;
    const line = h * 0.88;          /* fire a little before the element is centred */
    const perSection = new Map();
    pending = pending.filter(el => {
      const r = el.getBoundingClientRect();
      /* The hero is above the fold by definition, so it is never subject to
         the trigger line. This matters for the scroll cue, which is anchored
         to the bottom of the section: its top sits below the line, so it
         would sit hidden forever and the page would never say "scroll". */
      const inHero = !!el.closest('.vs-hero');
      if(!inHero && (r.top >= line || r.bottom <= -80)) return true;
      /* Stagger within a section so a heading lands before its body. */
      const sec = el.closest('.vs');
      const n = perSection.get(sec) || 0;
      perSection.set(sec, n + 1);
      /* An explicit data-delay wins over the section stagger. The hero uses
         it so the wordmark lands on its own -- its letters take about a
         second to settle -- before the lines beneath arrive one at a time.
         A uniform 70ms stagger would run all three together. */
      el.style.transitionDelay = (el.dataset.delay !== undefined
        ? el.dataset.delay : n * 70) + 'ms';
      el.classList.add('in');
      return false;
    });
  };

  /* Scroll-linked chrome: the hero drifts and fades as it leaves, the nav
     condenses, and the track cards part slightly for depth. All of it is
     written straight from scrollTop -- the same model the old ticker used,
     and the reason ScrollTrigger is not welcome here. Transform and opacity
     only, so this stays on the compositor. */
  const nav    = sd.querySelector('#lnav');
  const cards  = [...sd.querySelectorAll('#bentoGrid [data-bento-card]')];
  const pickIn = sd.querySelector('.vs-pick');

  const parallax = () => {
    const y = sd.scrollTop;

    /* No hero fade-out. It was written for a full-viewport cinematic
       hero, where a screen of scrolling faded it as it left. Under the
       macro-whitespace layout the hero is far shorter than the viewport,
       so the same formula erased it after 200px of scroll -- measured at
       opacity 0.12 with the hero still on screen. The protocol asks for
       scroll ENTRY fades, not a departure fade, and for motion that goes
       unnoticed. Removing it is the fix, not retuning the constant. */
    if(nav) nav.classList.toggle('tight', y > 60);

    /* Cards drift in alternating directions, clamped so they never
       separate enough to break the row's alignment. */
    if(cards.length && pickIn){
      const r = pickIn.getBoundingClientRect();
      const centred = (sd.clientHeight / 2 - (r.top + r.height / 2)) / sd.clientHeight;
      const d = Math.max(-1, Math.min(1, centred)) * 14;
      cards.forEach((c, i) => { c.style.setProperty('--drift', ((i % 2 ? -d : d)).toFixed(1) + 'px'); });
    }
  };

  /* Primary mechanism: one observer, unobserving each element as it
     lands so it stops costing anything. */
  let io = null;
  if(typeof IntersectionObserver !== 'undefined'){
    io = new IntersectionObserver((entries, obs) => {
      let hit = false;
      entries.forEach(e => { if(e.isIntersecting){ hit = true; obs.unobserve(e.target); } });
      if(hit) reveal();
    }, {root: sd, rootMargin: '0px 0px -12% 0px', threshold: 0.01});
    items.forEach(el => io.observe(el));
  }

  /* parallax still needs the scroll position itself -- there is no
     observer for "how far down are we", and it is transform-only. */
  const onScroll = () => { reveal(); parallax(); };
  sd.addEventListener('scroll', onScroll, {passive: true});
  addEventListener('resize', onScroll);
  parallax();

  /* Local time. No city label: the reference hardcodes one, and inventing
     a location is exactly what the guardrails rule out. */
  const clock = sd.querySelector('#vclock');
  const tick = () => {
    if(!clock) return;
    clock.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  };
  tick();
  const clockTimer = setInterval(tick, 30000);

  reveal();                  /* the hero, which is already on screen */
  setTimeout(reveal, 60);    /* again once layout and fonts have settled */

  /* Safety net. Scroll events are themselves dispatched during the
     rendering steps, so an occluded window starves them exactly like
     it starves IntersectionObserver and rAF -- verified here, the page
     stayed blank below the hero. Timers keep running regardless, so a
     slow poll guarantees anything actually on screen gets revealed no
     matter what the compositor is doing. It stops as soon as every
     item is in, which on a normal read is a second or two. */
  const poll = setInterval(() => {
    reveal();
    if(!pending.length) clearInterval(poll);
  }, 400);

  /* Kept as an object with disconnect() so teardownWelcome(), which
     already calls wObs.disconnect(), needs no change. */
  wObs = {
    disconnect(){
      if(io) io.disconnect();
      clearInterval(poll);
      clearInterval(clockTimer);
      sd.removeEventListener('scroll', onScroll);
      removeEventListener('resize', onScroll);
    }
  };

  wireBento(sd, false);
}

function wireBento(sd, reduced){
  const grid = sd.querySelector('#bentoGrid');
  if(!grid) return;
  /* Each card carries data-glow="var-<track>"; resolve it to the real
     RGB triplet the effects need, from the computed track colour. */
  grid.querySelectorAll('[data-bento-card]').forEach(card => {
    const id = (card.dataset.glow || '').replace(/^var-/, '');
    const hex = getComputedStyle(document.documentElement).getPropertyValue('--' + id).trim();
    card.dataset.glow = hexToRgbTriplet(hex) || '132, 0, 255';
  });
  if(wBentoOff) wBentoOff();
  wBentoOff = initBento(grid, {disableAnimations: reduced, particleCount: 10, spotlightRadius: 320});
}

/* #RGB / #RRGGBB -> "r, g, b". The effects build rgba() strings, so a
   hex value straight from a custom property will not do. */
function hexToRgbTriplet(hex){
  if(!hex) return null;
  let h = hex.replace('#', '').trim();
  if(h.length === 3) h = h.split('').map(c => c + c).join('');
  if(h.length !== 6 || /[^0-9a-f]/i.test(h)) return null;
  const n = parseInt(h, 16);
  return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
}

function teardownTicker(){
  if(wObs){ try{ wObs.disconnect(); }catch(e){} wObs = null; }
  if(wBentoOff){ try{ wBentoOff(); }catch(e){} wBentoOff = null; }
}

<script>
/* ============================================================
   ACCOUNTS AND PROGRESS SYNC

   Three properties this file must not break, in order:

   1. THE APP WORKS WITH NO ACCOUNT. Signing in is opt-in. With no
      account, nothing here runs, no network call is made, and progress
      lives in localStorage exactly as it did before. That is not a
      fallback -- it is the product's original promise, and it stays
      true for anyone who never signs up.

   2. THE APP WORKS OFFLINE, AND WHEN THE CDN IS BLOCKED. The SDK is
      loaded lazily and every failure path is silent-and-local. If
      jsDelivr is unreachable, you get the anonymous app, not an error.

   3. LOCAL IS THE WORKING COPY. Solving writes to localStorage first
      and pushes afterwards. A failed push never costs you the answer
      you just got right.

   Security note: the key below is the *publishable* key and is meant to
   be readable in page source. It grants nothing on its own. Every row
   is protected by Row Level Security in Postgres (see supabase/schema.sql)
   which refuses to return or accept rows belonging to another user. The
   service-role key must never appear in this file or any file that ships.
   ============================================================ */

const SB_URL = 'https://jrsxhwmlhenupoyjlzeu.supabase.co';
const SB_KEY = 'sb_publishable_vc61agF-MFY2WGOiZpW_pg_rcU_1Sm8';

/* Major-pinned rather than exact. Pin the precise version once you have
   confirmed one, so a bad upstream release cannot reach your users. */
const SB_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';

let sb = null;                 /* the client, once loaded  */
let sbUser = null;             /* the signed-in user, or null */
let lastSynced = new Set();    /* what the server is believed to hold */
let sbLoading = null;

const exKeyRe = /^[a-z]+-\d+-\d+$/;   /* "sql-0-2"; lesson keys are derived */
const solvedKeys = () => new Set(Object.keys(state.done).filter(k => exKeyRe.test(k)));

/* Supabase parks its session under sb-<project-ref>-auth-token. Reading
   that first means an anonymous visitor never downloads the SDK at all. */
function hasStoredSession(){
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('sb-') && k.endsWith('-auth-token')) return true;
    }
  }catch(e){}
  return false;
}

function loadSb(){
  if(sbLoading) return sbLoading;
  sbLoading = new Promise((resolve, reject) => {
    if(window.supabase && window.supabase.createClient) return resolve(window.supabase);
    const s = document.createElement('script');
    s.src = SB_CDN;
    s.onload = () => (window.supabase && window.supabase.createClient)
      ? resolve(window.supabase)
      : reject(new Error('Supabase loaded but exposed no client'));
    s.onerror = () => reject(new Error('Could not reach the sign-in service'));
    document.head.appendChild(s);
  }).then(lib => {
    sb = sb || lib.createClient(SB_URL, SB_KEY, {
      auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
    });
    return sb;
  });
  return sbLoading;
}

/* ---------- merge ----------
   Union, deliberately. Solved-on-either-side wins, so signing in on a
   second device can never lose work that only one of them knows about.
   The cost is that un-solving an exercise on one device does not erase
   it on the other at merge time; ongoing changes do propagate, because
   pushes are diffed below. Losing a solve is worse than keeping a stale
   one, so that is the trade taken. */
async function pullMerge(){
  if(!sb || !sbUser) return;
  const { data, error } = await sb.from('progress').select('ex_key, solved_at');
  if(error){ console.warn('[sync] pull failed:', error.message); return; }

  const remote = new Set(data.map(r => r.ex_key));
  const local  = solvedKeys();
  let changed = false;

  data.forEach(r => {
    if(!state.done[r.ex_key]){
      state.done[r.ex_key] = Date.parse(r.solved_at) || Date.now();
      changed = true;
    }
  });

  const missing = [...local].filter(k => !remote.has(k));
  if(missing.length) await pushAdds(missing);

  lastSynced = new Set([...local, ...remote]);
  if(changed){
    save();
    if(typeof reconcile === 'function') reconcile();
    if(typeof render === 'function') render();
  }
}

async function pushAdds(keys){
  if(!sb || !sbUser || !keys.length) return;
  const rows = keys.map(k => ({
    user_id: sbUser.id,
    ex_key: k,
    solved_at: new Date(state.done[k] || Date.now()).toISOString()
  }));
  const { error } = await sb.from('progress').upsert(rows, { onConflict:'user_id,ex_key' });
  if(error) console.warn('[sync] push failed:', error.message);
}

async function pushDeletes(keys){
  if(!sb || !sbUser || !keys.length) return;
  const { error } = await sb.from('progress').delete()
    .eq('user_id', sbUser.id).in('ex_key', keys);
  if(error) console.warn('[sync] delete failed:', error.message);
}

/* save() is the one choke point every progress change goes through, so
   wrapping it catches solving, un-solving and Reset progress alike
   without touching any of their call sites. Diffed against the last
   known server state rather than pushing everything each time. */
let pushTimer = null;
(function wrapSave(){
  const base = save;
  window.save = function(){
    base();
    if(!sb || !sbUser) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => {
      const now = solvedKeys();
      const adds = [...now].filter(k => !lastSynced.has(k));
      const dels = [...lastSynced].filter(k => !now.has(k));
      lastSynced = now;
      if(adds.length) pushAdds(adds);
      if(dels.length) pushDeletes(dels);
    }, 400);
  };
})();

/* ---------- account actions ---------- */
async function acctExport(){
  if(!sb || !sbUser) return;
  const { data, error } = await sb.from('progress').select('ex_key, solved_at');
  if(error){ authMsg('Could not build the export: ' + error.message, true); return; }
  const blob = new Blob([JSON.stringify({
    exported_at: new Date().toISOString(),
    account: { id: sbUser.id, email: sbUser.email },
    solved: data
  }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'analyzeit-my-data.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function acctDeleteData(){
  if(!sb || !sbUser) return;
  if(!confirm('Delete all saved progress from your account?\n\n'
            + 'This removes every solved exercise from the server. '
            + 'Progress stored in this browser is kept — use Reset progress to clear that too.')) return;
  const { error } = await sb.from('progress').delete().eq('user_id', sbUser.id);
  if(error){ authMsg('Delete failed: ' + error.message, true); return; }
  lastSynced = new Set();
  authMsg('Your saved progress has been deleted from the server.');
}

async function acctSignOut(){
  if(!sb) return;
  await sb.auth.signOut();
  sbUser = null; lastSynced = new Set();
  closeAuth();
  if(typeof render === 'function') render();
}

/* ---------- boot ---------- */
async function syncBoot(){
  if(!hasStoredSession()) return;          /* anonymous: no network at all */
  try{
    await loadSb();
    const { data } = await sb.auth.getUser();
    if(data && data.user){
      sbUser = data.user;
      await pullMerge();
      paintAccount();
    }
  }catch(e){
    console.warn('[sync] offline or blocked; staying local:', e.message);
  }
}

<script>
/* ============================================================
   ACCOUNT UI

   Built in JS and appended on first use rather than shipped in the
   markup: someone who never signs in never pays for this, in bytes or
   in DOM. It is also the only part of the app that can fail for reasons
   outside the page -- network, provider, a wrong password -- so every
   path here ends in a sentence a person can act on, never a raw error
   code and never a silent nothing.
   ============================================================ */

let authEl = null, authMode = 'in';

function buildAuth(){
  if(authEl) return authEl;
  authEl = document.createElement('div');
  authEl.className = 'authwrap';
  authEl.id = 'authwrap';
  authEl.hidden = true;
  authEl.innerHTML = `
    <div class="authscrim" data-close></div>
    <div class="authbox" role="dialog" aria-modal="true" aria-labelledby="authttl">
      <button class="authx" data-close aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>

      <div data-when="out">
        <h2 id="authttl">Keep your progress</h2>
        <p class="authlede">Sign in and your solved exercises follow you to any browser.
          Without an account everything still works — it just stays on this device.</p>

        <button class="authbtn google" id="authGoogle">
          <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.02-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>

        <div class="author"><span>or</span></div>

        <label class="authlabel" for="authEmail">Email</label>
        <input class="authinput" id="authEmail" type="email" autocomplete="email"
               placeholder="you@example.com" spellcheck="false">
        <label class="authlabel" for="authPass">Password</label>
        <input class="authinput" id="authPass" type="password"
               autocomplete="current-password" placeholder="At least 8 characters">

        <button class="authbtn primary" id="authGo">Sign in</button>
        <p class="authswap">
          <span data-mode="in">New here? <button class="authlink" id="authToggle">Create an account</button></span>
          <span data-mode="up" hidden>Already have one? <button class="authlink" id="authToggle2">Sign in</button></span>
        </p>
      </div>

      <div data-when="in" hidden>
        <h2>Your account</h2>
        <p class="authlede" id="authWho"></p>
        <button class="authbtn" id="authExport">Export my data</button>
        <button class="authbtn" id="authDelete">Delete my saved progress</button>
        <button class="authbtn ghost" id="authOut">Sign out</button>
        <p class="authfine">Export gives you every row we hold, as JSON. Delete removes
          them from the server; progress in this browser is kept until you use
          Reset progress.</p>
      </div>

      <p class="authmsg" id="authMsg" hidden></p>
    </div>`;
  document.body.appendChild(authEl);

  authEl.querySelectorAll('[data-close]').forEach(b => b.onclick = closeAuth);
  authEl.addEventListener('keydown', e => { if(e.key === 'Escape') closeAuth(); });

  const setMode = m => {
    authMode = m;
    authEl.querySelector('#authGo').textContent = m === 'in' ? 'Sign in' : 'Create account';
    authEl.querySelector('[data-mode="in"]').hidden = m !== 'in';
    authEl.querySelector('[data-mode="up"]').hidden = m !== 'up';
    authEl.querySelector('#authPass').autocomplete =
      m === 'in' ? 'current-password' : 'new-password';
    authMsg('');
  };
  authEl.querySelector('#authToggle').onclick  = () => setMode('up');
  authEl.querySelector('#authToggle2').onclick = () => setMode('in');

  authEl.querySelector('#authGoogle').onclick = withSb(async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo: location.href.split('#')[0] }
    });
    if(error) authMsg(error.message, true);
  });

  authEl.querySelector('#authGo').onclick = withSb(async () => {
    const email = authEl.querySelector('#authEmail').value.trim();
    const pass  = authEl.querySelector('#authPass').value;
    if(!email){ authMsg('Enter your email address.', true); return; }
    if(pass.length < 8){ authMsg('Passwords need at least 8 characters.', true); return; }

    if(authMode === 'up'){
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if(error){ authMsg(error.message, true); return; }
      /* With email confirmation on, signUp returns a user but no session.
         Saying so beats leaving someone staring at an unchanged dialog. */
      if(data && data.user && !data.session){
        authMsg('Check ' + email + ' for a confirmation link, then sign in.');
        return;
      }
      await afterSignIn();
    }else{
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error){ authMsg(error.message, true); return; }
      await afterSignIn();
    }
  });

  authEl.querySelector('#authExport').onclick = () => acctExport();
  authEl.querySelector('#authDelete').onclick = () => acctDeleteData();
  authEl.querySelector('#authOut').onclick    = () => acctSignOut();
  return authEl;
}

/* Loads the SDK on demand and turns any failure into a sentence. */
function withSb(fn){
  return async () => {
    authMsg('Working…');
    try{
      await loadSb();
    }catch(e){
      authMsg('Could not reach the sign-in service. Check your connection — '
            + 'the exercises still work without an account.', true);
      return;
    }
    try{ await fn(); }
    catch(e){ authMsg(e.message || 'Something went wrong.', true); }
  };
}

async function afterSignIn(){
  const { data } = await sb.auth.getUser();
  sbUser = (data && data.user) || null;
  if(!sbUser){ authMsg('Signed in, but no account came back. Try again.', true); return; }
  authMsg('Signed in. Syncing your progress…');
  await pullMerge();
  paintAccount();
  authMsg('');
  closeAuth();
  if(typeof render === 'function') render();
}

function authMsg(text, bad){
  if(!authEl) return;
  const el = authEl.querySelector('#authMsg');
  el.textContent = text || '';

function onSolved(detail){

  else if(left===1)  sub = detail+' One exercise left in this lesson.';
  else if(left>1)    sub = detail+' '+left+' left in this lesson.';
  if(first) celebrate(win(), sub); else verdict('pass','<b>'+win()+'</b> '+detail);

  const strip=deck.querySelector('.exbar');

  const dark=document.documentElement.dataset.theme==='dark';
  document.body.style.transition='background-color 260ms ease, color 260ms ease';
  document.documentElement.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('bench.theme',dark?'light':'dark');}catch(e){}
  setTimeout(()=>document.body.style.transition='',300);
  if(state.view==='learn'&&state.track==='pbi'&&state.level===1) renderLesson();
};
document.getElementById('reset').onclick=()=>{state.done={}; save(); render();};
