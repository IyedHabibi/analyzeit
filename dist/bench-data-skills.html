/* z-index 2, matching .vs[data-photo] > *. At 1 this tied with the
   photo scrim, and because ::after is generated last it painted over
   the heading and the cards -- the whole section looked veiled. */
.vs-pick .vin{position:relative;z-index:2}

/* Nav condenses once you leave the hero. */
.lnav{transition:height .4s var(--eo), background-color .4s linear, backdrop-filter .4s linear}
.lnav.tight{height:52px;background:rgba(10,12,14,.82);backdrop-filter:blur(16px);
  box-shadow:inset 0 -1px 0 var(--hair)}

/* Footer wordmark.

   The reference sets `text-[10vw] leading-[0.8] tracking-tighter`, which
   clips: a line-height below 1 crops the cap height, and negative
   tracking eats the final glyph's right side bearing so the period
   disappears. Fixed by keeping line-height at ~1, adding the bearing
   back as padding-right, and sizing so the string can never exceed its
   container. A test asserts scrollWidth never exceeds clientWidth. */
.vfoot{border-top:1px solid var(--hair);margin-top:40px;padding:56px 26px 40px;
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:26px}
.vwm{font-family:Syne,sans-serif;font-weight:800;
  font-size:min(15vw,190px);line-height:1;letter-spacing:-.035em;
  padding-right:.05em;                      /* restores the bearing tracking removes */
  white-space:nowrap;overflow:visible;
  color:rgba(237,231,220,.10);user-select:none;-webkit-user-select:none}
.vwm i{font-style:normal;color:color-mix(in oklab, var(--accent) 55%, transparent)}
.vfoot-meta{font-size:12px;line-height:1.7;color:var(--mut);text-align:right;margin-left:auto}

@media (prefers-reduced-motion:reduce){
  .lnav{transition:none}
}

/* ============================================================
   BENTO — ported from the MagicBento React component. The grid is
   asymmetric on purpose: the first track is widest because it is
   also the suggested starting point.
   ============================================================ */
/* Equal columns, equal rows. `1fr` rather than `auto` so every card is
   exactly as tall as the tallest -- with varying blurb lengths, `auto`
   lets each card size to its own text and the row stops looking aligned. */
.bento-grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:40px;align-items:stretch}
@media (min-width:620px){ .bento-grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1040px){ .bento-grid{grid-template-columns:repeat(4,1fr)} }

.bento-card{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;justify-content:space-between;gap:16px;
  min-height:200px;padding:20px;text-align:left;cursor:pointer;
  background:linear-gradient(165deg, var(--gr2), var(--gr));
  border:1px solid var(--hair);border-radius:22px;color:var(--ink-l);
  transition:border-color .3s ease, box-shadow .3s ease, transform .18s var(--eo);
  transform-style:preserve-3d;will-change:transform;
  /* Scroll drift uses the independent `translate` property, NOT transform.
     bento.js writes an inline `transform` for tilt and magnetism, and the
     entrance keyframes animate transform too -- three writers on one
     property. `translate` composes with transform instead of replacing it,
     so all three coexist with no ordering rules to remember. */
  translate:0 var(--drift, 0px)}

/* Entrance: each card rises and settles one after another. Gated on the
   grid's .in class so the stagger plays when the section actually
   arrives -- unscoped it would run at load, behind a still-faded grid,
   and be over before anyone saw it. `backwards` holds the from-state
   through the delay so no card flashes in early. */
.bento-grid.in .bento-card{
  animation:bentoIn .72s var(--eo) backwards;
  animation-delay:calc(var(--i, 0) * 90ms + 100ms)}
@keyframes bentoIn{
  from{opacity:0;transform:translateY(22px) scale(.97)}
  to{opacity:1;transform:none}}

/* Hover lifts the card. Applied to the wrapper transform only when the
   pointer effects are NOT driving it -- bento.js writes `transform`
   inline for tilt/magnetism, and an inline style wins, so these never
   fight: before hover this rule applies, during hover the inline one does. */
.bento-card:hover{transform:translateY(-3px)}

@media (prefers-reduced-motion:reduce){
  .bento-card{animation:none}
  .bento-card:hover{transform:none}
}
.bento-card:hover, .bento-card.is-hot, .bento-card:focus-visible{
  border-color:rgba(var(--bento-glow), .34);
  box-shadow:0 18px 50px -22px rgba(var(--bento-glow), .55)}
/* These are real buttons, so give the keyboard the same affordance
   the pointer gets rather than only the default focus ring. */
.bento-card:focus-visible{outline:2px solid rgba(var(--bento-glow), .9);outline-offset:3px}

/* Spotlight: a radial wash that follows the pointer. */
.bento-spot{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;
  transition:opacity .3s ease;border-radius:inherit;
  background:radial-gradient(var(--bento-radius,300px) circle at var(--bento-x,50%) var(--bento-y,50%),
    rgba(var(--bento-glow), .15), transparent 78%)}
.bento-card:hover .bento-spot,
.bento-card.is-hot .bento-spot,
.bento-card:focus-visible .bento-spot{opacity:1}

/* Border glow: the two-layer mask trick from the original -- paint the
   padding box, punch out the content box, leaving a lit 1px edge. */
.bento-card.has-glow .bento-edge{position:absolute;inset:0;pointer-events:none;z-index:1;
  border-radius:inherit;padding:1px;opacity:0;transition:opacity .3s ease;
  background:radial-gradient(var(--bento-radius,300px) circle at var(--bento-x,50%) var(--bento-y,50%),
    rgba(var(--bento-glow), .85), transparent 42%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.bento-card:hover .bento-edge,
.bento-card.is-hot .bento-edge,
.bento-card:focus-visible .bento-edge{opacity:1}

.bento-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.bento-gy{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;
  background:rgba(var(--bento-glow), .13);color:var(--tg);
  box-shadow:inset 0 0 0 1px rgba(var(--bento-glow), .22)}
.bento-gy .gy{width:18px;height:18px}
.bento-mid{position:relative;z-index:2;display:flex;flex-direction:column;gap:6px}
.bento-name{font-size:25px;line-height:1.05;letter-spacing:-.03em;color:var(--ink-l)}
.bento-blurb{font-size:13.5px;line-height:1.45;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bento-foot{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
.bento-meter{flex:1;height:3px;border-radius:2px;background:rgba(237,231,220,.11);overflow:hidden}
.bento-meter i{display:block;height:100%;border-radius:2px;background:var(--tg);
  box-shadow:0 0 10px rgba(var(--bento-glow), .8)}
.bento-count{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mut)}

/* Particles and ripple are created by bento.js. */
.bento-particle{position:absolute;width:4px;height:4px;pointer-events:none;z-index:3}
.bento-particle i{display:block;width:100%;height:100%;border-radius:50%}
.bento-ripple{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;
  border-radius:50%;pointer-events:none;z-index:4}

/* ---------- exercise actions: hint and solution were shouting ----------
   They are escape hatches, not the primary path. Sizing them like the
   Run button told the learner to reach for them first. Small, quiet,
   outlined; "Mark solved" keeps the filled treatment because it is the
   one action that changes state. */
#hintbtn, #solbtn{
  height:28px;padding:0 11px;font-size:12.5px;font-weight:600;letter-spacing:-.004em;
  background:transparent;color:var(--ink-3);
  box-shadow:inset 0 0 0 1px var(--rule);border-radius:999px}
#hintbtn:hover, #solbtn:hover{
  background:var(--sunk);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--rule-2)}
#donebtn{height:30px;font-size:13px;border-radius:999px}

/* Everything above is decoration. Where the user has asked for less,
   drop the decoration and keep every surface legible. */
@media (prefers-reduced-transparency:reduce){
  body{background:var(--paper)}
  header{background:var(--frame)}
  .side{background:var(--frame)}
  .side-r{background:var(--paper)}
}
@media (prefers-contrast:more){
  body{background:var(--paper)}
  #deck > h1, #deck .t-hero, #deck .t-title, .eyebrow{
    background-image:none;-webkit-text-fill-color:currentColor}
  .prose code, .card code{box-shadow:inset 0 0 0 1px var(--rule-2)}
}


/* ============================================================
   PROTOCOL — Premium Utilitarian Minimalism & Editorial UI

   Replaces the PRINT and APPLE layers rather than stacking on
   them: the home page is governed by one system, not three.

   Warm monochrome, ultra-flat, macro-whitespace, 1px rules,
   pastel spot colour used only where it carries meaning.
   ============================================================ */

.scrolldeck{
  /* --- canvas and structure --- */
  --canvas:#F7F6F3;          /* warm bone */
  --surface:#FFFFFF;
  --line:#EAEAEA;
  --ink-strong:#111111;      /* never #000 */
  --ink-body:#2F3437;
  /* The protocol specifies #787774 for secondary text. On pure white that
     is fine; on this warm bone canvas it measures 4.14:1 -- under the
     4.5:1 floor for body-size text, and the protocol's own priority table
     puts accessibility above palette. Darkened the minimum amount needed
     to clear it (4.85:1). The hue is unchanged, so it still reads as the
     same warm grey. */
  --ink-mute:#6E6C68;

  /* --- pastel spot colours: scarce, semantic --- */
  --p-red-bg:#FDEBEC;    --p-red:#9F2F2D;
  --p-blue-bg:#E1F3FE;   --p-blue:#1F6C9F;
  --p-green-bg:#EDF3EC;  --p-green:#346538;
  --p-yellow-bg:#FBF3DB; --p-yellow:#956400;

  /* Track hues are remapped to the pastel set here rather than in the
     markup: the cards read `--tg: var(--sql)` from an inline style, and
     inline wins, so the only way to recolour them is to redefine what
     --sql means inside this subtree. */
  --sql:var(--p-blue);   --python:var(--p-yellow);
  --r:var(--p-green);    --git:var(--p-red);

  /* Legacy token names the existing markup still reads. */
  --gr:var(--canvas); --gr2:var(--surface);
  --ink-l:var(--ink-strong); --ink2:var(--ink-body); --mut:var(--ink-mute);
  --hair:var(--line); --accent:var(--p-red);

  background:var(--canvas);
  color:var(--ink-body);
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;
  font-size:16px;line-height:1.6;letter-spacing:0;
  -webkit-font-smoothing:antialiased}

/* Ambient depth: a section must not read as flat, but the light has to
   stay under the threshold of notice. Fixed and pointer-events:none so
   it never repaints with the scroller. */
.grain{opacity:1;mix-blend-mode:normal;background-image:none;
  background:
    radial-gradient(58vw 48vh at 14% 8%,  rgba(190,150,100,.045), transparent 62%),
    radial-gradient(52vw 44vh at 88% 32%, rgba(120,150,190,.038), transparent 64%),
    radial-gradient(46vw 40vh at 50% 96%, rgba(190,160,120,.030), transparent 66%)}

/* --- typographic architecture --------------------------------------
   Sans for body, UI and buttons. Serif reserved for hero headings and
   quotes, with tight tracking and 1.1 leading. Mono for code and meta. */
.scrolldeck .dsp, .bigmark, .vbig, .step-txt h3, .bento-name, .vwm, .us-quote{
  font-family:Newsreader,"Lyon Text",Georgia,serif;font-weight:400}
.bigmark{
  /* Bigger, per the brief. 12vw with a 168px ceiling: "BENCH." in Newsreader
     runs about 3.7em, so 168px leaves room inside the 64rem measure. */
  font-size:clamp(64px,12vw,168px);line-height:1.06;letter-spacing:-.04em;
  color:var(--ink-strong);margin:0;display:block}

/* Each letter is a clipping window; the inner span rises through it. The
   padding/margin pair gives the mask room for the full stop's overshoot
   without letting the travel show above the cap line. */
.bigmark .ltr{display:inline-block;overflow:hidden;vertical-align:bottom;
  padding-bottom:.08em;margin-bottom:-.08em}
.bigmark .ltr > span{display:inline-block;
  animation:markRise .72s var(--eo) backwards;
  animation-delay:calc(var(--i) * 68ms + 120ms)}

/* ---- foil sweep ----
   The liquid-metal idea, done as foil stamping rather than chrome.

   A chrome highlight cannot work on paper: at its brightest it measures
   1.08:1 against this canvas, so the letter would disappear mid-sweep.
   The band therefore peaks at a warm bronze-grey (#85806F, 3.66:1 --
   above the 3:1 floor for large text), which reads as light catching
   foil instead of a mirror flash. Measured, not guessed.

   Gated on @supports: background-clip:text needs a transparent fill,
   and if the browser does not support the clip the transparent fill
   would leave an invisible headline. Without the gate this is the
   blank-page failure mode all over again. */
@supports ((background-clip:text) or (-webkit-background-clip:text)){
  .bigmark .ltr > span{
    background-image:linear-gradient(105deg,
      var(--ink-strong) 0%,   var(--ink-strong) 38%,
      #4A473F 40%,            #85806F 50%,          #4A473F 60%,
      var(--ink-strong) 68%,  var(--ink-strong) 100%);
    background-size:260% 100%;
    background-position:130% 0;   /* parked off to one side: plain ink */
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation-name:markRise, foilSweep;
    animation-duration:.72s, 5s;
    animation-iteration-count:1, infinite;
    animation-timing-function:var(--eo), var(--eio);
    animation-delay:calc(var(--i) * 68ms + 120ms), 1.28s;
    animation-fill-mode:backwards, both}
  /* The full stop keeps its own colour -- the sweep is for the word. */
  .bigmark .dot > span{background-image:none;-webkit-text-fill-color:var(--p-red)}
}
/* Both ends of the travel sit outside the highlight band, so the mark is
   solid ink before the sweep starts and after it finishes. */
@keyframes foilSweep{
  0%{background-position:130% 0}
  30%{background-position:-30% 0}
  100%{background-position:-30% 0}}
.bigmark .dot > span{color:var(--p-red)}
/* 105%, not 100%: a hair past the mask edge so no sliver of the glyph is
   visible at rest before the animation starts. */
@keyframes markRise{
  from{transform:translateY(105%)}
  to{transform:translateY(0)}}

/* A short rule sets the name apart from the lines beneath it, so the
   wordmark reads as its own moment rather than the first line of a
   paragraph. It draws itself once the last letter has landed. */
.bigmark::after{content:"";display:block;width:72px;height:1px;
  background:var(--line);margin-top:34px;transform-origin:left center;
  animation:ruleDraw .5s var(--eo) 1.02s backwards}
@keyframes ruleDraw{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.vbig{font-size:clamp(30px,3.8vw,46px);line-height:1.1;letter-spacing:-.028em;
  color:var(--ink-strong);margin-top:14px}
.step-txt h3{font-size:24px;line-height:1.2;letter-spacing:-.022em;color:var(--ink-strong)}
.bento-name{font-size:21px;line-height:1.2;letter-spacing:-.02em;color:var(--ink-strong)}

.vstate{font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;
  font-style:normal;font-weight:400;
  font-size:clamp(17px,1.9vw,21px);line-height:1.55;letter-spacing:-.008em;
  color:var(--ink-body);max-width:46ch}
/* .scrolldeck p{margin:0} sits at (0,1,1) and beats a bare .vstate /
   .vlede at (0,1,0), so their spacing was silently zeroed. Both are <p>.
   Matching the element raises these above it. */
.scrolldeck p.vstate{margin-top:34px}
.scrolldeck p.vlede{margin-top:20px}
.vstate em{font-style:normal;color:var(--p-red)}
.vlede, .vbody, .step-txt p{font-size:16px;line-height:1.6;letter-spacing:0;
  color:var(--ink-body);max-width:62ch}
.vlede{margin-top:18px}
.marg, .vfine, .vcta-note, .vfoot-meta, .bento-blurb{
  font-size:14px;line-height:1.6;color:var(--ink-mute);letter-spacing:0}
.bento-blurb{font-family:Archivo,"Helvetica Neue",system-ui,sans-serif}

/* --- tags and status badges: pill, tiny, wide-tracked, pastel --- */
.vkicker, .lbl, .bento-card .lbl{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px;border-radius:9999px;border:0;box-shadow:none;
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;
  font-size:11px;font-weight:600;line-height:1;
  letter-spacing:.05em;text-transform:uppercase;
  background:var(--p-blue-bg);color:var(--p-blue)}
.vkicker i{display:none}
.lbl.a{background:var(--p-red-bg);color:var(--p-red)}
.step-n{display:inline-block;padding:4px 9px;border-radius:9999px;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;
  background:var(--p-yellow-bg);color:var(--p-yellow)}

/* --- macro whitespace and measure --- */
.vs{min-height:auto;padding:8rem 1.75rem}
.vs-hero{min-height:auto;padding:9rem 1.75rem 7rem}
.vs-hero .vin, .vs-how .vin, .vs-pick .vin{
  display:block;max-width:64rem;margin:0 auto}
.vin.wide{max-width:72rem}
.marg{display:block;max-width:52ch;margin:0 0 26px;padding:0;border:0;text-align:left}
.marg b{display:inline;color:var(--ink-strong);font-weight:600;
  text-transform:none;letter-spacing:0;font-size:14px;margin:0}
.marg b::after{content:" — "}
.vcue{display:none}

/* --- primary call to action --- */
.vcta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:34px}
.btn-hero{height:44px;padding:0 20px;border-radius:5px;
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;
  font-size:14px;font-weight:600;letter-spacing:0;
  color:#FFFFFF;background:var(--ink-strong);box-shadow:none;
  transition:background-color 200ms ease, transform 200ms cubic-bezier(.16,1,.3,1)}
.btn-hero:hover{background:#333333;box-shadow:none}
.btn-hero:active, .btn-hero[data-press="1"]{transform:scale(.98)}
.lpill{border-radius:5px;background:var(--ink-strong);color:#FFFFFF;
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;
  font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;box-shadow:none}
.lpill:hover{background:#333333}

/* --- running head --- */
.lnav, .lnav.tight{height:56px;
  background:rgba(247,246,243,.82);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 -1px 0 var(--line)}
.lnav .lwm{font-family:Newsreader,Georgia,serif;font-weight:400;
  font-size:17px;letter-spacing:-.02em;color:var(--ink-strong);text-transform:none}
.lnav .lwm i{color:var(--p-red)}

/* --- bento: asymmetric grid, 1px rules, crisp radius, generous padding --- */
.steps{list-style:none;margin:3rem 0 0;padding:0;
  display:grid;gap:1.25rem;grid-template-columns:1fr}
@media (min-width:900px){
  /* Asymmetric on purpose: the first step spans, the other two sit
     beside it. Equal thirds is the layout this protocol rejects. */
  .steps{grid-template-columns:1.35fr 1fr}
  .step:nth-child(1){grid-column:1 / -1}
}
.step{display:block;margin:0;padding:2rem;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 0 0 rgba(0,0,0,0);
  transition:box-shadow 200ms ease}
.step:hover{box-shadow:0 2px 8px rgba(0,0,0,.04)}
.step-txt{margin-bottom:1.25rem}
.step-txt h3{margin:.75rem 0 .5rem}

/* --- faux-OS window chrome on the UI replicas --- */
.uishot{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:var(--surface);box-shadow:none;max-width:none}
.uishot::after{content:attr(data-fig);display:block;padding:10px 14px;
  border-top:1px solid var(--line);background:#FBFBFA;
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;
  font-size:12px;color:var(--ink-mute)}
.us-bar{height:38px;padding:0 14px;background:#FBFBFA;color:var(--ink-mute);
  box-shadow:inset 0 -1px 0 var(--line);
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;font-size:12px}
/* Three window controls from one element: the dot plus two shadows. */
.us-bar::before{content:"";width:9px;height:9px;border-radius:50%;flex:none;
  background:#DFDFDD;box-shadow:15px 0 0 #DFDFDD, 30px 0 0 #DFDFDD;
  margin-right:38px}
.us-dot{display:none}
.us-tag{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-mute)}
.us-body{padding:18px;gap:14px}
.us-code{padding:16px 18px;font-size:12.5px;line-height:1.75;color:#2F3437;background:var(--surface)}
.us-code .k{color:var(--p-blue);font-weight:600}
.us-code .s{color:var(--p-green)}
.us-code .n{color:var(--p-yellow)}
.us-caret{background:var(--p-blue)}
.us-quote{background:var(--canvas);border-radius:8px;box-shadow:none;
  border-left:2px solid var(--line);
  font-size:15px;line-height:1.55;color:var(--ink-strong);font-style:italic}
.us-task{font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;
  font-size:14px;line-height:1.6;color:var(--ink-body)}
.us-task b{color:var(--ink-strong);font-weight:600}
.us-task code{font-family:"JetBrains Mono",monospace;font-size:12px;
  padding:2px 6px;border-radius:4px;background:var(--p-blue-bg);color:var(--p-blue);
  box-shadow:none}
.us-acts{padding:0 18px 16px;gap:10px;align-items:center}
.us-btn{height:30px;padding:0 13px;border-radius:5px;
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;font-size:12.5px;
  background:var(--surface);color:var(--ink-body);
  box-shadow:none;border:1px solid var(--line)}
.us-btn.pri{background:var(--ink-strong);color:#FFFFFF;border-color:var(--ink-strong)}
/* Keystroke micro-UI: a physical key. */
.us-kbd{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-mute);
  padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--canvas)}
.us-out th{background:#FBFBFA;color:var(--ink-mute);box-shadow:inset 0 -1px 0 var(--line);
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;font-size:10.5px}
.us-out td{color:var(--ink-body);box-shadow:inset 0 1px 0 var(--line);
  font-family:"JetBrains Mono",monospace}
.us-verdict{border-radius:6px;padding:10px 12px;
  font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;font-size:13px}
.us-verdict.ok{background:var(--p-green-bg);color:var(--p-green);box-shadow:none}
.us-verdict.bad{background:var(--p-red-bg);color:var(--p-red);box-shadow:none}
.us-verdict i{display:none}
.us-hint{font-family:Archivo,"Helvetica Neue",system-ui,sans-serif;
  font-style:normal;font-size:12.5px;color:var(--ink-mute)}

/* --- the chooser: cards, 1px rules, crisp radius, generous padding --- */
.vs-pick{border-top:1px solid var(--line)}
.bento-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-top:2.5rem;border:0}
@media (min-width:680px){ .bento-grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1040px){ .bento-grid{grid-template-columns:repeat(4,1fr)} }
.bento-card{min-height:0;padding:1.75rem 1.5rem;gap:.9rem;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 0 0 rgba(0,0,0,0);transform:none;translate:none;animation:none;
  transition:box-shadow 200ms ease, transform 200ms cubic-bezier(.16,1,.3,1)}
.bento-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.04);border-color:var(--line);
  transform:translateY(-1px)}
.bento-card:active, .bento-card[data-press="1"]{transform:scale(.98)}
.bento-spot,.bento-edge,.bento-particle,.bento-ripple{display:none}
.bento-gy{width:34px;height:34px;border-radius:8px;
  background:var(--p-blue-bg);color:var(--tg);box-shadow:none}
.bento-meter{height:3px;border-radius:9999px;background:var(--line)}
.bento-meter i{background:var(--tg);border-radius:9999px;box-shadow:none}
.bento-count{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-mute)}

/* --- footnote and colophon --- */
.vfine{font-size:13.5px;line-height:1.6;color:var(--ink-mute);max-width:62ch;
  margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line)}
.vfine::before{content:none}
.vfoot{border-top:1px solid var(--line);padding:2.5rem 1.75rem 3rem;
  max-width:72rem;margin:0 auto;align-items:baseline}
.vwm{font-size:clamp(26px,3vw,38px);line-height:1.1;letter-spacing:-.03em;
  color:var(--ink-strong);opacity:.16}
.vwm i{color:var(--p-red)}

/* --- motion: present, never distracting -------------------------- */
.rv{opacity:0;transform:translateY(12px);
  transition:opacity 600ms cubic-bezier(.16,1,.3,1),
             transform 600ms cubic-bezier(.16,1,.3,1)}
.scrolldeck.rv-on .rv{opacity:0;transform:translateY(12px)}
.scrolldeck.rv-on .rv.in, .rv.in{opacity:1;transform:none}
.bento-grid.in .bento-card{
  animation:protoIn 600ms cubic-bezier(.16,1,.3,1) backwards;
  animation-delay:calc(var(--i, 0) * 80ms)}
@keyframes protoIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.scrolldeck button:focus-visible,
.scrolldeck a:focus-visible,
.scrolldeck [tabindex]:focus-visible{
  outline:2px solid var(--p-blue);outline-offset:3px;border-radius:4px}

@media (prefers-reduced-motion:reduce){
  /* Fewer and gentler, not none: the letters still fade up together, but
     nothing travels and nothing draws. */
  .bigmark .ltr > span{animation:markFade .3s ease backwards;animation-delay:0ms;
    background-image:none;-webkit-text-fill-color:var(--ink-strong)}
  .bigmark .dot > span{-webkit-text-fill-color:var(--p-red)}
  .bigmark::after{animation:none}
  @keyframes markFade{from{opacity:0}to{opacity:1}}
  .rv{transition:none}
  .bento-grid.in .bento-card{animation:none}
  .btn-hero, .bento-card{transition:none}
  .grain{display:none}
}
@media (prefers-contrast:more){
  .scrolldeck{--ink-body:#1A1D1F; --ink-mute:#4A4A47; --line:#B9B9B4}
  .grain{display:none}
}
@media (prefers-reduced-transparency:reduce){
  .lnav, .lnav.tight{background:var(--canvas);
    -webkit-backdrop-filter:none;backdrop-filter:none}
}

/* ============================================================
   RESPONSIVE CONTAINMENT
   Not a new design layer -- one defect class, fixed at the root.

   `.vs` is display:grid, so `.vin` is a grid item and grid items
   default to `min-width:auto`: they cannot shrink below their
   min-content width. The min-content of these sections is set by
   `<pre class="us-code">`, whose `white-space:pre` makes its longest
   SQL line unbreakable. At 375px that forced `.vin` to 445px and
   pushed 46 elements past the viewport edge -- and because
   `.scrolldeck` is `overflow:hidden`, they were CLIPPED, not
   scrollable. The content was simply unreachable on a phone.

   Measured before: 46 elements with right > viewport. After: 1,
   and that one is a token inside the code block's own scroller,
   which is where horizontal scrolling belongs.

   No new class names -- every selector below already exists, so
   this cannot collide the way .sec / .bigmark / .rv did.
   ============================================================ */
.vs > *{min-width:0}
.steps, .step, .step > *{min-width:0}

/* Long code lines scroll inside their own figure. The page body
   must never scroll horizontally; the code block may. */
.us-code{overflow-x:auto; overscroll-behavior-x:contain}


/* --- app header at phone widths ---
   The header is flex: brandmark + nav + spacer + count + two icon
   buttons. At 375px it needed 521px, and flex resolved that by
   crushing the two 32x32 icon buttons to 15px and pushing the theme
   toggle to x=511 -- 136px off-screen, unreachable. `.count` was
   already hidden at 860; the nav was not touched at any width.

   `flex:none` on the icon buttons makes them uncrushable, the
   wordmark drops to its glyph (the menu button and glyph still
   identify the app), and the tightened metrics let all four nav
   items fit at 375px exactly. Below that the nav scrolls rather
   than overflowing -- it is the one thing here that may. */
@media (max-width:560px){
  header{gap:4px;padding:0 8px}
  .iconbtn{flex:none}
  .brandmark{flex:none}
  .brandmark .wm{display:none}
  nav{margin-left:0;min-width:0;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav .seg{padding:7px 8px;font-size:12.5px;white-space:nowrap}
}


/* ============================================================
   DIRECTION D - LEDGER CARDS
   The exercise page adopts the home page's warm paper.

   The organising rule, and the reason each choice below is what
   it is: DARK IS THE MACHINE, PAPER IS THE DOCUMENT. The header
   rail and the code editor are where the computer speaks; every
   surface you read, check or are graded on is paper. Nothing is
   dark for decoration, which is what keeps this from being three
   borrowed styles in a stack.

   This reverses the older "dark chrome in both themes" decision
   for the SIDEBAR only - the header rail stays dark, so the app
   still announces itself as a tool in the first glance. See
   HANDOFF.md; that call was deliberate and this supersedes it
   for the sidebar alone.

   Every selector here already exists. No new class names, so
   this cannot become a fourth .sec / .bigmark / .rv collision.
   Delete this block wholesale to revert to the previous look.
   ============================================================ */

/* ---- 1. the sidebar becomes paper (the rail above stays dark) ---- */
.side{background:var(--paper);color:var(--ink);
  box-shadow:inset -1px 0 0 var(--rule)}
.railcap{color:var(--ink-3)}
.trk-btn:hover{background:var(--sunk)}
.trk-name{color:var(--ink)}
.trk-frac{color:var(--ink-3)}
.chev{color:var(--ink-3)}
.lvl{color:var(--ink-2)}
.lvl:hover{background:var(--sunk);color:var(--ink)}
.lvl[aria-current="true"]{background:var(--sunk);color:var(--ink)}
.tick{border-color:var(--rule-2)}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.side .btn.sec{background:var(--sunk);color:var(--ink-2)}
.side .btn.sec:hover{color:var(--ink)}

/* ---- 2. the right rail, ruled like a ledger margin ---- */
.side-r{background:var(--paper);box-shadow:inset 1px 0 0 var(--rule)}

/* ---- 3. the lesson sits on one card, on canvas ----
   A and C contributed this. The card is the only container the
   lesson needs; everything inside it is organised by rules, not
   by more boxes. */
main{background:var(--sheet);border:1px solid var(--rule);
  border-radius:var(--rl);box-shadow:var(--shade-1);
  margin:20px 22px 44px;padding:30px 34px 46px}

/* ---- 4. the lesson title, in the home page's serif ---- */
main h1.t-hero{font-family:Newsreader,Georgia,"Times New Roman",serif;
  font-weight:400;font-size:clamp(27px,3.3vw,37px);
  line-height:1.09;letter-spacing:-.02em}

/* ---- 5. B's ledger section heads ----
   Monospace, spaced, uppercase, over a hairline. A heavier rule
   would compete with the card's own edge. */
.grp > h3.t-head{font-family:"JetBrains Mono",monospace;
  font-size:11px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);
  border-bottom:1px solid var(--rule-2);padding-bottom:9px}

/* ---- 6. the editor is the machine ----
   `:has()` rather than a new class: any pane holding a code
   textarea is an editor, including the worked example, so the
   two never drift apart. */
.pane:has(> textarea.code){background:#1B1F24;border-color:#0E1013}
.pane:has(> textarea.code) .pane-bar{background:#14171B;
  border-bottom-color:#0E1013;color:#767C85;
  box-shadow:inset 0 1px 0 var(--tk)}
.pane:has(> textarea.code) textarea.code{color:#D6D9DE;background:transparent}
.pane:has(> textarea.code) textarea.code::placeholder{color:#5A616A}
.pane:has(> textarea.code) .acts{background:#14171B;border-top-color:#0E1013}
/* `Run` keeps its track gradient from the energise layer -- the
   primary action carries the track's identity, and on the dark
   editor it is the one warm thing on the panel. A flat fill here
   silently overrode that layer; a test caught it. */
.pane:has(> textarea.code) .acts .btn.sec{background:transparent;color:#9AA0A8;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pane:has(> textarea.code) .acts .btn.sec:hover{background:rgba(255,255,255,.06);color:#D6D9DE}
.pane:has(> textarea.code) .acts .btn.qui{color:#8FBCEC}

/* the rows come back on paper, inside the machine that fetched them */
.pane:has(> textarea.code) .out{background:var(--sheet);border-top:1px solid #0E1013}
.pane:has(> textarea.code) .outmsg{color:var(--ink-2)}

/* ---- 7. B's ruled result table ----
   Column heads sit over a hard rule; rows are separated by a
   stripe rather than a line, so a long result set stays quiet. */
table.g th{background:transparent;color:var(--ink-3);font-weight:500;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  border-bottom:1px solid var(--ink)}
table.g td{border-bottom:0}
table.g tbody tr:nth-child(odd) td{background:rgba(14,17,22,.022)}
table.g tbody tr:hover td{background:var(--tk-w)}

/* ---- 8. the verdict, stated over a rule ----
   Colour on the rule and the label, not a filled panel: this is
   a result, not an alert. The rule is on the state classes only,
   so the collapsed verdict never shows a stray line. */
.verdict{border-radius:0}
.verdict.pass{background:transparent;border-top:1px solid var(--ok);color:var(--ok)}
.verdict.fail{background:transparent;border-top:1px solid var(--bad);color:var(--bad)}
.verdict.hint{background:transparent;border-top:1px solid var(--warn);color:var(--warn)}

/* ---- 9. both themes ----
   In dark, the tokens already carry the sidebar and card to dark
   surfaces; only the two literal values above need restating. */
html[data-theme="dark"] table.g tbody tr:nth-child(odd) td{background:rgba(255,255,255,.028)}
html[data-theme="dark"] .tick.on{color:#0B0E12}

/* ---- 10. the level mark ----
   Was a filled capsule in green / amber / red: the difficulty-badge
   cliche, and the one element here that looked stamped out rather
   than designed. Traffic-light colour was also saying nothing true --
   an advanced lesson is not a warning.

   The levels are an ordered sequence, so the mark encodes rank
   instead: three segments, filled left to right. Monochrome, so the
   hue is free to keep meaning what it means everywhere else in the
   app (ok / warn / bad), and readable at a glance without a legend. */
.pill.l1,.pill.l2,.pill.l3{
  background:transparent;border-radius:0;padding:0;height:auto;gap:9px;
  color:var(--ink-2);font-weight:500;font-size:10.5px;letter-spacing:.14em}
.pill.l1::before,.pill.l2::before,.pill.l3::before{
  content:'';flex:none;width:22px;height:7px;
  background-image:linear-gradient(90deg,
    var(--s1) 0 6px, transparent 6px 8px,
    var(--s2) 8px 14px, transparent 14px 16px,
    var(--s3) 16px 22px)}
.pill.l1{--s1:var(--ink);--s2:var(--rule-2);--s3:var(--rule-2)}
.pill.l2{--s1:var(--ink);--s2:var(--ink);--s3:var(--rule-2)}
.pill.l3{--s1:var(--ink);--s2:var(--ink);--s3:var(--ink)}

/* Completed keeps the semantic green, but as a mark beside a word
   rather than a filled badge -- same family as the level segments. */
.pill.done{
  background:transparent;border-radius:0;padding:0;height:auto;gap:8px;
  color:var(--ok);font-weight:500;font-size:10.5px;letter-spacing:.14em}
.pill.done::before{content:'';flex:none;width:7px;height:7px;background:var(--ok)}

@media (max-width:860px){
  main{margin:12px;padding:22px 18px 34px}
}
@media (prefers-contrast:more){
  .grp > h3.t-head{border-bottom-color:var(--ink)}
  table.g tbody tr:nth-child(odd) td{background:transparent}
  .pill.l1,.pill.l2,.pill.l3{--s2:var(--ink-4);--s3:var(--ink-4)}
  .pill.l2{--s2:var(--ink)}
  .pill.l3{--s2:var(--ink);--s3:var(--ink)}
}


/* ============================================================
   DIRECTION D, PART 2
   Rail spacing, a larger wordmark, and a dark home page.
   ============================================================ */

/* ---- 11. right-rail cards had no horizontal padding ----
   `.card` ships `padding:16px 0 4px` -- zero left and right -- because
   in its original form it was a hairline-separated run of text, not a
   box. The energise layer later turned `.side-r .card` into a bordered,
   rounded, raised panel but never added side padding, so every label and
   value sat flush against the border. The 64px accent bar was offset
   `left:14px` to an edge that had no padding to align to.

   Padding added here, and the bar re-aligned to it. `:first-child` also
   needs its top padding back: the base rule zeroes it, which is right
   for a run of text and wrong for a panel. */
.side-r .card{padding:15px 16px 16px;margin-bottom:11px}
.side-r .card:first-child{padding-top:15px}
.side-r .card::before{left:16px;width:42px}
.side-r .card:last-child{margin-bottom:0}
.side-r .card h4{margin-bottom:9px}

/* ---- 12. a larger wordmark ----
   Newsreader sets "BENCH." at roughly 3.7em, so 216px runs about 800px
   -- still inside the 64rem (1024px) measure, and the 72px floor keeps
   it inside a 375px viewport with its 28px gutters. */
.bigmark{font-size:clamp(72px,14.5vw,216px)}

/* ---- 13. the home page in dark ----
   Warm paper has a warm dark, not a generic one: the canvas keeps the
   bone palette's slight warmth rather than going blue-black, so it reads
   as the same document at night instead of a different design. The
   pastels invert to deep tints with light foregrounds; every one of them
   clears 4.5:1 on this canvas, and --ink-mute measures 6.5:1.

   The pre-paint script in <head> already sets data-theme from
   prefers-color-scheme when nothing is stored, so this engages on its
   own for anyone whose system is dark. */
html[data-theme="dark"] .scrolldeck{
  --canvas:#141311;
  --surface:#1C1B18;
  --line:#2B2926;
  --ink-strong:#F5F3EE;
  --ink-body:#D5D1C8;
  --ink-mute:#9C988F;
  --p-red-bg:#2E1C1C;    --p-red:#E39A97;
  --p-blue-bg:#16283A;   --p-blue:#8FC3E8;
  --p-green-bg:#1B2A1D;  --p-green:#9AC79E;
  --p-yellow-bg:#2E2513; --p-yellow:#DCB765;
}
/* Values written as literals in the light design, which therefore cannot
   follow the tokens above. */
html[data-theme="dark"] .btn-hero{color:var(--canvas)}
html[data-theme="dark"] .btn-hero:hover{background:#DEDAD1}
html[data-theme="dark"] .lpill{color:var(--canvas)}
html[data-theme="dark"] .lpill:hover{background:#DEDAD1}
html[data-theme="dark"] .lnav,
html[data-theme="dark"] .lnav.tight{background:rgba(20,19,17,.82)}
html[data-theme="dark"] .us-code{color:var(--ink-body)}
html[data-theme="dark"] .us-btn.pri{color:var(--canvas)}
html[data-theme="dark"] .us-bar{background:#232220}
html[data-theme="dark"] .us-bar::before{background:#3A3833;
  box-shadow:15px 0 0 #3A3833, 30px 0 0 #3A3833}
html[data-theme="dark"] .step:hover{box-shadow:0 2px 10px rgba(0,0,0,.4)}

/* ---- 14. credit ----
   Sits in the footer beside the wordmark, at the size of the fine
   print around it. The links are the author's own. */
.vcredit{margin-top:16px;font-size:12.5px;line-height:1.6;color:var(--ink-mute);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vcredit a{color:var(--ink-body);text-decoration:none;
  box-shadow:inset 0 -1px 0 var(--line);
  transition:box-shadow 140ms ease, color 140ms ease}
.vcredit a:hover{color:var(--ink-strong);box-shadow:inset 0 -1px 0 var(--ink-strong)}
.vcredit .sep{color:var(--line);margin:0 8px}

/* The foil band is tuned for ink-on-paper: it dips DARKER than the
   letter, which on a dark canvas would erase it mid-sweep -- the same
   failure the light version was designed around, mirrored. On dark the
   band runs lighter instead, so the sweep only ever adds contrast. */
@supports ((background-clip:text) or (-webkit-background-clip:text)){
  html[data-theme="dark"] .bigmark .ltr > span{
    background-image:linear-gradient(105deg,
      var(--ink-strong) 0%,   var(--ink-strong) 38%,
      #C9C3B5 40%,            #FFFBF2 50%,          #C9C3B5 60%,
      var(--ink-strong) 68%,  var(--ink-strong) 100%)}
  html[data-theme="dark"] .bigmark .dot > span{
    background-image:none;-webkit-text-fill-color:var(--p-red)}
}


/* ============================================================
   DIRECTION D, PART 3
   The landing scroll position, and a theme toggle on the home page.
   ============================================================ */

/* ---- 15. opening a lesson landed under the header ----
   `goto()` ends with `main.scrollIntoView({block:'start'})`, which aligns
   main's top edge with the top of the VIEWPORT. The header is
   `position:fixed` and 56px tall, so main's first 56px -- the eyebrow and
   the top of the title -- sat behind it. Every lesson opened looking
   scrolled past its own beginning.

   `scroll-margin-top` is the fix rather than a JS offset: scrollIntoView
   honours it, so the one call site stays untouched and any future anchor
   into main gets the same clearance for free. The extra 20px matches the
   card's own top margin, so the card lands with its edge visible rather
   than flush under the header. */
main{scroll-margin-top:calc(var(--hdr) + 20px)}

/* ---- 16. the theme toggle on the home page ----
   Sits between the wordmark and Start, sized to the nav's own metrics.
   Quiet by default -- it is a preference, not the page's call to action,
   and Start must stay the only thing competing for a first click. */
.lthm{display:grid;place-items:center;width:30px;height:30px;flex:none;
  border-radius:5px;color:var(--ink-mute);background:transparent;
  transition:color 140ms ease, background-color 140ms ease}
.lthm svg{display:block}
@media (hover:hover) and (pointer:fine){
  .lthm:hover{color:var(--ink-strong);background:var(--p-yellow-bg)}
}
.lthm:active{transform:scale(.94)}
html[data-theme="dark"] .lthm:hover{background:#2A2723}


/* ---- 17. stat tiles pressed against their own dividers ----
   The same defect as the rail cards, in the other direction. `.stat` and
   `.fact` ship `padding:16px 18px 16px 0` -- 18px on the right, nothing on
   the left -- from a version where they were a plain row of figures. Each
   later gained a `border-right`, which means every tile after the first
   begins immediately at the previous tile's rule, with its number touching
   the line. Measured before: text at 0px from the tile's left edge, on all
   four tiles.

   Padding is symmetric now, except on the first tile, which keeps its flush
   left edge so the row still lines up with the prose above it. Below 860px
   the tiles stack and the right-hand rules become bottom rules, so the left
   padding comes off again and every tile aligns with the text column. */
.stat,.fact{padding:16px 18px}
.stats > .stat:first-child,
.facts > .fact:first-child{padding-left:0}
@media (max-width:860px){
  .stat,.fact{padding-left:0}
}


/* ---- 18. the mark ----
   Two drawings, not one scaled: `.hexmark` is the 24px cut (hexagon and
   letter only) because the full mark's node network and chevron stack
   close into a blur below roughly 40px. `.heromark` is the full drawing,
   used once, large, on the home page. Both are currentColor, so they
   invert with the theme rather than needing a second file. */
.hexmark{color:var(--frame-tx);flex:none}
.hexmark .tk{fill:var(--tk)}
.lmark{width:26px;height:26px;flex:none;color:var(--ink-strong)}
.heromark{display:block;width:clamp(64px,7.6vw,104px);height:auto;
  color:var(--ink-strong);margin:0 0 26px}
@media (prefers-reduced-motion:no-preference){
  .heromark{animation:markFadeIn .8s var(--eo) both;animation-delay:80ms}
}
@keyframes markFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}


/* ============================================================
   THE MARK
   The owner's render. Its ground is cut out (alpha from each pixel's
   distance below its own row's ground, then unpremultiplied, or the soft
   edges keep cream mixed in and halo on dark) and it is stored as WEBP,
   which holds a continuous-tone render at 34 KB where PNG needs 119 KB.

   Two cuts of the same object, chosen by theme rather than plated:
   the original oxblood on light grounds, a light rendering of it on dark
   ones. The light cut is not a hue change -- each pixel's own luminance
   is the mix factor between two light tones, so the bevels and the grain
   are the same object under different light.

   The frame is dark in BOTH themes, so the header always takes the light
   cut. The home page follows its theme.

   The mark appears in exactly two places: the header, and the footer
   beside the author's links. Not in the hero -- the wordmark carries
   that on its own.

/* ---- 20. the footer ----
   The reference supplied a black bar with a bright red name. The layout
   is kept -- author left, links right -- and the styling is not: this is
   the site's own paper, rule and ink, so the footer reads as the last
   line of the page rather than a widget pasted onto the end of it.

   Colours resolve through var() fallbacks rather than duplicated rules.
   The home page defines --canvas / --line / --ink-strong inside
   .scrolldeck; the app defines --paper / --rule / --ink. One rule set
   is therefore correct in both places, and a new surface gets it free.

   The GitHub and LinkedIn marks are the real ones, used to label links
   to the author's own profiles. That is what both companies' brand
   guidelines permit them for, and it is not what the no-brand-logos
   guardrail is about -- that rule exists so a track glyph cannot imply a
   tool vendor endorses the curriculum. */
.sitefoot{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px 32px;flex-wrap:wrap;
  padding:26px 34px 30px;
  background:var(--canvas, var(--paper));
  border-top:1px solid var(--line, var(--rule));
  color:var(--ink-mute, var(--ink-3))}
/* Direct child only. The app footer is a child of <body>; the home
   page renders its OWN copy inside #sdeck. `body.locked .sitefoot`
   matched both, so the credit was display:none on the landing page --
   which reads as "the footer was never added". */
body.locked > .sitefoot{display:none}

.sitefoot .fmark{width:26px;height:28px;align-self:center;
  background-image:var(--logo-here);background-size:contain;
  background-repeat:no-repeat;background-position:center;flex:none;
  margin-right:2px}
/* margin-right:auto rather than a wrapper element: with three flex
   children, space-between spread the mark away from the name it
   belongs to. This keeps mark+name as one group on the left. */
.sf-by{display:inline-flex;align-items:baseline;gap:11px;flex-wrap:wrap;
  margin-right:auto}
.sf-by i{
  font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-style:normal;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-mute, var(--ink-3))}
.sf-by b{
  font-family:Newsreader,Georgia,"Times New Roman",serif;
  font-weight:400;font-size:20px;letter-spacing:-.01em;
  color:var(--ink-strong, var(--ink))}

.sf-links{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.sf-links a{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13.5px;font-weight:500;letter-spacing:-.004em;text-decoration:none;
  color:var(--ink-body, var(--ink-2));
  transition:color 140ms ease}
.sf-links svg{width:15px;height:15px;flex:none;opacity:.72;transition:opacity 140ms ease}
@media (hover:hover) and (pointer:fine){
  .sf-links a:hover{color:var(--p-red, var(--tk))}
  .sf-links a:hover svg{opacity:1}
}
.sf-links a:focus-visible{
  outline:2px solid var(--p-red, var(--tk));outline-offset:4px;border-radius:3px}
@media (max-width:640px){
  .sitefoot{padding:22px 18px 26px;gap:14px}
  .sf-by b{font-size:18px}
  .sf-links{gap:20px}
}


/* ---- 21. accounts ----
   The dialog is created by auth-ui.js on first use, so these rules are
   the only cost carried by someone who never signs in. */
#acct.on{color:var(--frame-tx);background:var(--frame-2);
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--ok) 55%, transparent)}
.authwrap{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px}
.authwrap[hidden]{display:none}
.authscrim{position:absolute;inset:0;background:rgba(10,12,15,.55);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.authbox{position:relative;width:100%;max-width:392px;
  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--rl);
  box-shadow:var(--shade-3);padding:30px 30px 26px;max-height:90vh;overflow-y:auto}
.authx{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:6px;
  display:grid;place-items:center;color:var(--ink-3)}
.authx:hover{color:var(--ink);background:var(--sunk)}
.authbox h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:25px;
  letter-spacing:-.015em;color:var(--ink);margin:0 0 8px}
.authlede{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:0 0 20px}
.authlabel{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.authinput{width:100%;height:40px;padding:0 12px;border-radius:var(--rx);
  border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-size:14px}
.authinput:focus{outline:2px solid var(--tk);outline-offset:1px;border-color:transparent}
.authbtn{width:100%;height:42px;margin-top:12px;border-radius:var(--rx);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-size:14px;font-weight:600;border:1px solid var(--rule);
  background:var(--sheet);color:var(--ink);
  transition:background-color 140ms ease,border-color 140ms ease}
.authbtn:hover{background:var(--sunk)}
.authbtn.primary{background:var(--tk);color:#fff;border-color:transparent;margin-top:18px}
html[data-theme="dark"] .authbtn.primary{color:#0B0E12}
.authbtn.primary:hover{filter:brightness(1.07);background:var(--tk)}
.authbtn.ghost{color:var(--ink-3)}
.authbtn.google{margin-top:0}
.author{display:flex;align-items:center;gap:12px;margin:18px 0 2px;
  font-size:11px;color:var(--ink-4);font-family:"JetBrains Mono",monospace}
.author::before,.author::after{content:"";flex:1;height:1px;background:var(--rule)}
.authswap{margin:14px 0 0;font-size:12.5px;color:var(--ink-3);text-align:center}
.authlink{color:var(--tk);font-size:12.5px;font-weight:600;text-decoration:underline;
  text-underline-offset:2px}
.authmsg{margin:16px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-2);
  padding:10px 12px;border-radius:var(--rx);background:var(--sunk)}
.authmsg.bad{color:var(--bad);background:var(--bad-w)}
.authfine{margin:16px 0 0;font-size:11.5px;line-height:1.5;color:var(--ink-4)}
@media (max-width:460px){ .authbox{padding:26px 20px 22px} }

</style>

/* ============================================================

const LESSONS = {
'sql-0':{
  title:'Reading rows with SELECT and WHERE',
  scenario:'Your manager forwards a Slack message: <b>"Can you send me everyone in the Data team earning over 80k? Need it before the 2pm call."</b> This is the single most common request a junior analyst gets.',
  concept:`<p>Every SQL query answers two questions: <em>which columns</em> and <em>which rows</em>. <code>SELECT</code> picks columns, <code>WHERE</code> filters rows.</p>
<ul><li><code>SELECT *</code> means every column. Fine while exploring, bad in a report — nobody wants 40 columns.</li>
<li><code>WHERE</code> runs once per row and keeps the rows where the condition is true.</li>
<li>Text goes in single quotes: <code>'Data'</code>. Numbers don't: <code>80000</code>.</li>
<li><code>ORDER BY ... DESC</code> sorts highest first. <code>LIMIT</code> caps the rows returned.</li></ul>
<p>A trap worth learning now: <code>WHERE salary > 80000</code> excludes exactly 80,000. If the ask was "80k and above", you need <code>&gt;=</code>. Reports get sent back over this.</p>`,
  example:"SELECT name, department, salary\nFROM employees\nWHERE department = 'Data'\nORDER BY salary DESC;",
  task:'Return <code>name</code> and <code>salary</code> for everyone in the Data department earning more than 80000, highest salary first.',
  solution:"SELECT name, salary FROM employees WHERE department='Data' AND salary > 80000 ORDER BY salary DESC;",
  hint:'You need three pieces: a WHERE with two conditions joined by AND, and an ORDER BY ... DESC.'
},
'sql-1':{
  title:'Joins and group-level aggregation',
  scenario:'Finance is planning next year\'s headcount. They want one row per department: how many people are in it, what the average salary is, and whether it is under its budgeted headcount. <b>Departments with nobody in them must still appear</b> — that is the whole point of the exercise.',
  concept:`<p>Two ideas stack here, and the order matters.</p>
<p><b>Joins</b> match rows across tables. <code>INNER JOIN</code> keeps only rows that match on both sides. <code>LEFT JOIN</code> keeps every row from the left table and fills in <code>NULL</code> where the right side has no match. Finance asked for empty departments, so <code>LEFT JOIN</code> is not a stylistic choice — it is the requirement.</p>
<p><b>Aggregation</b> collapses many rows into one. <code>GROUP BY d.name</code> makes one output row per department; <code>COUNT()</code>, <code>AVG()</code>, <code>SUM()</code> then summarise each group.</p>
<p>The classic bug: <code>COUNT(*)</code> counts rows, and a department with no employees still produces one row full of NULLs — so it returns 1, not 0. <code>COUNT(e.id)</code> counts non-null values and correctly returns 0. Interviewers ask this.</p>`,
  example:"SELECT d.name AS department,\n       COUNT(e.id) AS headcount,\n       ROUND(AVG(e.salary), 0) AS avg_salary\nFROM departments d\nLEFT JOIN employees e ON e.department = d.name\nGROUP BY d.name\nORDER BY headcount DESC;",
  task:'One row per department with <code>name</code>, a <code>headcount</code> that is 0 for empty departments, and the <code>head_count_budget</code>. Sort by headcount, highest first.',
  solution:"SELECT d.name, COUNT(e.id) AS headcount, d.head_count_budget FROM departments d LEFT JOIN employees e ON e.department=d.name GROUP BY d.name, d.head_count_budget ORDER BY headcount DESC;",
  hint:'Finance is the empty department — if it is missing you used INNER JOIN; if it shows 1 you used COUNT(*).'
},
'sql-2':{
  title:'Window functions and CTEs',
  scenario:'The compensation review needs each employee ranked <b>within their own department</b>, plus how far each sits from their department average. One query, no manual per-department passes.',
  concept:`<p><code>GROUP BY</code> destroys detail — you get one row per group. Window functions keep every row and add a column computed over a group.</p>
<ul><li><code>OVER (PARTITION BY department ORDER BY salary DESC)</code> restarts the calculation for each department.</li>
<li><code>ROW_NUMBER()</code> always gives 1,2,3 with no ties. <code>RANK()</code> gives 1,2,2,4. <code>DENSE_RANK()</code> gives 1,2,2,3. Pick deliberately — for "top 3 per group" the choice changes your row count.</li>
<li><code>AVG(salary) OVER (PARTITION BY department)</code> puts the department average on every row of that department.</li></ul>
<p><b>CTEs</b> (<code>WITH name AS (...)</code>) name an intermediate result. They exist because you cannot filter on a window function in <code>WHERE</code> — the window runs after <code>WHERE</code>. So you compute in a CTE and filter in the outer query.</p>`,
  example:"WITH ranked AS (\n  SELECT name, department, salary,\n         RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS r\n  FROM employees\n)\nSELECT * FROM ranked WHERE r <= 2 ORDER BY department, r;",
  task:'Return the <b>single highest paid person per department</b> — columns <code>name</code>, <code>department</code>, <code>salary</code> — sorted by department name.',
  solution:"WITH r AS (SELECT name, department, salary, ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS rn FROM employees) SELECT name, department, salary FROM r WHERE rn=1 ORDER BY department;",
  hint:'Rank inside a CTE, then filter to rank 1 in the outer SELECT. Four departments have staff, so expect 4 rows.'
},

'python-0':{
  title:'Loading a file and looking before you leap',
  scenario:'A CSV lands in your inbox with no documentation. <b>Before you compute anything, you have to know what you are holding</b> — how many rows, what types, what is missing. Skipping this is how wrong numbers reach a slide deck.',
  concept:`<p>pandas gives you a <code>DataFrame</code>: a table with labelled columns and typed values.</p>
<ul><li><code>df.shape</code> → (rows, columns). Your first sanity check: does the row count match what you were told?</li>
<li><code>df.dtypes</code> → types. A price column typed <code>object</code> means text got in — a currency symbol, a stray comma — and every sum you write will be wrong or will crash.</li>
<li><code>df.head()</code> → first rows. <code>df.describe()</code> → count, mean, min, max per numeric column.</li>
<li><code>df.isna().sum()</code> → missing values per column. Do this before any average.</li></ul>
<p>The habit to build: never aggregate a column you have not inspected.</p>`,
  example:"import pandas as pd\n\ndf = pd.DataFrame({\n    'rep': ['Amira','Luca','Sara','Tom'],\n    'region': ['North','North','South','South'],\n    'revenue': [747, 594, 1899, 1600]\n})\n\nprint(df.shape)\nprint(df.dtypes)\nprint(df['revenue'].describe())",
  task:'Using the same <code>df</code>, print the total revenue and the number of unique regions — in that order, one per line.',
  solution:"import pandas as pd\ndf = pd.DataFrame({'rep':['Amira','Luca','Sara','Tom'],'region':['North','North','South','South'],'revenue':[747,594,1899,1600]})\nprint(df['revenue'].sum())\nprint(df['region'].nunique())",
  expect:"4840\n2",
  hint:'.sum() on the column, then .nunique() on the region column.'
},
'python-1':{
  title:'Cleaning what arrives broken',
  scenario:'The export you were sent has missing prices, duplicated order rows, and a revenue column that does not exist yet. <b>This is what most of the job actually is.</b> Analysts routinely spend more time here than on the analysis.',
  concept:`<p>Three moves cover most cleaning work.</p>
<ul><li><b>Missing values.</b> <code>df.dropna()</code> deletes rows. <code>df['x'].fillna(value)</code> replaces them. Deleting is not neutral — if prices are missing more often for one region, dropping them biases your regional totals. Say out loud which you chose and why.</li>
<li><b>Duplicates.</b> <code>df.drop_duplicates(subset=['order_id'])</code> beats a bare <code>drop_duplicates()</code>, which only removes rows identical in every column.</li>
<li><b>Derived columns.</b> <code>df['revenue'] = df['units'] * df['price']</code> works element-wise across the whole column at once. Writing a Python loop here is slower and marks you as new.</li></ul>`,
  example:"import pandas as pd\nimport numpy as np\n\ndf = pd.DataFrame({\n    'order_id':[1,2,2,3,4],\n    'units':[3,12,12,1,5],\n    'price':[249.0, 49.5, 49.5, np.nan, 320.0]\n})\n\ndf = df.drop_duplicates(subset=['order_id'])\ndf['price'] = df['price'].fillna(df['price'].median())\ndf['revenue'] = df['units'] * df['price']\nprint(df)",
  task:'From that cleaned frame, print the total revenue rounded to 2 decimals.',
  solution:"import pandas as pd, numpy as np\ndf = pd.DataFrame({'order_id':[1,2,2,3,4],'units':[3,12,12,1,5],'price':[249.0,49.5,49.5,np.nan,320.0]})\ndf = df.drop_duplicates(subset=['order_id'])\ndf['price'] = df['price'].fillna(df['price'].median())\ndf['revenue'] = df['units'] * df['price']\nprint(round(df['revenue'].sum(), 2))",
  expect:"3190.0",
  hint:'Deduplicate first, then fill, then multiply. Filling before deduplicating changes the median from 249.0 to 149.25, and the total with it.'
},
'python-2':{
  title:'groupby, and the shape your stakeholder wants',
  scenario:'"Revenue by region and category, and flag anything below 500." You have the rows. <b>The work is choosing the shape</b> — long for charting, wide for a table someone will read.',
  concept:`<p><code>groupby</code> splits rows into groups, applies a function, and combines the results.</p>
<ul><li><code>df.groupby('region')['revenue'].sum()</code> → one number per region.</li>
<li><code>.agg({'revenue':'sum','units':'mean'})</code> → different functions per column in one pass.</li>
<li>Grouping by two keys gives a MultiIndex. <code>.reset_index()</code> flattens it back to plain columns — do this before writing to CSV or charting, or the index will surprise you.</li>
<li><code>.pivot_table(index=..., columns=..., values=..., aggfunc='sum')</code> gives the wide cross-tab that non-technical readers expect.</li></ul>
<p>Long format for tools. Wide format for humans. Know which you are producing and for whom.</p>`,
  example:"import pandas as pd\n\ndf = pd.DataFrame({\n    'region':['North','North','South','South','East','East'],\n    'category':['HW','SW','HW','SW','HW','SW'],\n    'revenue':[747, 594, 1899, 1600, 1498, 1485]\n})\n\nwide = df.pivot_table(index='region', columns='category',\n                      values='revenue', aggfunc='sum')\nprint(wide)",
  task:'Print total revenue per region, sorted from highest to lowest.',
  solution:"import pandas as pd\ndf = pd.DataFrame({'region':['North','North','South','South','East','East'],'category':['HW','SW','HW','SW','HW','SW'],'revenue':[747,594,1899,1600,1498,1485]})\nprint(df.groupby('region')['revenue'].sum().sort_values(ascending=False))",
  expect:"region\nSouth    3499\nEast     2983\nNorth    1341\nName: revenue, dtype: int64",
  hint:'groupby, sum, then .sort_values(ascending=False).'
},

'excel-0':{
  title:'References, and why one dollar sign matters',
  scenario:'You build a commission column, drag it down twenty rows, and every value below the first is wrong. <b>This exact bug appears in real company spreadsheets constantly</b> and it comes down to one character.',
  concept:`<p>A reference like <code>B2</code> is <em>relative</em>: copy the formula down one row and it becomes <code>B3</code>. Usually that is what you want.</p>
<p>A reference like <code>$B$2</code> is <em>absolute</em>: it stays on B2 no matter where you copy it. Use it for a single fixed input — a tax rate, a commission percentage, an exchange rate sitting in one cell.</p>
<p>Mixed forms exist too: <code>$B2</code> locks the column, <code>B$2</code> locks the row. That is how one formula fills an entire grid correctly.</p>
<p>Start with the arithmetic that does not need locking. The grid below is live — type a formula in the bar and it evaluates against the visible data.</p>`,
  example:"=SUM(F2:F11)",
  task:'Write a formula that returns the <b>average</b> of the Revenue column (F2:F11).',
  solution:"=AVERAGE(F2:F11)",
  expect:1306.3,
  hint:'AVERAGE works exactly like SUM. The revenue column is F, rows 2 through 11.'
},
'excel-1':{
  title:'Conditional logic and lookups',
  scenario:'Sales wants a spreadsheet that labels each deal Large or Small, counts how many landed in each region, and pulls the target for that region from a second sheet. <b>Three formulas do all of it.</b>',
  concept:`<p><code>IF(test, value_if_true, value_if_false)</code> is the branch. Nesting more than two or three deep becomes unreadable — that is when you reach for <code>IFS</code> or a lookup table.</p>
<p>The conditional aggregates are the workhorses: <code>COUNTIF(range, criteria)</code>, <code>SUMIF(range, criteria, sum_range)</code>, and <code>AVERAGEIF</code>. Criteria can be text (<code>"North"</code>) or an expression in quotes (<code>"&gt;1000"</code>).</p>
<p><code>VLOOKUP(value, table, col_index, FALSE)</code> finds a row by its first column and returns another column from it. Always pass <code>FALSE</code> for exact match — the default is approximate and returns confidently wrong answers on unsorted data. Modern Excel has <code>XLOOKUP</code>, which fixes VLOOKUP's worst habits, but VLOOKUP still appears in interviews and legacy files.</p>`,
  example:'=COUNTIF(A2:A11, "North")',
  task:'Sum the Revenue column (F2:F11) for rows where the Region column (A2:A11) is <code>South</code>.',
  solution:'=SUMIF(A2:A11, "South", F2:F11)',
  expect:5242,
  hint:'SUMIF takes three arguments: the range to test, the criteria, and the range to add up.'
},
'excel-2':{
  title:'Building a summary the reader can trust',
  scenario:'A director asks for "one tab, the numbers that matter, no scrolling." <b>The skill is subtraction</b> — deciding what not to show, and making every number auditable back to the source rows.',
  concept:`<p>A summary block is a small set of named formulas, each pointing at raw data that lives elsewhere and is never edited by hand. Three rules keep it trustworthy:</p>
<ul><li><b>No hardcoded numbers.</b> A typed <code>1306.3</code> silently goes stale the moment the data updates. Every cell should be a formula.</li>
<li><b>One source of truth.</b> The raw rows live on one sheet; the summary references it. Copy-pasting values creates two versions that drift apart.</li>
<li><b>Label the ambiguous.</b> "Revenue" is not a unit. "Revenue, EUR, excl. VAT" is.</li></ul>
<p>Useful here: <code>MAX</code> and <code>MIN</code> for range, <code>COUNTA</code> for non-empty counts, <code>ROUND(x, 2)</code> to stop currency rendering to eight decimals.</p>`,
  example:"=ROUND(AVERAGE(F2:F11), 2)",
  task:'Return the <b>largest</b> value in the Revenue column (F2:F11), rounded to zero decimals.',
  solution:"=ROUND(MAX(F2:F11), 0)",
  expect:2560,
  hint:'Nest MAX inside ROUND, with 0 as the second argument to ROUND.'
},

'r-0':{
  title:'Data frames and the dplyr verbs',
  scenario:'You have joined a team that runs on R. <b>Everything they write is five verbs chained with a pipe</b>, and once you see the pattern the rest of their codebase opens up.',
  concept:`<p>dplyr names each operation after what it does, and <code>%>%</code> (or the newer <code>|></code>) passes the result of one into the next.</p>
<ul><li><code>filter()</code> keeps rows — pandas' boolean mask, SQL's WHERE.</li>
<li><code>select()</code> keeps columns.</li>
<li><code>mutate()</code> adds or overwrites a column.</li>
<li><code>arrange()</code> sorts; wrap a column in <code>desc()</code> for descending.</li>
<li><code>summarise()</code> collapses to one row, and paired with <code>group_by()</code> it becomes one row per group.</li></ul>
<p>Read a pipeline top to bottom as a sentence: take the data, then filter, then mutate, then arrange. It maps almost one-to-one onto SQL, which is why analysts move between the two easily.</p>`,
  example:"library(dplyr)\n\nstaff <- data.frame(\n  name = c(\"Amira\",\"Luca\",\"Sara\",\"Mei\"),\n  dept = c(\"Data\",\"Data\",\"Data\",\"Data\"),\n  salary = c(82000, 96000, 61000, 118000)\n)\n\nstaff %>%\n  filter(salary > 70000) %>%\n  mutate(monthly = round(salary / 12)) %>%\n  arrange(desc(salary))",
  output:"   name dept salary monthly\n1   Mei Data 118000    9833\n2  Luca Data  96000    8000\n3 Amira Data  82000    6833",
  task:'Write a pipeline that keeps only rows with <code>salary &gt;= 82000</code>, then returns the mean salary as a column named <code>avg_salary</code>.',
  solution:"staff %>%\n  filter(salary >= 82000) %>%\n  summarise(avg_salary = mean(salary))",
  hint:'filter first, then summarise with a named argument.'
},
'r-1':{
  title:'ggplot2 and the grammar of graphics',
  scenario:'Your chart has to go in a report that leaves the company. <b>Default styling reads as unfinished</b>, and ggplot gives you control over every layer without fighting a chart wizard.',
  concept:`<p>ggplot builds a plot in layers, each added with <code>+</code>.</p>
<ul><li><code>ggplot(data, aes(x =, y =, colour =))</code> maps columns to visual properties. This is the "aesthetic mapping" — nothing is drawn yet.</li>
<li><code>geom_point()</code>, <code>geom_col()</code>, <code>geom_line()</code> choose the marks.</li>
<li><code>geom_smooth(method = "lm")</code> overlays a fitted line. Set <code>se = FALSE</code> to drop the confidence band when it clutters.</li>
<li><code>labs()</code> sets titles and axis labels. An unlabelled axis is an unfinished chart.</li>
<li><code>theme_minimal()</code> strips the grey default panel.</li></ul>
<p>The discipline: one message per chart. If you cannot say in a sentence what the reader should take away, the chart is not ready.</p>`,
  example:"library(ggplot2)\n\nggplot(staff, aes(x = years_exp, y = salary)) +\n  geom_point(size = 3) +\n  geom_smooth(method = \"lm\", se = FALSE) +\n  labs(title = \"Salary rises with experience\",\n       x = \"Years of experience\",\n       y = \"Salary (EUR)\") +\n  theme_minimal()",
  output:"# Renders a scatter plot with a fitted straight line.\n# `geom_smooth(method = \"lm\")` prints a message naming\n# the formula it used: 'y ~ x'",
  task:'Adapt the example into a bar chart of salary by name, sorted, with a title. Use <code>geom_col()</code>.',
  solution:"ggplot(staff, aes(x = reorder(name, salary), y = salary)) +\n  geom_col() +\n  coord_flip() +\n  labs(title = \"Salary by employee\", x = NULL, y = \"Salary (EUR)\") +\n  theme_minimal()",
  hint:'reorder(name, salary) sorts the bars; coord_flip() makes long labels readable.'
},
'r-2':{
  title:'Fitting a model and reading the output',
  scenario:'"Does experience actually explain salary here, or are we imagining it?" <b>The answer is a model and an honest reading of its output</b> — including saying when the evidence is thin.',
  concept:`<p><code>lm(y ~ x1 + x2, data = df)</code> fits a linear model. <code>summary(model)</code> prints what matters:</p>
<ul><li><b>Estimate</b> — the change in y for a one-unit change in x, holding the others fixed. This is the number people quote.</li>
<li><b>Std. Error</b> — how uncertain that estimate is. A large estimate with a larger standard error is not a finding.</li>
<li><b>p-value</b> — the probability of seeing an effect this large if the true effect were zero. It is not the probability the effect is real, and it says nothing about whether the effect is big enough to matter.</li>
<li><b>R-squared</b> — the share of variance explained. High R-squared on training data can simply mean you overfit.</li></ul>
<p>The professional move is to state the estimate, its uncertainty, and the limits of the data — small n, observational, confounders. Overclaiming from a model is the fastest way to lose a stakeholder's trust.</p>`,
  example:"model <- lm(salary ~ years_exp, data = staff)\nsummary(model)\n\n# Predict and score on held-out rows\npreds <- predict(model, newdata = test_staff)\nrmse  <- sqrt(mean((preds - test_staff$salary)^2))",
  output:"Coefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)  45231.7     6104.2   7.410 4.21e-06\nyears_exp     6412.9      982.5   6.527 1.83e-05\n\nMultiple R-squared:  0.7623,  Adjusted R-squared:  0.7444\n\n# Read: each extra year is associated with about\n# EUR 6,400 more salary. R-squared 0.76 on 15 rows —\n# suggestive, not conclusive.",
  task:'Extend the model to include <code>dept</code> as a second predictor, then print the summary.',
  solution:"model2 <- lm(salary ~ years_exp + dept, data = staff)\nsummary(model2)",
  hint:'Add predictors with +. R converts the text column into indicator variables for you.'
},

'pbi-0':{
  title:'Getting data in, and fixing it before it lands',
  scenario:'Someone hands you a messy export and asks for a dashboard by Friday. <b>Every minute spent cleaning in Power Query is a minute you never spend again</b> — the steps replay automatically on next month\'s file.',
  concept:`<p>Power BI has two stages, and beginners conflate them.</p>
<p><b>Power Query</b> is where data is loaded and reshaped. Each action you take is recorded as a step in a list. When new data arrives with the same structure, all the steps rerun. Cleaning here is permanent; cleaning by hand in Excel first is not.</p>
<p>The steps that matter most: promote the first row to headers, set each column's data type explicitly, remove blank and error rows, and unpivot columns when months are spread across columns instead of down rows.</p>
<p><b>The model</b> is where tables relate to each other. A star schema — one central fact table of events, small dimension tables of attributes around it — is what Power BI is built for. One flat wide table works for a demo and then becomes unmaintainable.</p>
<p>Type your columns properly. A date stored as text will not sort chronologically, and no amount of DAX fixes it downstream.</p>`,
  example:"Query steps recorded by Power Query:\n\n1. Source            → Csv.Document(File.Contents(\"sales.csv\"))\n2. Promoted Headers  → first row becomes column names\n3. Changed Type      → order_date: Date, revenue: Decimal\n4. Removed Errors    → drops rows that failed conversion\n5. Filtered Rows     → revenue <> null",
  task:'Name the four cleaning steps you would apply to a monthly sales export where months sit across columns, then say why unpivoting matters.',
  solution:"Promote headers, set explicit types, remove error and blank rows,\nand unpivot the month columns into two columns: Month and Value.\n\nUnpivoting matters because visuals and time intelligence need one\nrow per observation. Twelve month columns cannot be plotted as a\nsingle time series or filtered by a date slicer.",
  hint:'The reshaping step is the one with a specific name — think about what turns wide into long.'
},
'pbi-1':{
  title:'Choosing visuals that answer the question',
  scenario:'Your first dashboard draft has nine charts and the director asks "so what?" <b>The fix is almost always fewer visuals</b>, arranged so the answer is the first thing seen.',
  concept:`<p>The visual follows the question, not the other way round.</p>
<ul><li><b>One current number</b> → a card. Not a one-bar bar chart.</li>
<li><b>Comparing categories</b> → a bar chart, horizontal when labels are long. Ranked, not alphabetical.</li>
<li><b>Change over time</b> → a line chart. Time runs left to right, always.</li>
<li><b>Part of a whole</b> → a stacked bar. Pie charts fail past three slices because people cannot compare angles.</li>
<li><b>Many values across two categories</b> → a matrix or heatmap, not fifteen small charts.</li></ul>
<p>Layout carries meaning too: readers scan top-left first, so the headline number goes there and the detail goes below. Slicers belong together on one edge, not scattered.</p>
<p>Build a layout below — the tiles render live.</p>`,
  task:'Configure the builder so it answers "which category earns the most, and how has total revenue moved through the year?" Then mark this done.',
  solution:"A card for total revenue, a bar chart of revenue by category sorted\ndescending, and a line chart of revenue by month.\n\nThree visuals, one question each. The card answers 'how much',\nthe bar answers 'where from', the line answers 'which direction'.",
  hint:'Two questions were asked, plus a headline number. That is three visuals, not nine.'
},
'pbi-2':{
  title:'DAX: measures, columns, and context',
  scenario:'Your total revenue card reads correctly until someone clicks a slicer, and then it shows the same number for every region. <b>You wrote a calculated column where you needed a measure.</b>',
  concept:`<p>The distinction that trips up everyone learning DAX:</p>
<ul><li>A <b>calculated column</b> is computed once per row when data loads and stored in the model. It does not react to slicers.</li>
<li>A <b>measure</b> is computed on demand, in whatever filter context the visual is in. Slice by region and it recalculates for that region.</li></ul>
<p>Rule of thumb: if it aggregates, make it a measure. Columns are for row-level attributes you will group or filter by.</p>
<p><code>CALCULATE</code> is the one function to really learn — it evaluates an expression with the filter context modified:</p>
<ul><li><code>CALCULATE([Revenue], ALL(Sales))</code> ignores filters, giving a grand total for share-of-total ratios.</li>
<li><code>CALCULATE([Revenue], DATESYTD(Calendar[Date]))</code> gives year-to-date, provided you have a proper marked date table.</li></ul>
<p>Time intelligence silently misbehaves without a dedicated date table with continuous dates. Build one before you need it.</p>`,
  example:"Revenue = SUMX(Sales, Sales[quantity] * Sales[unit_price])\n\nRevenue YTD =\nCALCULATE([Revenue], DATESYTD('Calendar'[Date]))\n\nRevenue PY =\nCALCULATE([Revenue], SAMEPERIODLASTYEAR('Calendar'[Date]))\n\nYoY % =\nDIVIDE([Revenue] - [Revenue PY], [Revenue PY])",
  task:'Write a measure giving each category\'s share of total revenue, and explain why <code>ALL</code> is required.',
  solution:"Category Share % =\nDIVIDE(\n    [Revenue],\n    CALCULATE([Revenue], ALL(Sales[category]))\n)\n\nALL removes the category filter from the denominator only, so it\nstays the grand total while the numerator stays filtered to the\ncurrent row's category. Without ALL, both sides are filtered\nidentically and every row returns 100%.\n\nUse DIVIDE, not '/', because DIVIDE returns blank instead of an\nerror when the denominator is zero.",
  hint:'The numerator is filtered, the denominator must not be. One function removes a filter.'
}
};
</script>
